<!doctype html>
<html lang="ja">
<head>

<title>ロケット ◯◯mまで終われません（試作）</title>
<style>
@font-face{font-family:MPR;src:url(./font/mpr.woff2) format('woff2');font-weight:900;font-display:swap}
@font-face{font-family:DELA;src:url(./font/dela.woff2) format('woff2');font-display:swap}
html,body{margin:0;height:100%;background:#03060f;overflow:hidden;font-family:MPR,'Hiragino Sans','Noto Sans JP',sans-serif;font-weight:900;color:#fff;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#testBtn{position:absolute;right:1em;top:.7em;font:inherit;font-size:2em;padding:.25em .9em;border-radius:1.2em;border:.12em solid #fff;background:#0a1730;color:#fff;z-index:8;cursor:pointer}
#tp{grid-template-columns:repeat(4,1fr) !important;position:absolute;left:3em;right:3em;top:9em;max-height:92em;overflow:auto;box-sizing:border-box;background:rgba(8,16,40,.95);border:.3em solid #2c4a86;border-radius:2em;padding:2em;z-index:9;display:grid;grid-template-columns:repeat(3,1fr);gap:1.2em}
#tp[hidden]{display:none}
#tp button{font:inherit;font-size:2em;padding:.45em .2em;border-radius:.6em;border:0;color:#fff;cursor:pointer;line-height:1.25}
#tp .j{background:#c0392b}#tp .h{background:#1f9a55}#tp .n{background:#42558a}#tp .g{background:#8a6d1f}

#tp h3{grid-column:1/-1;margin:.2em 0 -.3em;font-size:2.4em;color:#9fb6e6}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1080" height="1080"></canvas>
  <button id="testBtn" type="button">テスト</button>
  <div id="tp" hidden>
    <h3>無料・1コイン（妨害になる）</h3>
    <button class="j" data-a="comment">コメント<br>隕石（耐久 −1）</button><button class="j" data-a="like">いいね×100<br>魔法使い 1体</button><button class="j" data-a="heartme">ハートミー<br>ドラゴン襲来</button><button class="n" data-a="follow">フォロー<br>大きく加速</button>
    <h3>お助け</h3>
    <button class="h" data-a="fuel">エネルギー補給<br>耐久・パワー全回復</button><button class="h" data-a="boost">ブースター<br>10秒 3倍速</button><button class="h" data-a="shield">天使の加護<br>攻撃を1回防ぐ（3回分まで）</button><button class="h" data-a="heart">ハート<br>耐久 ＋1</button><button class="h" data-a="bomb">カミナリ<br>ドラゴンか魔法使いを1体消す</button><button class="h" data-a="buddy">おとも<br>20秒 弾を3発まで受ける</button><button class="h" data-a="hero">勇者<br>ゴールが −100,000m 近づく（呪いを斬る）</button><button class="h" data-a="dome">バリアドーム<br>15秒 弾をはね返す</button><button class="h" data-a="roulUp">ゴール−ルーレット<br>ゴールが 100〜1,000m 近づく</button><button class="h" data-a="fairy">妖精の粉<br>15秒 小さくなって当たりにくい</button><button class="h" data-a="pad">加速板<br>ふれると1.5秒 加速</button><button class="h" data-a="astro">宇宙飛行士<br>＋10,000m 引っぱる</button><button class="h" data-a="samurai">侍<br>敵と弾をすべて斬る＋全回復＋混乱解除</button><button class="h" data-a="stop">時間停止<br>10秒 敵と弾が止まる</button><button class="h" data-a="phoenix">不死鳥<br>＋2000m 運ぶ間は無敵</button>
    <button class="h" data-a="save">セーブ（天使）<br>落ちてもここから</button><button class="h" data-a="crow">カラス<br>＋200m 運んでくれる</button><span></span>
    <h3>機体ガチャ（30秒で元にもどる）</h3>
    <button class="g" data-a="gacha">機体ガチャ<br>3機からランダムで30秒変身</button><button class="g" data-s="gold">ゴールド<br>速度2倍</button><button class="g" data-s="dragon">ドラゴン<br>障害物無効</button>
    <button class="g" data-s="mega">メガロケット<br>体力2倍</button><span></span><span></span>
    <h3>音</h3>
    <button class="g" id="optBgm">BGM</button><button class="g" id="optSe">効果音</button><span></span>
    <h3>妨害</h3>
    <button class="j" data-a="meteor">隕石<br>耐久 −1</button><button class="j" data-a="stall">エンジン停止<br>6秒 落ちていく</button>
    <button class="j" data-a="hole">ブラックホール<br>−500m</button><button class="j" data-a="crash">撃墜（機械クジラ）<br>飲みこまれて即ついらく</button><button class="j" data-a="dragonAtk">ドラゴン襲来<br>火球3発（当たれば耐久−1）</button>
    <!-- 減速板はいったんお休み（絵 img/pad_dn.webp と Game.slowpad は残してある。戻すときはここにボタンを足す） --><button class="j" data-a="vamp">吸血鬼<br>15秒 コウモリの嵐（当たると耐久−1）</button><button class="j" data-a="unsave">セーブ解除（魔女）<br>セーブ地点を消す</button><button class="j" data-a="tengu">天狗<br>うちわの大風 3回（横に強く流される）</button><button class="j" data-a="maou">魔王<br>ゴールが ＋100,000m 遠ざかる</button><button class="j" data-a="roulDown">ゴール＋ルーレット<br>ゴールが 100〜1,000m 遠ざかる</button><button class="j" data-a="jelly">クラゲの群れ<br>30秒 6匹がいすわる（ふれると耐久−1）</button><button class="j" data-a="storm">雷雲<br>落雷を5回（予告あり・1本はねらってくる）</button><button class="j" data-a="blackout">チョウチンアンコウ<br>10秒 まっ暗（ライトの先だけ見える）</button><button class="j" data-a="ufo">UFO<br>15秒 操作が上下左右とも逆（必ず当たる）</button><button class="j" data-a="garg">ガーゴイル<br>しがみつかれると落ちていく（振り落とせる）</button><button class="j" data-a="bird">小鳥<br>当たると一瞬おそくなる</button><button class="j" data-a="ice">氷の怪鳥<br>凍って−1000m＋30秒 速さ半分</button><button class="j" data-a="wizard">魔法使い<br>追ってくる魔法1発（耐久−1）</button>
    <h3>目標の高さ（変えると0からやり直し）</h3>
    <button class="g" data-g="1000">1,000m</button><button class="g" data-g="5000">5,000m</button><button class="g" data-g="10000">10,000m</button>
    <button class="g" data-g="50000">50,000m</button><button class="g" data-g="100000">100,000m</button><button class="n" data-a="reset">記録を消す</button>
  </div>
</div>
<script>
'use strict';
/* ロケット「◯◯mまで飛ぶまで終われません」
   ロケットは勝手に上がる。コメント＝隕石、いいね＝魔法使い、ハートミー＝ドラゴンで、無料の行動はぜんぶ妨害になる。
   燃料が切れると墜落して0mからやり直し。目標の高さに届いたらクリア。配信者の操作はいらない。 */
const W=1080, H=1700, cv=document.getElementById('cv'), g=cv.getContext('2d'), stage=document.getElementById('stage');
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, pick=a=>a[Math.floor(Math.random()*a.length)];
const FONT="MPR,'Hiragino Sans','Noto Sans JP',sans-serif", FONTD="DELA,"+FONT;
const CFG={ goal:10000, speed:25, powDecay:.05, comment:.12, like:.006, follow:.5, hp:3, boostSec:10, boostMul:3, stallSec:6, stallFall:30, hole:500, warp:500, ppm:20 };
/* 絵（チャッピー製）。読めていない間は何も描かない */
const IMG={}; function img(k,src){ const im=new Image(); im.src='./img/'+src; IMG[k]=im; return im; }
for(const k of ['std','stealth','gold','dragon','crystal','mega']) img('ship_'+k,'ship_'+k+'.png');
for(const k of ['d_balloon','d_plane','d_gull','d_blimp','d_sat','d_ufo','d_planet','d_astro','fx_meteor','fx_hole','fx_shield','fx_tank','moon','cloud0','cloud1','cloud2','cloud3','cloud4']) img(k,k+'.png');
img('pad','pad.jpg'); img('flame','flame.jpg');
for(const k of ['smoke_w','smoke_b','logo_crash','logo_boost','logo_goal','logo_stall','logo_dodge','logo_m500','logo_p500','panel','heart','heart_off','mega','gate','isle','marker','burnt','moonastro','earth','deb0','deb1','deb2','deb3','deb4','deb5']) img(k,k+'.webp');
for(const k of ['boom','ring','bolt','warp','bflame','pillar','lines','stars']) img(k,k+'.jpg'); const wizSh=mkSheet('wiz',{n:51,cols:8,fw:420,fh:337,fps:12});   // 真上から見た魔法使い（ふわふわ→杖を突き出す→ふわふわ）
img('wiz_face','wiz_face.jpg'); img('buddy_face','buddy_face.jpg'); for(const k of ['bud_fly','bud_guard','bud_wave']) img(k,k+'.webp');   // おともロボ（飛ぶ・盾・手を振る）
img('thunder_face','thunder_face.jpg'); img('thunder','thunder.webp'); img('tburst','tburst.webp');   // 落ちる雷と、落ちた所の爆発 img('morb','morb.webp'); img('mburst','mburst.webp');
img('breath','breath.webp'); img('iceburst','iceburst.webp');   // 氷のブレスと氷の爆発（透明つき）
/* 連番シート（色の絵 _c.jpg と 透明度の絵 _a.png を合わせて使う）。くりんぐの動画から作った動く絵用 */
function mkSheet(name,meta){ const o=Object.assign({cv:null,ok:false},meta), c=new Image(), a=new Image(); let n=0;
  const done=()=>{ if(++n<2 || !c.naturalWidth || !a.naturalWidth) return; const cv=document.createElement('canvas'); cv.width=c.naturalWidth; cv.height=c.naturalHeight; const x=cv.getContext('2d'); x.drawImage(c,0,0); x.globalCompositeOperation='destination-in'; x.drawImage(a,0,0,cv.width,cv.height); o.cv=cv; o.ok=true; };
  c.onload=done; a.onload=done; c.src='./img/'+name+'_c.jpg'; a.src='./img/'+name+'_a.png'; return o; }
const drgSh=mkSheet('drg',{n:54,cols:8,fw:480,fh:253,fps:12});   // 真上から見たドラゴン。コマ0〜20＝羽ばたき1回ぶん、20〜53＝翼を広げて頭を突き出し吠える
for(const k of ['bird0','bird1','bird2','bird3','ice','shard0','shard1','shard2','shard3','shard4','shard5']) img(k,k+'.webp');   // 小鳥4ポーズ、氷のかたまりと破片
const ibSh=mkSheet('ibird',{n:24,cols:8,fw:480,fh:253,fps:12});   // 真上から見た氷の怪鳥（羽ばたき2回ぶん）
/* 全画面の映像（くりんぐ）。高い妨害の最初に流す。流している間はゲームを止める */
function mkVid(name){ const v=document.createElement('video'); v.preload='auto'; v.playsInline=true; v.setAttribute('playsinline',''); for(const [ext,type] of [['webm','video/webm'],['mp4','video/mp4']]){ const sc=document.createElement('source'); sc.src='./vid/'+name+'.'+ext; sc.type=type; v.appendChild(sc); } try{ v.load(); }catch(e){} return v; }
const VID={icebird:{v:mkVid('icebird'),dur:5.8},phoenix:{v:mkVid('phoenix'),dur:4.3},hole:{v:mkVid('hole'),dur:4.9},whale:{v:mkVid('whale'),dur:5.5},astro:{v:mkVid('astro'),dur:8.9},vamp:{v:mkVid('vamp'),dur:5.0},stop:{v:mkVid('stop'),dur:5.0},goal:{v:mkVid('goal'),dur:9.9},samurai:{v:mkVid('samurai'),dur:4.7},storm:{v:mkVid('storm'),dur:5.0},jelly:{v:mkVid('jelly'),dur:5.0},maou:{v:mkVid('maou'),dur:9.8},hero:{v:mkVid('hero'),dur:9.9}};
img('hslash','hslash.webp'); const heSh=mkSheet('hero',{n:30,cols:8,fw:260,fh:379,fps:10});   /* 正面向きの勇者の全身（剣をかかげる→振り下ろす→かまえる） */
const HERO={sub:100000,gain:10000,inT:.6,hit:1.6,life:3.6,outT:.6,rate:1.5,h:620,y:500,move:1.4};   /* 勇者：ゴールを近づける高さ、呪いが無いときに進む高さ、現れる秒数、剣を振り下ろす時刻、いる秒数、消える秒数、コマ送りの速さ、絵の高さと位置、進むのにかける秒数 */
img('mcircle','mcircle.webp'); const moSh=mkSheet('maou',{n:48,cols:8,fw:400,fh:300,fps:10});   /* 正面向きの魔王の全身（腕を広げる→上げる→こぶしを握る） */
const MAOU={add:100000,inT:.7,hit:2.5,life:4.6,outT:.7,rate:1.25,w:900,y:520};   /* 魔王：ゴールに足す高さ、現れる秒数、こぶしを握ってゴールが遠ざかる時刻、いる秒数、消える秒数、コマ送りの速さ、絵の横幅と位置 */
img('jzap','jzap.webp'); const jfSh=mkSheet('jelly',{n:24,cols:8,fw:224,fh:216,fps:10}), jfCv=[];   /* 横から見た光るクラゲ（ふくらむ→縮むの1周） */
function jellyCv(i){ if(!jfSh.ok) return null; if(jfCv[i]) return jfCv[i]; if(i===0) return jfCv[0]=jfSh.cv; const c=document.createElement('canvas'); c.width=jfSh.cv.width; c.height=jfSh.cv.height; const x=c.getContext('2d'); x.drawImage(jfSh.cv,0,0); try{ const d=x.getImageData(0,0,c.width,c.height), q=d.data; for(let k=0;k<q.length;k+=4){ const r=q[k], gg=q[k+1], b=q[k+2]; if(i===1){ q[k]=b; q[k+1]=r; q[k+2]=gg; } else { q[k]=gg; q[k+1]=b; q[k+2]=r*.6+b*.4; } } x.putImageData(d,0,0); }catch(e){} return jfCv[i]=c; }   /* 色ちがい：0＝水色、1＝ピンク、2＝黄みどり */
const JELLY={n:6,sec:30,inT:1.3,outT:1.1,w:205,hx:66,hy:52,by:.3};   /* クラゲ：数、いすわる秒数、来る・帰る秒数、絵の横幅、傘の当たり幅と高さの半分、傘の中心が絵の上からどこか */
for(const k of ['scloud','sbolt','sspark']) img(k,k+'.webp');
const STORM={inT:.8,vol:5,per:4,warn:1.0,zap:.38,gap:.5,hw:62,min:210,outT:.8,cy:150};   /* 雷雲：雲が広がる秒数、落とす回数、1回の本数、予告の秒数、光る秒数、次までの間、雷の当たり幅の半分、雷どうしの最小間かく、雲が消える秒数、雲の高さの位置 */
function stormAim(){ const xs=[clamp(RXw()+rand(-30,30),XL+90,XL+XW-90)]; let guard=0; while(xs.length<STORM.per && guard++<200){ const x=rand(XL+90,XL+XW-90); if(xs.every(q=>Math.abs(q-x)>=STORM.min)) xs.push(x); } return xs; }
img('slash','slash.webp'); const samSh=mkSheet('sam',{n:40,cols:8,fw:480,fh:273,fps:12});   /* 正面向きの侍（コマ0＝振り抜いた姿、33あたりで刀を納めきる） */
const SAM={kill:1.72,life:2.6,rate:1.6,w:640,y:460,cx:.31};   /* 侍：刀を納めて敵が消える時刻、いる秒数、コマ送りの速さ、絵の横幅と位置、体の中心が絵の左からどこにあるか */
img('clock','clock.webp'); const STOP={sec:10,max:30,kinds:{fball:1,morb:1,bat:1,meteor:1,bird:1}};   /* 時間停止：止まる秒数、重ねたときの上限、解けたときに砕ける弾の種類 */
const asSh=mkSheet('astro',{n:21,cols:8,fw:240,fh:405,fps:12});   /* ロープを引く宇宙飛行士（つながる21コマ） */
img('rescue','rescue.webp');
const AST={gain:10000,inT:2.1,pull:4.2,h:250,up:290,sw:215,win:{x:.5,y:.378,r:.226}};   /* 宇宙飛行士：乗りこむまでの秒数、ゴールまで引っぱる秒数、宇宙飛行士の絵の高さ、救助ロケットがいる高さ（自機より上）、救助ロケットの横幅、窓の位置と大きさ */   /* 宇宙飛行士：来る秒数、ゴールまで引っぱる秒数、絵の高さ、ロケットより上にいる距離、手の高さの位置 */
const inv=()=>!!(S.phx || S.astro);   /* 不死鳥か宇宙飛行士に運ばれている間は攻撃が効かない */
const whSh=mkSheet('whale',{n:48,cols:8,fw:480,fh:312,fps:12});   /* 正面向きの機械クジラ（コマ0〜24＝口を開ける、24〜30＝開ききり、33〜42＝閉じる） */
const WH={grow:1.5,hold:.35,snap:.2,stay:.55,out:.6,w0:240,w1:2100,my:.54};   /* 撃墜のクジラ：迫ってくる秒数、口を開けたまま止まる秒数、閉じる秒数、いすわる秒数、消える秒数、最初と最後の横幅、口の高さの位置 */
img('bhole','bhole.webp'); img('stall_face','stall_face.jpg');
const phxSh=mkSheet('phx',{n:19,cols:8,fw:400,fh:343,fps:12});   /* 真上から見た不死鳥（羽ばたき1回ぶん） */
const HOLE={T:3.6,drop:2.3};   /* ブラックホール：画面に出ている秒数、落ちきるまでの秒数 */
const PHX={gain:2000,inT:.8,lift:2.6,outT:.9,w:680,flapK:1.5,oy:80};   /* 不死鳥：上げる高さ、下から来る秒数、運ぶ秒数、飛び去る秒数 */
function phxGo(n){ if(S.mode!=='fly') return; S.phx={t:0,by:n,gain:Math.max(0,Math.min(PHX.gain,CFG.goal-S.alt)),done:false}; S.frz=null; S.slowT=0; S.flash=Math.max(S.flash,.6); }
img('drg_face','drg_face.jpg'); img('angel_face','angel_face.jpg'); for(const k of ['wingL','wingR','halo','fea0','fea1','fea2','fea3','fea4']) img(k,k+'.webp');   // 天使の加護：翼・輪っか・羽根                                   // カットイン用の顔（まだ無い間は出さない）
/* 音：くりんぐの動画の音や効果音ラボの音を鳴らす */
/* 音：効果音は効果音ラボ、BGMは甘茶の音楽工房「夏休みの探検」。耳にささる高い音はあらかじめけずってある。全画面映像の音はくりんぐのもの */
const SND_KEYS=['bad', 'bats', 'bgm', 'bite', 'bless', 'boom', 'boost', 'bubble', 'buddy', 'coins', 'crow', 'cut', 'dark', 'dome', 'don', 'dragon', 'fairy', 'fall', 'fanfare', 'flame', 'gara', 'glass', 'grab', 'guard', 'gust', 'heal', 'hit', 'holy', 'hslash', 'iai', 'ibird', 'ice', 'jakon', 'kaminari', 'levelup', 'noto', 'quake', 'refl', 'save', 'siren', 'speed', 'thunder', 'tstop', 'ufo', 'witch', 'wizard', 'zap'], sndBuf={}, sndLast={}; let actx=null, seGain=null, bgmGain=null, bgmSrc=null; window.__sfx=[];
const OPTS=(()=>{ try{ return Object.assign({bgm:1,se:1},JSON.parse(localStorage.getItem('rocket_snd')||'{}')); }catch(e){ return {bgm:1,se:1}; } })();
function sndInit(){ if(actx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; try{ actx=new AC(); }catch(e){ return; } seGain=actx.createGain(); seGain.connect(actx.destination); bgmGain=actx.createGain(); bgmGain.gain.value=0; bgmGain.connect(actx.destination);
  for(const k of SND_KEYS) fetch('./snd/'+k+'.mp3').then(r=>r.arrayBuffer()).then(b=>actx.decodeAudioData(b,buf=>{ sndBuf[k]=buf; if(k==='bgm') bgmStart(); },()=>{})).catch(()=>{}); }
function bgmStart(){ if(bgmSrc || !actx || !sndBuf.bgm) return; bgmSrc=actx.createBufferSource(); bgmSrc.buffer=sndBuf.bgm; bgmSrc.loop=true; bgmSrc.connect(bgmGain); bgmSrc.start(); }

function fit(){ const w=Math.min(window.innerWidth,window.innerHeight); stage.style.width=w+'px'; stage.style.height=w+'px'; stage.style.top=((window.innerHeight-w)/2)+'px'; stage.style.fontSize=(w/108)+'px'; }

function goalUI(){ tp.querySelectorAll('button[data-g]').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.g,10)===CFG.goal)); }
document.getElementById('testBtn').onclick=()=>{ tp.hidden=!tp.hidden; goalUI(); };
tp.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const n=pick(NAMES); if(b.dataset.g){ Game.setGoal(parseInt(b.dataset.g,10)); } else if(b.dataset.s){ Game.ship(b.dataset.s,n); } else { const a=b.dataset.a; if(a==='like') Game.like(100,n); else if(a==='reset') Game.reset(); else Game[a](n); } tp.hidden=true; });
// 操作：画面を押したまま動かすと、動かした分だけロケットが動く（指でロケットが隠れない）。パソコンはマウスのドラッグか矢印キー
cv.style.touchAction='none';
cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty}; try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
cv.addEventListener('pointermove',e=>{ if(!drag || S.mode!=='fly') return; const r=cv.getBoundingClientRect(), k=cv.width/r.width/K*1.2; drag.lx=e.clientX; drag.ly=e.clientY; S.tx=clamp(drag.tx+(e.clientX-drag.x)*k*(S.conf>0?-1:1),-MOVE.x,MOVE.x); S.ty=clamp(drag.ty+(e.clientY-drag.y)*k*(S.conf>0?-1:1),MOVE.up,MOVE.dn); e.preventDefault(); });
for(const ev of ['pointerup','pointercancel']) cv.addEventListener(ev,()=>{ drag=null; });

let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(!window.__frozen){ update(dt); draw(); } requestAnimationFrame(loop); }
const VER='1124-123723'; (function(){ if(VER.indexOf('__')===0) return; const chk=()=>{ if(S && S.mode==='fly' && S.alt>40) return; fetch('./ver.txt?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{ t=(t||'').trim(); if(!/^[0-9-]{6,12}$/.test(t) || t===VER) return; let done=''; try{ done=sessionStorage.getItem('rocket_upd')||''; }catch(e){} if(done===t) return; try{ sessionStorage.setItem('rocket_upd',t); }catch(e){} location.replace(location.pathname+'?v='+t+location.hash); }).catch(()=>{}); }; chk(); setInterval(chk,45000); })();
{ const up=()=>{ const b=document.getElementById('optBgm'), e=document.getElementById('optSe'); if(b) b.innerHTML='BGM<br>'+(OPTS.bgm?'オン':'オフ'); if(e) e.innerHTML='効果音<br>'+(OPTS.se?'オン':'オフ'); try{ localStorage.setItem('rocket_snd',JSON.stringify(OPTS)); }catch(_){} }; for(const [id,k] of [['optBgm','bgm'],['optSe','se']]){ const el=document.getElementById(id); if(el) el.addEventListener('click',ev=>{ ev.stopPropagation(); OPTS[k]=OPTS[k]?0:1; up(); }); } up(); }
