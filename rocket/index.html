<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ロケット ◯◯mまで終われません（試作）</title>
<style>
@font-face{font-family:MPR;src:url(./font/mpr.woff2) format('woff2');font-weight:900;font-display:swap}
@font-face{font-family:DELA;src:url(./font/dela.woff2) format('woff2');font-display:swap}
html,body{margin:0;height:100%;background:#03060f;overflow:hidden;font-family:MPR,'Hiragino Sans','Noto Sans JP',sans-serif;font-weight:900;color:#fff;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#testBtn{position:absolute;right:1em;top:.7em;font:inherit;font-size:2em;padding:.25em .9em;border-radius:1.2em;border:.12em solid #fff;background:#0a1730;color:#fff;z-index:8;cursor:pointer}
#tp{grid-template-columns:repeat(4,1fr) !important;position:absolute;left:3em;right:3em;top:9em;max-height:92em;overflow:auto;box-sizing:border-box;background:rgba(8,16,40,.95);border:.3em solid #2c4a86;border-radius:2em;padding:2em;z-index:9;display:grid;grid-template-columns:repeat(3,1fr);gap:1.2em}
#tp[hidden]{display:none}
#tp button{font:inherit;font-size:2em;padding:.45em .2em;border-radius:.6em;border:0;color:#fff;cursor:pointer;line-height:1.25}
#tp .j{background:#c0392b}#tp .h{background:#1f9a55}#tp .n{background:#42558a}#tp .g{background:#8a6d1f}
#tp .on{outline:.18em solid #ffd23f}
#tp h3{grid-column:1/-1;margin:.2em 0 -.3em;font-size:2.4em;color:#9fb6e6}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1080" height="1080"></canvas>
  <button id="testBtn" type="button">テスト</button>
  <div id="tp" hidden>
    <h3>無料（コメント・いいね）</h3>
    <button class="n" data-a="comment">コメント<br>少し加速</button><button class="n" data-a="like">いいね×50<br>少し加速</button><button class="n" data-a="follow">フォロー<br>大きく加速</button>
    <h3>お助け</h3>
    <button class="h" data-a="fuel">エネルギー補給<br>耐久・パワー全回復</button><button class="h" data-a="boost">ブースター<br>10秒 3倍速</button><button class="h" data-a="shield">バリア<br>妨害を1回防ぐ</button>
    <button class="h" data-a="save">セーブ<br>落ちてもここから</button><button class="h" data-a="warp">ワープ<br>＋500m</button><span></span>
    <h3>機体交換（落ちるまで続く）</h3>
    <button class="g" data-s="stealth">ステルス<br>妨害を2回よける</button><button class="g" data-s="gold">ゴールド<br>速さ1.5倍</button><button class="g" data-s="dragon">ドラゴン<br>3倍速＋隕石無効</button>
    <button class="g" data-s="crystal">クリスタル<br>パワーが減らない</button><button class="g" data-s="mega">メガロケット<br>耐久2倍</button><span></span>
    <h3>妨害</h3>
    <button class="j" data-a="leak">パワーダウン<br>応援パワー0</button><button class="j" data-a="meteor">隕石<br>耐久 −1</button><button class="j" data-a="stall">エンジン停止<br>6秒 落ちていく</button>
    <button class="j" data-a="hole">ブラックホール<br>−500m</button><button class="j" data-a="crash">撃墜<br>即ついらく</button><span></span>
    <h3>目標の高さ（変えると0からやり直し）</h3>
    <button class="g" data-g="1000">1,000m</button><button class="g" data-g="5000">5,000m</button><button class="g" data-g="10000">10,000m</button>
    <button class="g" data-g="50000">50,000m</button><button class="g" data-g="100000">100,000m</button><button class="n" data-a="reset">記録を消す</button>
  </div>
</div>
<script>
'use strict';
/* ロケット「◯◯mまで飛ぶまで終われません」
   ロケットは勝手に上がる。燃料は時間で減り、コメント・いいね・お助けギフトで増える。
   燃料が切れると墜落して0mからやり直し。目標の高さに届いたらクリア。配信者の操作はいらない。 */
const W=1080, H=1700, cv=document.getElementById('cv'), g=cv.getContext('2d'), stage=document.getElementById('stage');
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, pick=a=>a[Math.floor(Math.random()*a.length)];
const FONT="MPR,'Hiragino Sans','Noto Sans JP',sans-serif", FONTD="DELA,"+FONT;
const CFG={ goal:5000, speed:25, powDecay:.05, comment:.12, like:.006, follow:.5, hp:3, boostSec:10, boostMul:3, stallSec:6, stallFall:30, hole:500, warp:500, ppm:20 };
/* 絵（チャッピー製）。読めていない間は何も描かない */
const IMG={}; function img(k,src){ const im=new Image(); im.src='./img/'+src; IMG[k]=im; return im; }
for(const k of ['std','stealth','gold','dragon','crystal','mega']) img('ship_'+k,'ship_'+k+'.png');
for(const k of ['d_balloon','d_plane','d_gull','d_blimp','d_sat','d_ufo','d_planet','d_astro','fx_meteor','fx_hole','fx_shield','fx_tank','moon','cloud0','cloud1','cloud2','cloud3','cloud4']) img(k,k+'.png');
img('pad','pad.jpg'); img('flame','flame.jpg');
const ok=k=>IMG[k] && IMG[k].naturalWidth>0;
/* 機体：h=画面での高さ fw=炎の太さ hue=炎の色あい（度） と性能 */
const SHIPS={
  std:    {name:'ノーマル',   h:330, fw:120, hue:0,   spd:1,   decay:1, hp:3, perk:''},
  stealth:{name:'ステルス',   h:430, fw:96,  hue:-28, spd:1,   decay:1, hp:3, dodge:2, perk:'妨害を2回よける'},
  gold:   {name:'ゴールド',   h:370, fw:118, hue:14,  spd:1.5, decay:1, hp:3, perk:'速さ1.5倍'},
  dragon: {name:'ドラゴン',   h:430, fw:120, hue:-14, spd:1,   decay:1, hp:3, fireproof:true, boost:true, perk:'10秒3倍速＋隕石が効かない'},
  crystal:{name:'クリスタル', h:400, fw:120, hue:170, spd:1,   decay:0, hp:3, perk:'応援パワーが減らない'},
  mega:   {name:'メガロケット',h:420, fw:150, hue:0,   spd:1,   decay:1, hp:6, multi:true, perk:'耐久が2倍'}
};
const flameC={}; function flameFor(hue){ if(!ok('flame')) return null; if(flameC[hue]) return flameC[hue]; const c=document.createElement('canvas'); c.width=IMG.flame.naturalWidth; c.height=IMG.flame.naturalHeight; const x=c.getContext('2d'); if(hue) x.filter='hue-rotate('+hue+'deg) saturate(1.25)'; x.drawImage(IMG.flame,0,0); x.filter='none'; try{ const d=x.getImageData(0,0,c.width,c.height), q=d.data; for(let i=0;i<q.length;i+=4){ const m=Math.max(q[i],q[i+1],q[i+2]); if(m>0){ const k=255/m; q[i]=Math.min(255,q[i]*k); q[i+1]=Math.min(255,q[i+1]*k); q[i+2]=Math.min(255,q[i+2]*k); } q[i+3]=Math.min(255,m*1.35); } x.putImageData(d,0,0); }catch(e){} flameC[hue]=c; return c; }
let padC=null; function padCanvas(){ if(padC || !ok('pad')) return padC; const im=IMG.pad, c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; const x=c.getContext('2d'); x.drawImage(im,0,0); x.globalCompositeOperation='destination-in'; const gr=x.createLinearGradient(0,0,0,620); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)'); x.fillStyle=gr; x.fillRect(0,0,c.width,c.height); padC=c; return c; }
const PAD_Y=1506;   // 発射台の絵の中で、台の上面がある高さ
const RY=830, K=.72, XL=-230, XW=1540, SH=1080;   // 場面は0.72倍に縮めて描く。K=縮尺 XL〜XL+XW=場面の横の見える範囲 SH=画面の高さ   // ロケットが立っている画面上の高さ
let S, best=0, tries=1, wins=0, T=0;
try{ const o=JSON.parse(localStorage.getItem('rocket_save')||'{}'); best=o.best||0; tries=o.tries||1; wins=o.wins||0; if(o.goal) CFG.goal=o.goal; }catch(e){}
function save(){ try{ localStorage.setItem('rocket_save',JSON.stringify({best,tries,wins,goal:CFG.goal})); }catch(e){} }
function newRun(keepTries){ S={ mode:'fly', alt:0, pow:.2, hp:CFG.hp, holeT:0, holeDrop:0, rings:[], boostT:0, stallT:0, shield:false, ship:'std', dodge:0, shipT:9, saveAlt:0, fallV:0, fallT:0, clearT:0, shake:0, flash:0, red:0, log:(S&&S.log)||[], parts:[], banner:null, items:[], nextItem:0, warn:0 }; if(!keepTries) tries=1; }
function logAdd(text,color){ S.log.push({text,color:color||'#fff'}); if(S.log.length>3) S.log.shift(); }
function banner(text,color,sub){ S.banner={text,color,sub:sub||'',t:0}; }
function fmt(n){ return Math.floor(n).toLocaleString(); }
const Game={
  comment(n){ addPow(CFG.comment); logAdd((n||'だれか')+' の応援でスピードアップ','#b9ffb0'); },
  like(c){ addPow(CFG.like*(c||1)); },
  follow(n){ addPow(CFG.follow); logAdd((n||'だれか')+' がフォロー！一気にスピードアップ','#b9ffb0'); },
  fuel(n){ if(S.mode!=='fly') return; S.pow=1; S.hp=SHIPS[S.ship].hp; S.tankT=0; S.flash=.3; logAdd((n||'だれか')+' がエネルギー補給（耐久とパワー全回復）','#5dffb0'); },
  boost(n){ if(S.mode!=='fly') return; S.boostT=CFG.boostSec; S.stallT=0; ring(W/2,RY+150,'#bff3ff'); banner('ブースター！','#5dffb0',n); logAdd((n||'だれか')+' がブースターに点火','#5dffb0'); },
  shield(n){ S.shield=true; logAdd((n||'だれか')+' がバリアを張った','#5dffb0'); },
  save(n){ if(S.mode!=='fly') return; S.saveAlt=S.alt; banner('セーブ！','#5dffb0',fmt(S.alt)+'m'); logAdd((n||'だれか')+' が '+fmt(S.alt)+'m でセーブした','#5dffb0'); },
  warp(n){ if(S.mode!=='fly') return; S.alt=Math.min(CFG.goal,S.alt+CFG.warp); S.flash=.5; banner('＋'+CFG.warp+'m','#5dffb0',n); logAdd((n||'だれか')+' がワープさせた','#5dffb0'); },
  leak(n){ if(jamBlocked(n,'パワーダウン')) return; S.pow=0; S.red=.4; S.shake=.4; banner('パワーダウン','#ff3d5a',n); logAdd((n||'だれか')+' が応援パワーを0にした','#ff9aa8'); },
  meteor(n){ if(jamBlocked(n,'隕石')) return; S.items.push({k:'meteor',x:rand(160,920),y:-260,vx:0,vy:500,hit:false,by:n}); logAdd((n||'だれか')+' が隕石を落とした（耐久−1）','#ff9aa8'); },
  stall(n){ if(jamBlocked(n,'エンジン停止')) return; S.stallT=CFG.stallSec; S.boostT=0; S.red=.5; banner('エンジン停止！','#ff3d5a',n); logAdd((n||'だれか')+' がエンジンを止めた','#ff9aa8'); },
  hole(n){ if(jamBlocked(n,'ブラックホール')) return; S.holeT=2.2; S.holeDrop+=Math.min(S.alt,CFG.hole); S.shake=.5; banner('−'+CFG.hole+'m','#c58bff',n); logAdd((n||'だれか')+' がブラックホールで引きずり下ろした','#ff9aa8'); },
  crash(n){ if(jamBlocked(n,'撃墜')) return; logAdd((n||'だれか')+' がロケットを撃ち落とした','#ff9aa8'); startFall(); },
  ship(k,n){ if(S.mode!=='fly' || !SHIPS[k]) return; const sp=SHIPS[k]; S.ship=k; S.shipT=0; S.dodge=sp.dodge||0; S.hp=sp.hp; S.flash=.5; S.shake=.3; ring(W/2,RY,'#ffe680',true); if(sp.boost){ S.boostT=CFG.boostSec; S.stallT=0; } banner(sp.name+'！','#ffd23f',(n?n+'　':'')+sp.perk); logAdd((n||'だれか')+' が機体を「'+sp.name+'」に交換した','#ffd23f'); for(let i=0;i<40;i++) S.parts.push({k:'conf',x:W/2+rand(-60,60),y:RY,vx:rand(-520,520),vy:rand(-620,220),g:500,t:rand(.8,1.6),c:pick(['#ffd400','#fff','#4cc3ff','#ff5c8a']),r:rand(8,16),rot:rand(0,6),vr:rand(-9,9)}); },
  setGoal(v){ CFG.goal=v; best=0; newRun(); save(); logAdd('目標を '+fmt(v)+'m にした','#ffd23f'); },
  reset(){ best=0; tries=1; wins=0; newRun(); save(); }
};
function addPow(v){ if(S.mode!=='fly') return; S.pow=Math.min(1,S.pow+v); }
function ring(x,y,c,big){ S.rings.push({x,y,c,t:0,big:!!big}); }
function damage(n){ S.hp-=1; S.red=.5; if(S.hp<=0){ S.hp=0; logAdd('耐久が0になった！','#ff5c5c'); startFall(); } }
function jamBlocked(n,what){ if(S.mode!=='fly') return true; if(S.shield){ S.shield=false; S.flash=.3; banner('バリアで防いだ！','#9be9ff',what); logAdd('バリアが '+(n||'だれか')+' の'+what+'を防いだ','#9be9ff'); return true; } if(S.dodge>0){ S.dodge--; S.dodgeT=.5; banner('よけた！','#c9d3e2',what+'（あと'+S.dodge+'回）'); logAdd('ステルスが '+(n||'だれか')+' の'+what+'をよけた','#c9d3e2'); return true; } return false; }
function startFall(){ if(S.mode!=='fly') return; S.mode='fall'; S.fallV=0; S.fallT=0; S.boostT=0; S.stallT=0; S.red=.6; S.shake=.6; banner('ついらく…','#ff3d5a',S.saveAlt>0?'セーブ地点 '+fmt(S.saveAlt)+'m からやり直し':'0m からやり直し'); }
function update(dt){ T+=dt; S.shake=Math.max(0,S.shake-dt); S.flash=Math.max(0,S.flash-dt); S.red=Math.max(0,S.red-dt); if(S.banner){ S.banner.t+=dt; if(S.banner.t>2.4) S.banner=null; }
  S.shipT+=dt; for(const r of S.rings) r.t+=dt; S.rings=S.rings.filter(r=>r.t<.7); if(S.holeT>0){ S.holeT-=dt; if(S.holeDrop>0 && S.mode==='fly'){ const d=Math.min(S.holeDrop,CFG.hole*dt/1.3); S.holeDrop-=d; S.alt=Math.max(0,S.alt-d); } } else S.holeDrop=0; if(S.dodgeT>0) S.dodgeT-=dt; if(S.tankT!==undefined) S.tankT+=dt;
  if(S.mode==='fly'){ const sp=SHIPS[S.ship]; S.pow=Math.max(0,S.pow-CFG.powDecay*sp.decay*dt); let v=CFG.speed*sp.spd*(1+S.pow);
    if(S.boostT>0){ S.boostT-=dt; v*=CFG.boostMul; } else if(S.stallT>0){ S.stallT-=dt; v=-CFG.stallFall; if(Math.random()<dt*14) S.parts.push({k:'smoke',x:W/2+rand(-30,30),y:RY+140,vx:rand(-80,80),vy:rand(-320,-120),g:0,t:rand(.6,1.1),r:rand(30,60),dark:1,rot:rand(0,6),v:Math.floor(rand(0,3))}); }
    if(S.holeT>0 && S.holeDrop>0) v=0;
    S.alt=Math.max(0,S.alt+v*dt); if(S.alt>best){ best=S.alt; }
    if(S.stallT>0 && S.alt<=0){ S.stallT=0; }
    if(S.alt>=CFG.goal){ S.alt=CFG.goal; S.mode='clear'; S.clearT=0; wins++; best=CFG.goal; save(); banner('到達！','#ffd23f',fmt(CFG.goal)+'m　'+tries+'回目で成功'); logAdd(fmt(CFG.goal)+'m に到達！ おつかれさま','#ffd23f'); for(let i=0;i<160;i++) S.parts.push({k:'conf',x:rand(0,W),y:rand(-200,600),vx:rand(-200,200),vy:rand(-300,100),g:420,t:rand(2.5,5),c:pick(['#ff3d7f','#ffd400','#22d3ee','#7cff4f','#ff8a1f','#b86bff','#fff']),r:rand(10,20),rot:rand(0,6),vr:rand(-8,8)}); }
    // 炎とけむり
    const fl=S.stallT>0?0:(S.boostT>0?3:1); for(let i=0;i<fl;i++) if(Math.random()<.5) S.parts.push({k:'fire',x:W/2+rand(-22,22),y:RY+170,vx:rand(-50,50),vy:rand(420,760)*(S.boostT>0?1.5:1),g:0,t:rand(.25,.5),r:rand(16,34)});
    // 大気の中では白いけむりの尾を引く
    if(S.stallT<=0 && S.alt/CFG.goal<.5 && Math.random()<dt*(S.alt<60?46:16)) S.parts.push({k:'smoke',x:W/2+rand(-26,26),y:RY+300,vx:rand(-90,90)*(S.alt<60?3:1),vy:rand(300,620),g:0,t:rand(.7,1.3),r:rand(40,90),rot:rand(0,6),v:Math.floor(rand(0,3))}); }
  else if(S.mode==='fall'){ S.fallT+=dt; S.fallV=Math.min(2600,S.fallV+900*dt+S.alt*.9*dt); const floor=S.saveAlt>0?S.saveAlt:0; S.alt=Math.max(floor,S.alt-S.fallV*dt);
    if(Math.random()<dt*60) S.parts.push({k:'smoke',x:W/2+rand(-36,36),y:RY-60,vx:rand(-70,70),vy:rand(-900,-400),g:0,t:rand(.6,1.2),r:rand(40,90),dark:1,rot:rand(0,6),v:Math.floor(rand(0,3))}); if(Math.random()<dt*50) S.parts.push({k:'fire',x:W/2+rand(-30,30),y:RY-80,vx:rand(-60,60),vy:rand(-700,-300),g:0,t:rand(.25,.5),r:rand(24,50)});
    if(S.alt<=floor && S.fallT>1.2){ const keep=S.saveAlt; tries++; save(); const lg=S.log; newRun(true); S.log=lg; if(keep>0){ S.alt=keep; logAdd('セーブ地点 '+fmt(keep)+'m から再出発（'+tries+'回目）','#9be9ff'); } else { S.shake=1; S.flash=.5; ring(W/2,RY+140,'#ffd9a0',true); for(let i=0;i<46;i++) S.parts.push({k:'smoke',x:W/2+rand(-200,200),y:RY+150,vx:rand(-420,420),vy:rand(-520,-40),g:160,t:rand(.9,1.9),r:rand(60,130),dark:i%2,rot:rand(0,6),v:i%3}); for(let i=0;i<40;i++) S.parts.push({k:'fire',x:W/2+rand(-120,120),y:RY+120,vx:rand(-620,620),vy:rand(-720,-60),g:500,t:rand(.4,.9),r:rand(24,60)}); for(let i=0;i<26;i++) S.parts.push({k:'conf',x:W/2+rand(-60,60),y:RY+100,vx:rand(-700,700),vy:rand(-900,-200),g:1400,t:rand(.8,1.6),c:pick(['#5a5f6b','#2a2f3a','#8a8f9b']),r:rand(8,18),rot:rand(0,6),vr:rand(-12,12)}); logAdd('0m からやり直し（'+tries+'回目の挑戦）','#ff9aa8'); } } }
  else if(S.mode==='clear'){ S.clearT+=dt; if(Math.random()<dt*14) S.parts.push({k:'conf',x:rand(0,W),y:-20,vx:rand(-120,120),vy:rand(60,260),g:300,t:rand(3,5),c:pick(['#ff3d7f','#ffd400','#22d3ee','#7cff4f','#fff']),r:rand(10,20),rot:rand(0,6),vr:rand(-8,8)}); }
  // 隕石：上から落ちてきてロケットに当たる
  for(const it of S.items){ if(it.k==='meteor'){ it.vy+=3200*dt; it.y+=it.vy*dt; it.x+=(W/2-it.x)*Math.min(1,dt*3.2); for(let q=0;q<2;q++) if(Math.random()<dt*70) S.parts.push({k:'fire',x:it.x+rand(-30,30),y:it.y-60,vx:rand(-50,50),vy:rand(-300,-80),g:0,t:rand(.25,.55),r:rand(30,64)}); if(Math.random()<dt*30) S.parts.push({k:'smoke',x:it.x+rand(-20,20),y:it.y-90,vx:rand(-40,40),vy:rand(-200,-60),g:0,t:rand(.5,.9),r:rand(36,70),dark:1,rot:rand(0,6),v:0});

  { const x=40, y0=320, y1=850, hh=y1-y0, f=clamp(S.pow,0,1); g.fillStyle='rgba(8,14,34,.6)'; rr(x-20,y0-26,56,hh+52,22); g.fill(); g.fillStyle='#1a2338'; rr(x-7,y0,30,hh,10); g.fill();
    const gr=g.createLinearGradient(0,y1,0,y0); gr.addColorStop(0,'#4cc3ff'); gr.addColorStop(.6,'#5dffb0'); gr.addColorStop(1,'#ffe14d'); g.fillStyle=S.boostT>0?'#ffffff':gr; if(f>.01){ rr(x-7,y1-hh*f,30,hh*f,10); g.fill(); }
    txt('応援',x+8,y0-52,26,'#fff','center','#0a1730'); txt('×'+(1+S.pow).toFixed(1),x+8,y1+52,30,'#ffe14d','center','#0a1730'); }
  if(S.boostT>0) txt('ブースター 残り '+Math.ceil(S.boostT)+'秒',W/2,892,36,'#4cc3ff','center','#04203a');
  if(S.stallT>0) txt('エンジン停止 残り '+Math.ceil(S.stallT)+'秒',W/2,892,36,'#ff5c5c','center','#2a0008');
  if(S.banner){ const b=S.banner, k=1+1.6*Math.pow(clamp(1-b.t/.2,0,1),2), a=clamp((2.4-b.t)/.4,0,1); g.save(); g.globalAlpha=a; g.translate(W/2,330); g.scale(k,k); g.shadowColor='rgba(0,0,0,.6)'; g.shadowBlur=30; txt(b.text,0,0,b.text.length>7?92:124,b.color,'center','#0a0f20',FONTD); g.shadowBlur=0; if(b.sub) txt(b.sub,0,92,36,'#fff','center','#0a0f20'); g.restore(); }
  if(S.mode==='clear' && S.clearT>2.2){ g.save(); g.globalAlpha=clamp((S.clearT-2.2)/.5,0,1); g.fillStyle='rgba(8,14,34,.82)'; rr(160,400,760,270,36); g.fill(); g.strokeStyle='#ffd23f'; g.lineWidth=8; g.stroke(); txt('おつかれさま！',W/2,474,72,'#ffd23f','center','#3a1d00',FONTD); txt(tries+'回目の挑戦で '+fmt(CFG.goal)+'m に到達',W/2,560,38,'#fff','center'); txt('画面をタップでもう一度',W/2,622,30,'#9fb6e6','center'); g.restore(); }
  /* ====== 下のログ ====== */
  g.fillStyle='rgba(8,14,34,.9)'; g.fillRect(0,930,W,150); g.fillStyle='#2c4a86'; g.fillRect(0,930,W,5);
  S.log.slice(-2).forEach((l,i)=>{ g.font='900 30px '+FONT; let s2=l.text; while(g.measureText(s2).width>W-60 && s2.length>4) s2=s2.slice(0,-2); txt(s2,30,966+i*44,30,l.color,'left'); });
  txt('コメント・いいねでスピードアップ　落とされたら0mからやり直し',W/2,1058,24,'#ffd23f','center'); }
function fit(){ const w=Math.min(window.innerWidth,window.innerHeight); stage.style.width=w+'px'; stage.style.height=w+'px'; stage.style.top=((window.innerHeight-w)/2)+'px'; stage.style.fontSize=(w/108)+'px'; }
fit(); window.addEventListener('resize',fit);
const tp=document.getElementById('tp'), NAMES=['たぬ吉','ぽんた','みけ','そら','りく','はな','こてつ','もも','ゆず','まる'];
function goalUI(){ tp.querySelectorAll('button[data-g]').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.g,10)===CFG.goal)); }
document.getElementById('testBtn').onclick=()=>{ tp.hidden=!tp.hidden; goalUI(); };
tp.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const n=pick(NAMES); if(b.dataset.g){ Game.setGoal(parseInt(b.dataset.g,10)); } else if(b.dataset.s){ Game.ship(b.dataset.s,n); } else { const a=b.dataset.a; if(a==='like') Game.like(50); else if(a==='reset') Game.reset(); else Game[a](n); } tp.hidden=true; });
cv.addEventListener('pointerdown',()=>{ if(S.mode==='clear' && S.clearT>2.4){ newRun(); save(); logAdd('もう一度 '+fmt(CFG.goal)+'m に挑戦','#ffd23f'); } });
newRun(true); logAdd(fmt(CFG.goal)+'m まで飛ぶまで終われません！','#ffd23f');
let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(!window.__frozen){ update(dt); draw(); } requestAnimationFrame(loop); }
window.RocketGame=Game; window.__dbg={ get S(){ return S; }, CFG, update, draw, get tries(){ return tries; }, get best(){ return best; }, get wins(){ return wins; } };
Promise.all([document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()].concat(Object.values(IMG).map(im=>new Promise(r=>{ if(im.complete) r(); else { im.onload=r; im.onerror=r; } })))).then(()=>{ window.__ready=true; requestAnimationFrame(loop); });
</script>
