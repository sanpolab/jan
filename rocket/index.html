<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ロケット ◯◯mまで終われません（試作）</title>
<style>
@font-face{font-family:MPR;src:url(./font/mpr.woff2) format('woff2');font-weight:900;font-display:swap}
@font-face{font-family:DELA;src:url(./font/dela.woff2) format('woff2');font-display:swap}
html,body{margin:0;height:100%;background:#03060f;overflow:hidden;font-family:MPR,'Hiragino Sans','Noto Sans JP',sans-serif;font-weight:900;color:#fff;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#testBtn{position:absolute;right:1em;top:.7em;font:inherit;font-size:2em;padding:.25em .9em;border-radius:1.2em;border:.12em solid #fff;background:#0a1730;color:#fff;z-index:8;cursor:pointer}
#tp{grid-template-columns:repeat(4,1fr) !important;position:absolute;left:3em;right:3em;top:9em;max-height:92em;overflow:auto;box-sizing:border-box;background:rgba(8,16,40,.95);border:.3em solid #2c4a86;border-radius:2em;padding:2em;z-index:9;display:grid;grid-template-columns:repeat(3,1fr);gap:1.2em}
#tp[hidden]{display:none}
#tp button{font:inherit;font-size:2em;padding:.45em .2em;border-radius:.6em;border:0;color:#fff;cursor:pointer;line-height:1.25}
#tp .j{background:#c0392b}#tp .h{background:#1f9a55}#tp .n{background:#42558a}#tp .g{background:#8a6d1f}
#tp .on{outline:.18em solid #ffd23f}
#tp h3{grid-column:1/-1;margin:.2em 0 -.3em;font-size:2.4em;color:#9fb6e6}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1080" height="1080"></canvas>
  <button id="testBtn" type="button">テスト</button>
  <div id="tp" hidden>
    <h3>無料（コメント・いいね）</h3>
    <button class="n" data-a="comment">コメント<br>少し加速</button><button class="n" data-a="like">いいね×50<br>少し加速</button><button class="n" data-a="follow">フォロー<br>大きく加速</button>
    <h3>お助け</h3>
    <button class="h" data-a="fuel">エネルギー補給<br>耐久・パワー全回復</button><button class="h" data-a="boost">ブースター<br>10秒 3倍速</button><button class="h" data-a="shield">バリア<br>妨害を1回防ぐ</button>
    <button class="h" data-a="save">セーブ<br>落ちてもここから</button><button class="h" data-a="warp">ワープ<br>＋500m</button><span></span>
    <h3>機体交換（落ちるまで続く）</h3>
    <button class="g" data-s="stealth">ステルス<br>妨害を2回よける</button><button class="g" data-s="gold">ゴールド<br>速さ1.5倍</button><button class="g" data-s="dragon">ドラゴン<br>3倍速＋隕石無効</button>
    <button class="g" data-s="crystal">クリスタル<br>パワーが減らない</button><button class="g" data-s="mega">メガロケット<br>耐久2倍</button><span></span>
    <h3>妨害</h3>
    <button class="j" data-a="leak">パワーダウン<br>応援パワー0</button><button class="j" data-a="meteor">隕石<br>耐久 −1</button><button class="j" data-a="stall">エンジン停止<br>6秒 落ちていく</button>
    <button class="j" data-a="hole">ブラックホール<br>−500m</button><button class="j" data-a="crash">撃墜<br>即ついらく</button><button class="j" data-a="dragonAtk">ドラゴン襲来<br>火球3発（当たれば耐久−1）</button>
    <h3>目標の高さ（変えると0からやり直し）</h3>
    <button class="g" data-g="1000">1,000m</button><button class="g" data-g="5000">5,000m</button><button class="g" data-g="10000">10,000m</button>
    <button class="g" data-g="50000">50,000m</button><button class="g" data-g="100000">100,000m</button><button class="n" data-a="reset">記録を消す</button>
  </div>
</div>
<script>
'use strict';
/* ロケット「◯◯mまで飛ぶまで終われません」
   ロケットは勝手に上がる。燃料は時間で減り、コメント・いいね・お助けギフトで増える。
   燃料が切れると墜落して0mからやり直し。目標の高さに届いたらクリア。配信者の操作はいらない。 */
const W=1080, H=1700, cv=document.getElementById('cv'), g=cv.getContext('2d'), stage=document.getElementById('stage');
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, pick=a=>a[Math.floor(Math.random()*a.length)];
const FONT="MPR,'Hiragino Sans','Noto Sans JP',sans-serif", FONTD="DELA,"+FONT;
const CFG={ goal:5000, speed:25, powDecay:.05, comment:.12, like:.006, follow:.5, hp:3, boostSec:10, boostMul:3, stallSec:6, stallFall:30, hole:500, warp:500, ppm:20 };
/* 絵（チャッピー製）。読めていない間は何も描かない */
const IMG={}; function img(k,src){ const im=new Image(); im.src='./img/'+src; IMG[k]=im; return im; }
for(const k of ['std','stealth','gold','dragon','crystal','mega']) img('ship_'+k,'ship_'+k+'.png');
for(const k of ['d_balloon','d_plane','d_gull','d_blimp','d_sat','d_ufo','d_planet','d_astro','fx_meteor','fx_hole','fx_shield','fx_tank','moon','cloud0','cloud1','cloud2','cloud3','cloud4']) img(k,k+'.png');
img('pad','pad.jpg'); img('flame','flame.jpg');
for(const k of ['smoke_w','smoke_b','logo_crash','logo_boost','logo_goal','logo_stall','logo_dodge','logo_m500','logo_p500','panel','heart','heart_off','mega','gate','isle','marker','burnt','moonastro','earth','deb0','deb1','deb2','deb3','deb4','deb5']) img(k,k+'.webp');
for(const k of ['boom','ring','bolt','warp','bflame','pillar','lines','stars']) img(k,k+'.jpg');
/* 連番シート（色の絵 _c.jpg と 透明度の絵 _a.png を合わせて使う）。くりんぐの動画から作った動く絵用 */
function mkSheet(name,meta){ const o=Object.assign({cv:null,ok:false},meta), c=new Image(), a=new Image(); let n=0;
  const done=()=>{ if(++n<2 || !c.naturalWidth || !a.naturalWidth) return; const cv=document.createElement('canvas'); cv.width=c.naturalWidth; cv.height=c.naturalHeight; const x=cv.getContext('2d'); x.drawImage(c,0,0); x.globalCompositeOperation='destination-in'; x.drawImage(a,0,0,cv.width,cv.height); o.cv=cv; o.ok=true; };
  c.onload=done; a.onload=done; c.src='./img/'+name+'_c.jpg'; a.src='./img/'+name+'_a.png'; return o; }
const drgSh=mkSheet('drg',{n:54,cols:8,fw:480,fh:253,fps:12});   // 真上から見たドラゴン。コマ0〜20＝羽ばたき1回ぶん、20〜53＝翼を広げて頭を突き出し吠える
img('drg_face','drg_face.jpg');                                   // カットイン用の顔（まだ無い間は出さない）
/* 音：くりんぐの動画の音や効果音ラボの音を鳴らす */
const SND={}; function play(k,v){ try{ let a=SND[k]; if(!a){ a=SND[k]=new Audio('./snd/'+k+'.mp3'); a.preload='auto'; } a.currentTime=0; a.volume=v==null?.85:v; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
/* 黒い背景の光の絵を、明るさ→透明度に変えて使う */
const KEYC={}; function keyed(k){ if(KEYC[k]) return KEYC[k]; if(!ok(k)) return null; const im=IMG[k], c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; const x=c.getContext('2d'); x.drawImage(im,0,0); try{ const d=x.getImageData(0,0,c.width,c.height), q=d.data; for(let i=0;i<q.length;i+=4){ const m=Math.max(q[i],q[i+1],q[i+2]); if(m>0){ const kk=k==='boom'?Math.min(255/m,1.7):255/m; q[i]=Math.min(255,q[i]*kk); q[i+1]=Math.min(255,q[i+1]*kk); q[i+2]=Math.min(255,q[i+2]*kk); } q[i+3]=m<10?0:Math.min(255,(m-10)*(k==='boom'?2.4:1.4)); } x.putImageData(d,0,0); }catch(e){} KEYC[k]=c; return c; }
const ok=k=>IMG[k] && IMG[k].naturalWidth>0;
/* 機体：h=画面での高さ fw=炎の太さ hue=炎の色あい（度） と性能 */
const SHIPS={
  std:    {name:'ノーマル',   h:330, fw:120, hue:0,   spd:1,   decay:1, hp:3, perk:''},
  stealth:{name:'ステルス',   h:430, fw:96,  hue:-28, spd:1,   decay:1, hp:3, dodge:2, perk:'妨害を2回よける'},
  gold:   {name:'ゴールド',   h:370, fw:118, hue:14,  spd:1.5, decay:1, hp:3, perk:'速さ1.5倍'},
  dragon: {name:'ドラゴン',   h:430, fw:120, hue:-14, spd:1,   decay:1, hp:3, fireproof:true, boost:true, perk:'10秒3倍速＋隕石が効かない'},
  crystal:{name:'クリスタル', h:400, fw:120, hue:170, spd:1,   decay:0, hp:3, perk:'応援パワーが減らない'},
  mega:   {name:'メガロケット',h:420, fw:150, hue:0,   spd:1,   decay:1, hp:6, multi:true, perk:'耐久が2倍'}
};
const flameC={}; function flameFor(hue){ if(!ok('flame')) return null; if(flameC[hue]) return flameC[hue]; const c=document.createElement('canvas'); c.width=IMG.flame.naturalWidth; c.height=IMG.flame.naturalHeight; const x=c.getContext('2d'); if(hue) x.filter='hue-rotate('+hue+'deg) saturate(1.25)'; x.drawImage(IMG.flame,0,0); x.filter='none'; try{ const d=x.getImageData(0,0,c.width,c.height), q=d.data; for(let i=0;i<q.length;i+=4){ const m=Math.max(q[i],q[i+1],q[i+2]); if(m>0){ const k=255/m; q[i]=Math.min(255,q[i]*k); q[i+1]=Math.min(255,q[i+1]*k); q[i+2]=Math.min(255,q[i+2]*k); } q[i+3]=Math.min(255,m*1.35); } x.putImageData(d,0,0); }catch(e){} flameC[hue]=c; return c; }
let padC=null; function padCanvas(){ if(padC || !ok('pad')) return padC; const im=IMG.pad, c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; const x=c.getContext('2d'); x.drawImage(im,0,0); x.globalCompositeOperation='destination-in'; const gr=x.createLinearGradient(0,0,0,430); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)'); x.fillStyle=gr; x.fillRect(0,0,c.width,c.height); padC=c; return c; }
const PAD_Y=822;   // 発射台の絵の中で、台の上面がある高さ
const RY=830, K=.72, XL=-230, XW=1540, SH=1080;
const RS=.6, MOVE={x:560,up:-250,dn:250};   // RS=ロケットの縮尺（小さめ） MOVE=動かせる範囲（まん中からのずれ）
const RXw=()=>W/2+(S.px||0), RYw=()=>RY+(S.py||0);   // いまのロケットの場所（場面の中の座標）   // 場面は0.72倍に縮めて描く。K=縮尺 XL〜XL+XW=場面の横の見える範囲 SH=画面の高さ   // ロケットが立っている画面上の高さ
let S, best=0, tries=1, wins=0, T=0;
try{ const o=JSON.parse(localStorage.getItem('rocket_save')||'{}'); best=o.best||0; tries=o.tries||1; wins=o.wins||0; if(o.goal) CFG.goal=o.goal; }catch(e){}
function save(){ try{ localStorage.setItem('rocket_save',JSON.stringify({best,tries,wins,goal:CFG.goal})); }catch(e){} }
function newRun(keepTries){ drag=null; S={ px:0, py:0, tx:0, ty:0, mode:'fly', alt:0, pow:.2, hp:CFG.hp, holeT:0, holeDrop:0, rings:[], boostT:0, stallT:0, shield:false, ship:'std', dodge:0, shipT:9, saveAlt:0, fallV:0, fallT:0, clearT:0, shake:0, flash:0, red:0, log:(S&&S.log)||[], parts:[], fx:[], zapT:0, banner:null, items:[], nextItem:0, warn:0 }; if(!keepTries) tries=1; }
function logAdd(text,color){ S.log.push({text,color:color||'#fff'}); if(S.log.length>3) S.log.shift(); }
function banner(text,color,sub,logo){ S.banner={text,color,sub:sub||'',t:0,logo:logo||''}; }
function fx(k,x,y,dur,s){ S.fx.push({k,x:RXw()+(x-W/2)*RS,y:RYw()+(y-RY)*RS,t:0,dur,s:k==='boom'?s*Math.max(RS,.7):s,rot:rand(0,6)}); }   // ロケットを基準にした場所で出す
function debris(x,y,n,pw){ for(let i=0;i<n;i++) S.parts.push({k:'deb',i:Math.floor(rand(0,6)),x:x+rand(-50,50),y:y+rand(-30,30),vx:rand(-1,1)*pw,vy:rand(-1.3,-.2)*pw,g:1500,t:rand(1,1.8),r:rand(50,105),rot:rand(0,6),vr:rand(-9,9)}); }
function fmt(n){ return Math.floor(n).toLocaleString(); }
const Game={
  comment(n){ addPow(CFG.comment); logAdd((n||'だれか')+' の応援でスピードアップ','#b9ffb0'); },
  like(c){ addPow(CFG.like*(c||1)); },
  follow(n){ addPow(CFG.follow); logAdd((n||'だれか')+' がフォロー！一気にスピードアップ','#b9ffb0'); },
  fuel(n){ if(S.mode!=='fly') return; S.pow=1; S.hp=SHIPS[S.ship].hp; S.tankT=0; S.flash=.3; logAdd((n||'だれか')+' がエネルギー補給（耐久とパワー全回復）','#5dffb0'); },
  boost(n){ if(S.mode!=='fly') return; S.boostT=CFG.boostSec; S.stallT=0; ring(W/2,RY+150,'#bff3ff'); banner('ブースター！','#5dffb0',n,'logo_boost'); logAdd((n||'だれか')+' がブースターに点火','#5dffb0'); },
  shield(n){ S.shield=true; logAdd((n||'だれか')+' がバリアを張った','#5dffb0'); },
  save(n){ if(S.mode!=='fly') return; S.saveAlt=S.alt; banner('セーブ！','#5dffb0',fmt(S.alt)+'m'); logAdd((n||'だれか')+' が '+fmt(S.alt)+'m でセーブした','#5dffb0'); },
  warp(n){ if(S.mode!=='fly') return; S.alt=Math.min(CFG.goal,S.alt+CFG.warp); S.flash=.35; fx('warp',W/2,RY,.9,1); banner('＋'+CFG.warp+'m','#5dffb0',n,CFG.warp===500?'logo_p500':''); logAdd((n||'だれか')+' がワープさせた','#5dffb0'); },
  leak(n){ if(jamBlocked(n,'パワーダウン')) return; S.pow=0; S.red=.4; S.shake=.4; S.zapT=.8; banner('パワーダウン','#ff3d5a',n); logAdd((n||'だれか')+' が応援パワーを0にした','#ff9aa8'); },
  meteor(n){ if(jamBlocked(n,'隕石')) return; S.items.push({k:'meteor',x:clamp(RXw()+rand(-70,70),XL+120,XL+XW-120),y:-260,vx:0,vy:420,hit:false,by:n}); logAdd((n||'だれか')+' が隕石を落とした（耐久−1）','#ff9aa8'); },
  stall(n){ if(jamBlocked(n,'エンジン停止')) return; S.stallT=CFG.stallSec; S.boostT=0; S.red=.5; banner('エンジン停止！','#ff3d5a',n,'logo_stall'); logAdd((n||'だれか')+' がエンジンを止めた','#ff9aa8'); },
  hole(n){ if(jamBlocked(n,'ブラックホール')) return; S.holeT=2.2; S.holeDrop+=Math.min(S.alt,CFG.hole); S.shake=.5; banner('−'+CFG.hole+'m','#c58bff',n,CFG.hole===500?'logo_m500':''); logAdd((n||'だれか')+' がブラックホールで引きずり下ろした','#ff9aa8'); },
  dragonAtk(n){ if(S.mode!=='fly' || S.drg) return; S.drg={t:0,by:n,shot:0,snd:false}; S.banner=null; S.flash=Math.max(S.flash,.12); logAdd((n||'だれか')+' がドラゴンを呼んだ（火球3発）','#ff9aa8'); },
  crash(n){ if(jamBlocked(n,'撃墜')) return; logAdd((n||'だれか')+' がロケットを撃ち落とした','#ff9aa8'); startFall(); },
  ship(k,n){ if(S.mode!=='fly' || !SHIPS[k]) return; const sp=SHIPS[k]; S.ship=k; S.shipT=0; S.dodge=sp.dodge||0; S.hp=sp.hp; S.flash=.5; S.shake=.3; ring(W/2,RY,'#ffe680',true); fx('pillar',W/2,RY+170,1.1,1); if(sp.boost){ S.boostT=CFG.boostSec; S.stallT=0; } banner(sp.name+'！','#ffd23f',(n?n+'　':'')+sp.perk); logAdd((n||'だれか')+' が機体を「'+sp.name+'」に交換した','#ffd23f'); for(let i=0;i<40;i++) S.parts.push({k:'conf',x:W/2+rand(-60,60),y:RY,vx:rand(-520,520),vy:rand(-620,220),g:500,t:rand(.8,1.6),c:pick(['#ffd400','#fff','#4cc3ff','#ff5c8a']),r:rand(8,16),rot:rand(0,6),vr:rand(-9,9)}); },
  setGoal(v){ CFG.goal=v; best=0; newRun(); save(); logAdd('目標を '+fmt(v)+'m にした','#ffd23f'); },
  reset(){ best=0; tries=1; wins=0; newRun(); save(); }
};
// ドラゴン襲来の時間割：顔のカットイン(cutLen秒) → cut秒後からドラゴンが降りてくる → ばさばさ羽ばたく(1回 flap秒) → atk から吠えて火球3発 → 羽ばたきながら飛び去る
const HITB={x:30,y:92,oy:0}, FB_R=46;   // HITB=ロケットの当たり判定（半分の幅・高さ） FB_R=火球の大きさ
const DRG={aim:150,spd:720,cut:.55,cutLen:1.05,life:4.5,inT:.7,outT:.7,w:500,y:350,flap:.42,atk:1.26,atkLen:1.8,shots:[1.9,2.3,2.7],hitP:1/3};   // w=ドラゴンの横幅（小さめ） hitP=火球1発が当たる確率
DRG.dur=DRG.cut+DRG.life; DRG.shots=DRG.shots.map(v=>v+DRG.cut);
const drgY=t=>{ const tt=t-DRG.cut, a=clamp(tt/DRG.inT,0,1), b=clamp((tt-(DRG.life-DRG.outT))/DRG.outT,0,1), ea=1-Math.pow(1-a,3); return lerp(-300,DRG.y,ea)-b*b*680+Math.sin(tt*15)*5; };
const drgFrame=t=>{ const tt=t-DRG.cut; if(tt>=DRG.atk && tt<DRG.atk+DRG.atkLen) return 20+Math.min(33,Math.floor((tt-DRG.atk)/DRG.atkLen*33)); const ph=(((tt%DRG.flap)+DRG.flap)%DRG.flap)/DRG.flap; return Math.floor(ph*20); };
const drgMouth=t=>({x:W/2, y:drgY(t)+DRG.w*drgSh.fh/drgSh.fw*.42});
function drawDragon(){ const d=S.drg; if(!d || !drgSh.ok || d.t<DRG.cut) return; const sh=drgSh, f=clamp(drgFrame(d.t),0,sh.n-1), w=DRG.w, h=w*sh.fh/sh.fw, y=drgY(d.t);
  g.drawImage(sh.cv,(f%sh.cols)*sh.fw,Math.floor(f/sh.cols)*sh.fh,sh.fw,sh.fh,W/2-w/2,y-h/2,w,h);
  if(d.shot<DRG.shots.length){ const nx=DRG.shots[d.shot]-d.t; if(nx<.3 && nx>0){ const m=drgMouth(d.t), r=60*(1-nx/.3)+14; g.save(); g.globalCompositeOperation='lighter'; const gr=g.createRadialGradient(m.x,m.y,0,m.x,m.y,r); gr.addColorStop(0,'rgba(255,240,190,.95)'); gr.addColorStop(.4,'rgba(255,150,40,.7)'); gr.addColorStop(1,'rgba(255,40,0,0)'); g.fillStyle=gr; g.fillRect(m.x-r,m.y-r,r*2,r*2); g.restore(); } } }
/* カットイン：ナナメの帯がサッと横から入り、ドラゴンの顔と「ドラゴン襲来！」を見せて抜ける。ゲームは止めない */
function drawDragonCut(){ const d=S.drg; if(!d || d.t>=DRG.cutLen) return; const t=d.t, L=DRG.cutLen, a=clamp(t/.16,0,1), b=clamp((t-(L-.2))/.2,0,1), ox=(1-(1-Math.pow(1-a,3)))*1250-b*b*1350-(t/L)*46, cy=470, bh=330, sk=70;
  g.save(); g.translate(ox,0); g.beginPath(); g.moveTo(-40+sk,cy-bh/2); g.lineTo(W+40+sk,cy-bh/2); g.lineTo(W+40-sk,cy+bh/2); g.lineTo(-40-sk,cy+bh/2); g.closePath();
  g.save(); g.clip(); g.fillStyle='#1a0204'; g.fillRect(-200,cy-bh/2,W+400,bh);
  if(ok('drg_face')){ const fi=IMG.drg_face, sw=fi.naturalWidth, sh2=sw*bh/(W+240), z=1+.06*(t/L); g.drawImage(fi,0,fi.naturalHeight*.3,sw,sh2,-120-(z-1)*600,cy-bh/2-(z-1)*170,(W+240)*z,bh*z); }

    const gr=g.createLinearGradient(0,y1,0,y0); gr.addColorStop(0,'#4cc3ff'); gr.addColorStop(.6,'#5dffb0'); gr.addColorStop(1,'#ffe14d'); g.fillStyle=S.boostT>0?'#ffffff':gr; if(f>.01){ rr(x-7,y1-hh*f,30,hh*f,10); g.fill(); }
    if(ok('mega')){ const mi=IMG.mega, mw=74, mh=mw*mi.naturalHeight/mi.naturalWidth, pu=1+.12*Math.max(0,Math.sin(T*6))*S.pow; g.save(); g.translate(x+12,y0-58); g.scale(pu,pu); g.drawImage(mi,-mw/2,-mh/2,mw,mh); g.restore(); } else txt('応援',x+8,y0-52,26,'#fff','center','#0a1730'); txt('×'+(1+S.pow).toFixed(1),x+8,y1+52,30,'#ffe14d','center','#0a1730'); }
  if(S.boostT>0) txt('ブースター 残り '+Math.ceil(S.boostT)+'秒',W/2,892,36,'#4cc3ff','center','#04203a');
  if(S.stallT>0) txt('エンジン停止 残り '+Math.ceil(S.stallT)+'秒',W/2,892,36,'#ff5c5c','center','#2a0008');
  drawDragonCut();
  if(S.banner){ const b=S.banner, k=1+1.6*Math.pow(clamp(1-b.t/.2,0,1),2), a=clamp((2.4-b.t)/.4,0,1); g.save(); g.globalAlpha=a; g.translate(W/2,330); g.scale(k,k); const lg=b.logo&&ok(b.logo)?IMG[b.logo]:null; if(lg){ const lw=b.logo==='logo_p500'?560:(b.logo==='logo_stall'?820:720), lh=lw*lg.naturalHeight/lg.naturalWidth; g.shadowColor='rgba(0,0,0,.55)'; g.shadowBlur=26; g.drawImage(lg,-lw/2,40-lh/2,lw,lh); g.shadowBlur=0; if(b.sub) txt(b.sub,0,40+lh/2+34,36,'#fff','center','#0a0f20'); } else { g.shadowColor='rgba(0,0,0,.6)'; g.shadowBlur=30; txt(b.text,0,0,b.text.length>7?92:124,b.color,'center','#0a0f20',FONTD); g.shadowBlur=0; if(b.sub) txt(b.sub,0,92,36,'#fff','center','#0a0f20'); } g.restore(); }
  if(S.mode==='clear' && S.clearT>2.2){ g.save(); g.globalAlpha=clamp((S.clearT-2.2)/.5,0,1); g.fillStyle='rgba(8,14,34,.82)'; rr(160,400,760,270,36); g.fill(); g.strokeStyle='#ffd23f'; g.lineWidth=8; g.stroke(); txt('おつかれさま！',W/2,474,72,'#ffd23f','center','#3a1d00',FONTD); txt(tries+'回目の挑戦で '+fmt(CFG.goal)+'m に到達',W/2,560,38,'#fff','center'); txt('画面をタップでもう一度',W/2,622,30,'#9fb6e6','center'); g.restore(); }
  /* ====== 下のログ ====== */
  g.fillStyle='rgba(8,14,34,.9)'; g.fillRect(0,930,W,150); g.fillStyle='#2c4a86'; g.fillRect(0,930,W,5);
  S.log.slice(-2).forEach((l,i)=>{ g.font='900 30px '+FONT; let s2=l.text; while(g.measureText(s2).width>W-60 && s2.length>4) s2=s2.slice(0,-2); txt(s2,30,966+i*44,30,l.color,'left'); });
  txt('コメント・いいねでスピードアップ　落とされたら0mからやり直し',W/2,1058,24,'#ffd23f','center'); }
function fit(){ const w=Math.min(window.innerWidth,window.innerHeight); stage.style.width=w+'px'; stage.style.height=w+'px'; stage.style.top=((window.innerHeight-w)/2)+'px'; stage.style.fontSize=(w/108)+'px'; }
fit(); window.addEventListener('resize',fit);
const tp=document.getElementById('tp'), NAMES=['たぬ吉','ぽんた','みけ','そら','りく','はな','こてつ','もも','ゆず','まる'];
function goalUI(){ tp.querySelectorAll('button[data-g]').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.g,10)===CFG.goal)); }
document.getElementById('testBtn').onclick=()=>{ tp.hidden=!tp.hidden; goalUI(); };
tp.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const n=pick(NAMES); if(b.dataset.g){ Game.setGoal(parseInt(b.dataset.g,10)); } else if(b.dataset.s){ Game.ship(b.dataset.s,n); } else { const a=b.dataset.a; if(a==='like') Game.like(50); else if(a==='reset') Game.reset(); else Game[a](n); } tp.hidden=true; });
// 操作：画面を押したまま動かすと、動かした分だけロケットが動く（指でロケットが隠れない）。パソコンはマウスのドラッグか矢印キー
cv.style.touchAction='none';
cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty}; try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
cv.addEventListener('pointermove',e=>{ if(!drag || S.mode!=='fly') return; const r=cv.getBoundingClientRect(), k=cv.width/r.width/K*1.2; S.tx=clamp(drag.tx+(e.clientX-drag.x)*k,-MOVE.x,MOVE.x); S.ty=clamp(drag.ty+(e.clientY-drag.y)*k,MOVE.up,MOVE.dn); e.preventDefault(); });
for(const ev of ['pointerup','pointercancel']) cv.addEventListener(ev,()=>{ drag=null; });
window.addEventListener('keydown',e=>{ KEYS[e.key]=true; if(e.key.indexOf('Arrow')===0) e.preventDefault(); }); window.addEventListener('keyup',e=>{ KEYS[e.key]=false; });
cv.addEventListener('pointerdown',()=>{ if(S.mode==='clear' && S.clearT>2.4){ newRun(); save(); logAdd('もう一度 '+fmt(CFG.goal)+'m に挑戦','#ffd23f'); } });
newRun(true); logAdd(fmt(CFG.goal)+'m まで飛ぶまで終われません！','#ffd23f');
let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(!window.__frozen){ update(dt); draw(); } requestAnimationFrame(loop); }
window.RocketGame=Game; window.__dbg={ DRG, Game, get S(){ return S; }, CFG, update, draw, get tries(){ return tries; }, get best(){ return best; }, get wins(){ return wins; } };
Promise.all([document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()].concat(Object.values(IMG).map(im=>new Promise(r=>{ if(im.complete) r(); else { im.onload=r; im.onerror=r; } })))).then(()=>{ window.__ready=true; requestAnimationFrame(loop); });
</script>
