<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配信オーバーレイ</title>
<style>
@font-face{font-family:Dela;src:url(font/dela.woff2) format('woff2');font-display:swap}
@font-face{font-family:MPR;src:url(font/mpr.woff2) format('woff2');font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html.one,html.one body{overflow:hidden}
html,body{background:transparent;font-family:MPR,'Hiragino Maru Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif;color:#fff}
html.setup,body.setup{overflow:visible;height:auto;min-height:100%;touch-action:auto}
body.setup{background:#12131a;-webkit-text-size-adjust:100%}
.host{position:relative;overflow:hidden}
.wg{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none}
.pop{font-family:Dela,MPR,sans-serif}
.ol{text-shadow:0 3px 0 #0b0c12,0 -2px 0 #0b0c12,2px 0 0 #0b0c12,-2px 0 0 #0b0c12,2px 2px 0 #0b0c12,-2px 2px 0 #0b0c12,0 6px 10px rgba(0,0,0,.45)}
.panel{background:linear-gradient(180deg,rgba(28,30,46,.92),rgba(14,15,24,.92));border:4px solid #fff;border-radius:28px;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.ctl{position:absolute;right:10px;bottom:8px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.wg:hover .ctl,.wg.show .ctl{opacity:1}
.ctl button{font:700 20px MPR,sans-serif;padding:6px 12px;border-radius:12px;border:2px solid #fff;background:#2b2e45;color:#fff;cursor:pointer}
.st{position:absolute;left:8px;top:8px;font:700 16px MPR,sans-serif;background:#c62828;color:#fff;border-radius:10px;padding:4px 10px;display:none;z-index:9}
/* WIN */
.win{width:600px;height:220px}
.win .panel{position:absolute;inset:8px 8px 14px;display:flex;align-items:center;justify-content:center;gap:34px}
.win .lab{font-size:64px;color:#ffd84a;letter-spacing:4px}
.win .num{font-size:128px;line-height:1;min-width:150px;text-align:center}
.win .num.pos{color:#7dff9a}.win .num.neg{color:#ff7d8b}
.bump{animation:bump .45s}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
/* ランキング */
.rank{width:560px}
.rank .ttl{height:74px;display:flex;align-items:center;justify-content:center;font-size:36px;border-radius:24px 24px 0 0;border:4px solid #fff;border-bottom:0}
.rank.like .ttl{background:linear-gradient(90deg,#ff4f8b,#ff8a5c)}
.rank.gift .ttl{background:linear-gradient(90deg,#7a5cff,#3fb6ff)}
.rank .list{position:relative;background:linear-gradient(180deg,rgba(28,30,46,.92),rgba(14,15,24,.92));border:4px solid #fff;border-radius:0 0 24px 24px;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.rank .row{position:absolute;left:0;right:0;height:84px;display:flex;align-items:center;padding:0 18px 0 12px;gap:12px;transition:top .5s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.rank .no{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:#3a3d57;flex:none}
.rank .row.r1 .no{background:#ffc92e;color:#4a3200}.rank .row.r2 .no{background:#cfd6e3;color:#2e3442}.rank .row.r3 .no{background:#e39a5b;color:#4a2408}
.rank .av{width:60px;height:60px;border-radius:50%;flex:none;border:3px solid #fff;background:#555 center/cover;display:flex;align-items:center;justify-content:center;font:700 28px MPR,sans-serif;overflow:hidden}
.rank .nm{flex:1;font:800 30px MPR,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .val{font-size:32px;color:#ffe37a;flex:none}
.rank .val small{font:700 18px MPR,sans-serif;color:#fff;margin-left:4px}
.rank .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 26px MPR,sans-serif;color:#aab}
/* 時間 */
.time{width:640px;height:220px}
.time .panel{position:absolute;inset:8px 8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time .lab{font:800 28px MPR,sans-serif;color:#9fe3ff;margin-bottom:2px}
.time .num{font-size:104px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:2px}
.time.hot .num{color:#ff6b6b;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.time .add{position:absolute;right:26px;top:16px;font-size:40px;color:#7dff9a;opacity:0}
.time .add.go{animation:rise 1.4s}
@keyframes rise{0%{opacity:0;transform:translateY(20px)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
/* びん */
.jar canvas{position:absolute;left:0;top:0}
.jar .cnt{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:40px}
.jar .cnt small{font:800 24px MPR,sans-serif;margin-left:6px}
/* ガチャ・タワー */
.gacha canvas,.tower canvas{position:absolute;left:0;top:0}
.roul .gres .pz{font-size:46px;margin:2px 0 8px}
.gres{position:absolute;left:40px;right:40px;top:8px;padding:14px 18px 16px;text-align:center;border-radius:18px;border:2px solid #d9b866;background:linear-gradient(180deg,rgba(24,20,14,.96),rgba(8,7,6,.96));box-shadow:0 0 0 5px rgba(8,7,6,.9),0 0 0 6px #8a6d2f,0 10px 30px rgba(0,0,0,.6);font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;opacity:0;transform:translateY(16px) scale(.92);transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1)}
.gres.on{opacity:1;transform:none}
.gres .rk{font:700 84px/1 Georgia,'Times New Roman',serif;letter-spacing:4px;text-shadow:0 0 18px currentColor,0 3px 0 rgba(0,0,0,.6)}
.gres .pz{font-size:34px;font-weight:700;line-height:1.3;color:#fff6dc;margin:6px 0 8px;word-break:break-word}
.gres .who{font-size:24px;color:#d9b866;border-top:1px solid rgba(217,184,102,.5);padding-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlab{position:absolute;left:0;right:0;bottom:0;height:104px;text-align:center;font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.8)}
.tlab .tt{font-size:28px;letter-spacing:6px;color:#e6cf8f}
.tlab .tn{font:700 54px/1.1 Georgia,'Times New Roman',serif;color:#fff3c4}
.tlab .tn small{font-size:24px;color:#e6cf8f;font-family:inherit}
.tower.done .tn .a{color:#ffd86b;text-shadow:0 0 20px #ffd86b}
.pg textarea{width:100%;min-height:64px;font:15px MPR,sans-serif;padding:8px;border-radius:10px;border:1px solid #555a7a;background:#2b2e45;color:#fff;margin:4px 0 8px}
/* 黒金の着せ替え */
.luxe .panel{background:linear-gradient(180deg,rgba(26,21,14,.96),rgba(8,7,6,.96));border:2px solid #d9b866;border-radius:14px;box-shadow:0 0 0 5px rgba(8,7,6,.9),0 0 0 6px #8a6d2f,0 8px 20px rgba(0,0,0,.5)}
.luxe .pop{font-family:Georgia,'Times New Roman','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif;font-weight:700}
.luxe .ol{text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.7)}
.luxe.win .lab{color:#d9b866;letter-spacing:12px}.luxe.win .num{color:#fff3c4}.luxe.win .num.pos{color:#ffe9a8}.luxe.win .num.neg{color:#ffa3a8}
.luxe.rank .ttl{background:linear-gradient(180deg,#2c2315,#0c0a07);border:2px solid #d9b866;border-bottom:0;border-radius:14px 14px 0 0;color:#e6cf8f;letter-spacing:5px;font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif;font-weight:700}
.luxe.rank .list{background:linear-gradient(180deg,rgba(26,21,14,.96),rgba(8,7,6,.96));border:2px solid #d9b866;border-radius:0 0 14px 14px;box-shadow:0 0 0 5px rgba(8,7,6,.9),0 0 0 6px #8a6d2f}
.luxe.rank .no{background:#231d12;color:#d9b866;border:1px solid #8a6d2f}
.luxe.rank .row.r1 .no{background:linear-gradient(135deg,#fff0b8,#d9a93a);color:#3a2800}.luxe.rank .row.r2 .no{background:linear-gradient(135deg,#f4f6fa,#a9b2c2);color:#2a2f3a}.luxe.rank .row.r3 .no{background:linear-gradient(135deg,#f0c39a,#b5713a);color:#3a1c06}
.luxe.rank .av{border:2px solid #d9b866}.luxe.rank .nm{font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif;color:#fff6dc}.luxe.rank .val{color:#ffe08a}.luxe.rank .val small{color:#d9b866}
.luxe.rank .row+.row{border-top:1px solid rgba(217,184,102,.18)}
.luxe.time .lab{color:#d9b866;letter-spacing:8px;font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif}.luxe.time .num{color:#fff3c4}
/* VIP・王座・ハート・花火 */
.vip{overflow:hidden}
.vip canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
.vip .cu{position:absolute;top:0;width:962px;height:1080px;background-size:100% 100%;transition:transform .5s cubic-bezier(.3,.9,.4,1);will-change:transform;box-shadow:0 0 60px rgba(0,0,0,.6)}
.vip .cl{left:0;background-image:url(img/curtL.webp);transform:translateX(-104%)}.vip .cr{right:0;background-image:url(img/curtR.webp);transform:translateX(104%)}
.vip.st-shut .cu{transform:none}
.vip.st-open .cu,.vip.st-out .cu{transition:transform 1.5s cubic-bezier(.6,0,.3,1)}
.vip .pl{position:absolute;left:236px;top:280px;width:1448px;height:483px;opacity:0;transform:scale(.6)}
.vip .pl img{position:absolute;left:0;top:0;width:100%;height:100%}
.vip.st-shut .pl{opacity:1;transform:scale(.82)}
.vip.st-open .pl{opacity:1;transform:scale(1);transition:transform 1.4s cubic-bezier(.2,1.3,.4,1)}
.vip.st-out .pl{opacity:0;transform:scale(1.04);transition:opacity .8s,transform .8s}
.vip .pn{position:absolute;left:150px;right:150px;top:158px;height:160px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;font-weight:700;color:#ffe9a8;text-shadow:0 0 22px rgba(255,216,107,.75),0 3px 0 #000;letter-spacing:4px}
.vip .ps{position:absolute;left:150px;right:150px;top:318px;text-align:center;font:700 38px 'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;color:#d9b866;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:3px}
.king .kav{position:absolute;left:104px;top:118px;width:308px;height:308px;border-radius:50%;background:#1a140c center/cover;display:flex;align-items:center;justify-content:center;font:700 150px 'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;color:#fff6dc}
.king .kf{position:absolute;left:0;top:0;width:520px;height:520px}
.king .kn{position:absolute;left:162px;width:196px;top:412px;height:50px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;font-weight:700;font-size:26px;color:#3a2500;text-shadow:0 1px 0 rgba(255,240,190,.7)}
.king .kc{position:absolute;left:0;right:0;top:522px;text-align:center;font:700 50px/1.1 Georgia,'Times New Roman',serif;color:#fff3c4;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.8)}
.king .kc small{font:700 24px 'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;color:#e6cf8f}
.king.chg .kf{animation:kchg 1.1s}
@keyframes kchg{0%{filter:brightness(1)}25%{filter:brightness(2.1) drop-shadow(0 0 30px #ffd86b);transform:scale(1.06)}100%{filter:brightness(1);transform:none}}
.heartg .hl{position:absolute;left:0;right:0;bottom:0;height:80px;text-align:center;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.8)}
.heartg .hn{font:700 54px/1.3 Georgia,'Times New Roman',serif;color:#fff3f8}
.heartg .hn small{font:700 24px 'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;color:#ffc2d8}
.heartg.done .hn .a{color:#ffd86b;text-shadow:0 0 20px #ffd86b}
/* コンボ・図鑑 */
.combo .cb{position:absolute;left:6px;right:6px;top:6px;height:176px;background:linear-gradient(180deg,rgba(26,21,14,.96),rgba(8,7,6,.96));border:2px solid #d9b866;border-radius:14px;box-shadow:0 0 0 5px rgba(8,7,6,.9),0 0 0 6px #8a6d2f;opacity:0;transform:translateX(-40px);transition:opacity .3s,transform .3s}
.combo .cb.on{opacity:1;transform:none}.combo .cb.end{opacity:0;transform:scale(1.06);transition:opacity .9s .5s,transform .9s .5s}
.combo .cav{position:absolute;left:20px;top:22px;width:92px;height:92px;border-radius:50%;border:3px solid #d9b866;background:#333 center/cover;display:flex;align-items:center;justify-content:center;font:700 44px 'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;color:#fff}
.combo .cnm{position:absolute;left:14px;width:106px;top:120px;text-align:center;font:700 20px 'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;color:#fff6dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo .cx{position:absolute;left:132px;right:16px;top:6px;height:140px;display:flex;align-items:baseline;justify-content:center;gap:10px;font-family:Georgia,'Times New Roman',serif;font-weight:700;font-style:italic;color:#ffe9a8;text-shadow:0 3px 0 #000,0 0 18px rgba(255,216,107,.6)}
.combo .cx .x{font-size:60px}.combo .cx .n{font-size:128px;line-height:140px;display:inline-block}.combo .cx .l{font-size:44px;letter-spacing:4px;color:#d9b866}
.combo .t1 .n{color:#ffd86b}.combo .t2 .n{color:#ffb24a;text-shadow:0 3px 0 #000,0 0 26px #ff8a2a}.combo .t3 .n{color:#ff7a5a;text-shadow:0 3px 0 #000,0 0 30px #ff3d2a}.combo .t4 .n{color:#fff;text-shadow:0 3px 0 #000,0 0 14px #fff,0 0 40px #ff3d8a}
.combo .t2,.combo .t3,.combo .t4{border-color:#ffd86b}.combo .t3{box-shadow:0 0 0 5px rgba(8,7,6,.9),0 0 0 6px #8a6d2f,0 0 34px rgba(255,90,40,.7)}.combo .t4{box-shadow:0 0 0 5px rgba(8,7,6,.9),0 0 0 6px #ffd86b,0 0 44px rgba(255,61,138,.85)}
.combo .cbar{position:absolute;left:132px;right:20px;bottom:14px;height:10px;border-radius:5px;background:#2a2419;border:1px solid #8a6d2f;overflow:hidden}
.combo .cbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#b8862b,#ffe08a)}
.combo .cbest{position:absolute;left:0;right:0;top:196px;text-align:center;font:700 26px 'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;color:#e6cf8f;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zukan .zp{position:absolute;inset:6px;background:linear-gradient(180deg,rgba(26,21,14,.96),rgba(8,7,6,.96));border:2px solid #d9b866;border-radius:14px;box-shadow:0 0 0 5px rgba(8,7,6,.9),0 0 0 6px #8a6d2f;padding:0 12px;font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif}
.zukan .zt{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid rgba(217,184,102,.45)}
.zukan .zt .a{font-size:30px;font-weight:700;letter-spacing:8px;color:#e6cf8f}.zukan .zt .b{font:700 30px Georgia,serif;color:#fff3c4}
.zukan .zg{display:grid;gap:6px 0;padding-top:10px}
.zukan .zc{height:140px;position:relative;text-align:center}
.zukan .zi{width:96px;height:96px;margin:0 auto;border-radius:14px;border:1px solid #5a4a25;background:#17130c center/82% no-repeat;display:flex;align-items:center;justify-content:center;font:700 44px Georgia,serif;color:#5a4a25}
.zukan .zc.on .zi{border:2px solid #d9b866;background-color:#221b10;box-shadow:inset 0 0 18px rgba(255,216,107,.25);color:#fff}
.zukan .zn{font-size:16px;font-weight:700;color:#8a7a52;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;padding:0 4px}
.zukan .zc.on .zn{color:#fff6dc}
.zukan .zk{position:absolute;right:10px;top:74px;font:700 20px Georgia,serif;color:#2a1a00;background:linear-gradient(135deg,#fff0b8,#d9a93a);border-radius:10px;padding:0 7px;line-height:24px}
.zukan .zk:empty{display:none}
.zukan .zc.new .zi{animation:znew 1.2s}
@keyframes znew{0%{transform:scale(.3) rotate(-20deg);filter:brightness(3)}45%{transform:scale(1.25);filter:brightness(1.8) drop-shadow(0 0 16px #ffd86b)}100%{transform:none;filter:none}}
.zukan.comp .zp{border-color:#ffd86b;box-shadow:0 0 0 5px rgba(8,7,6,.9),0 0 0 6px #ffd86b,0 0 40px rgba(255,216,107,.8)}
.zukan.comp .zt .b::after{content:'　コンプリート！';color:#ffd86b}
/* テロップ・目標 */
.thanks .band{position:absolute;inset:14px 0;background:linear-gradient(180deg,rgba(26,21,14,.95),rgba(8,7,6,.95));border-top:2px solid #d9b866;border-bottom:2px solid #d9b866;box-shadow:0 0 0 4px rgba(8,7,6,.85);overflow:hidden;opacity:0;transition:opacity .5s}
.thanks .band.on{opacity:1}
.thanks .it{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;gap:18px;white-space:nowrap;font:700 38px 'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif;padding:0 30px;will-change:transform}
.thanks .it::before{content:'◆';color:#d9b866;font-size:22px}
.thanks .nm{color:#fff6dc}.thanks .gf{color:#ffe08a}.thanks .ms{color:#d9b866;font-size:32px}.thanks img{height:56px;width:56px;object-fit:contain}
.goals .gp{position:absolute;inset:6px;background:linear-gradient(180deg,rgba(26,21,14,.96),rgba(8,7,6,.96));border:2px solid #d9b866;border-radius:14px;box-shadow:0 0 0 5px rgba(8,7,6,.9),0 0 0 6px #8a6d2f;padding:0 26px;font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif}
.goals .gt{height:62px;line-height:62px;text-align:center;font-size:30px;font-weight:700;letter-spacing:14px;color:#e6cf8f;border-bottom:1px solid rgba(217,184,102,.45)}
.goals .gr{height:104px;position:relative;padding-top:14px}
.goals .gx{font-size:32px;font-weight:700;color:#fff6dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.goals .gn{position:absolute;right:0;top:18px;font:700 28px Georgia,serif;color:#ffe08a}
.goals .gb{height:16px;margin-top:12px;border-radius:8px;background:#2a2419;border:1px solid #8a6d2f;overflow:hidden}
.goals .gb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8862b,#ffe08a);transition:width .6s}
.goals .gr.done .gx{color:#ffe08a;text-shadow:0 0 14px rgba(255,216,107,.8)}.goals .gr.done .gn{color:#fff;letter-spacing:4px}
/* せつめいページ */
.pg{max-width:760px;margin:0 auto;padding:18px 14px 80px}
.pg h1{font:400 30px Dela,MPR,sans-serif;margin:6px 0 4px}
.pg h2{font:400 22px Dela,MPR,sans-serif;margin:30px 0 10px;color:#ffd84a}
.pg p,.pg li{font-size:15px;line-height:1.8;color:#d5d8e6}
.pg ol{padding-left:22px}
.card{background:#1b1d2a;border:1px solid #33364d;border-radius:16px;padding:14px;margin:14px 0}
.card h3{font:400 19px Dela,MPR,sans-serif;margin-bottom:8px}
.pv{background:repeating-conic-gradient(#2a2c3c 0 25%,#232534 0 50%) 0 0/24px 24px;border-radius:12px;margin:8px 0;display:flex;justify-content:center;padding:8px}

.btns button,.pg select,.pg input{font:700 15px MPR,sans-serif;padding:9px 12px;border-radius:10px;border:1px solid #555a7a;background:#2b2e45;color:#fff}
.pg input{width:100%;margin:5px 0}
.url{display:flex;gap:8px;align-items:center;margin-top:6px}
.url code{flex:1;font:13px ui-monospace,monospace;background:#0e0f17;border-radius:8px;padding:9px;overflow:auto;white-space:nowrap;color:#9fe3ff}
.sz{font-size:13px;color:#9aa}

<script>

function mountTime(box,o){ const mode=o.mode||'clock'; box.classList.add('time');

  const fmt=s=>{ s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':':'')+pad(m)+':'+pad(x); };

  const addSec=sec=>{ if(S.run) S.end=Math.max(Date.now(),S.end+sec*1000); else S.left=Math.max(0,S.left+sec); save(); bumpAdd(sec); };
  const act=a=>{ if(mode==='up'){ if(a==='rst'){ S={start:Date.now()}; save(); } return; } if(mode!=='down') return;
    if(a==='tog'||a==='start'||a==='stop'){ const go=a==='tog'?!S.run:a==='start'; if(go&&!S.run){ S.end=Date.now()+S.left*1000; S.run=true; } else if(!go&&S.run){ S.left=left(); S.run=false; } save(); }

  box.classList.add('zukan'); box.style.width=CW+'px'; box.style.height=CH+'px'; let h='<div class="zp"><div class="zt"><span class="a"></span><span class="b"></span></div><div class="zg" style="grid-template-columns:repeat('+COLS+',1fr)">'; for(let i=0;i<NS;i++) h+='<div class="zc"><div class="zi">？</div><div class="zn"></div><div class="zk"></div></div>'; box.innerHTML=h+'</div></div>';

    const mk=()=>{ const hst=document.getElementById('pv_roulette'); if(rb&&rb.__kill) rb.__kill(); hst.innerHTML=''; rb=place(hst,'roulette',{demo:true,snd:true,gift:'__none__',items:rlL().join('|')},()=>Math.min(pvW(),340)); url(); }; mk();
    for(const id of ['rlGift','rlMin','rlIt']) document.getElementById(id).oninput=url; document.getElementById('rlSet').onclick=mk; document.getElementById('tRl').onclick=()=>sendCmd({cmd:'roulette',name:DEMO_N[Math.floor(Math.random()*DEMO_N.length)]}); }
  place(document.getElementById('pv_tower'),'tower',{demo:true,goal:3000},()=>Math.min(pvW(),420));
  { const bg=document.getElementById('bt_gacha'), pv=LS.get('ov_gacha',null)||{}; let h2='<button id="tGa">回してみる</button><div style="width:100%"></div><label class="sz" style="width:100%">回すギフトの名前（「*」にすると、どのギフトでも回る）<input id="gaGift" value="ハートミー"></label>';
    for(const k of 'SABC') h2+='<label class="sz" style="width:100%">'+k+'ランクの中身（出やすさ '+GA_RK.find(r=>r[0]===k)[2]+'%）<textarea id="ga'+k+'">'+esc(((pv[k]&&pv[k].length)?pv[k]:GA_DEF[k]).join('\n'))+'</textarea></label>'; h2+='<button id="gaSave">見本に反映する</button><span id="gaMsg" class="sz"></span>'; bg.innerHTML=h2;
    document.getElementById('tGa').onclick=()=>sendCmd({cmd:'gacha',name:DEMO_N[Math.floor(Math.random()*DEMO_N.length)]});
    const gg=document.getElementById('gaGift'), gaL=k=>document.getElementById('ga'+k).value.split('\n').map(x=>x.trim().replace(/\|/g,'／')).filter(Boolean).slice(0,30), ug=()=>{ const v=gg.value.trim(); let q='?w=gacha'+(v&&v!=='ハートミー'?'&gift='+encodeURIComponent(v):''); for(const k of 'SABC'){ const l=gaL(k); if(l.length&&l.join('|')!==GA_DEF[k].join('|')) q+='&'+k+'='+encodeURIComponent(l.join('|')); } document.getElementById('u_gacha').textContent=base+q; }; gg.oninput=ug; for(const k of 'SABC') document.getElementById('ga'+k).oninput=ug; ug();
    document.getElementById('gaSave').onclick=()=>{ const d={}; for(const k of 'SABC') d[k]=gaL(k); LS.set('ov_gacha',d); ug(); document.getElementById('gaMsg').textContent='見本に反映しました。中身は上のアドレスにも入っているので、コピーしてOBSに貼ればそのまま使えます'; };
    document.getElementById('bt_tower').innerHTML='<button id="tTw">ギフトをためす</button><button data-rs="tower">0にもどす</button>'; document.getElementById('tTw').onclick=()=>fire(demoGift(2+Math.floor(Math.random()*3))); }
  const tmode=document.getElementById('tmode'), TQ={clock:'?w=time',up:'?w=time&mode=up',down:'?w=time&mode=down&min=60&per=1'};
  const setT=()=>{ const hst=document.getElementById('pv_time'); hst.innerHTML=''; place(hst,'time',{mode:tmode.value,nogift:true},pvW).classList.add('show'); document.getElementById('u_time').textContent=base+TQ[tmode.value]+(document.getElementById('thsel').value?'&theme=gold':''); if(document.getElementById('thsel').value) hst.querySelector('.wg').classList.add('luxe');
    document.getElementById('bt_time').innerHTML=tmode.value==='down'?'<span class="sz">min=はじめの分数、per=1コインでのびる秒数（アドレスの数字を書きかえて使います）</span>':''; }; tmode.onchange=setT; setT();
  const thsel=document.getElementById('thsel'), TH=()=>thsel.value?'&theme=gold':''; thsel.onchange=()=>{ document.querySelectorAll('#pv_win .wg,#pv_like .wg,#pv_gift .wg,#pv_time .wg').forEach(b=>b.classList.toggle('luxe',!!thsel.value)); document.getElementById('u_win').textContent=base+'?w=win'+TH(); document.getElementById('u_like').textContent=base+'?w=like'+TH(); document.getElementById('u_gift').textContent=base+'?w=gift'+TH(); setT(); };
  const fire=m=>{ tfEvent(m); LS.set('ov_test',{t:Date.now(),m}); };
  document.getElementById('bt_like').innerHTML='<button id="tLike">いいねをためす</button>'; document.getElementById('bt_gift').innerHTML='<button id="tGift">ギフトをためす</button>'; document.getElementById('bt_jar').innerHTML='<button id="tJar1">小さいギフト×5</button><button id="tJar2">大きいギフト</button>';
  document.getElementById('tLike').onclick=()=>fire(demoLike()); document.getElementById('tGift').onclick=()=>fire(demoGift()); document.getElementById('tJar1').onclick=()=>fire(demoGift(0,5)); document.getElementById('tJar2').onclick=()=>fire(demoGift(3+Math.floor(Math.random()*3)));
  document.addEventListener('click',e=>{ const c=e.target.closest('[data-copy]'); if(c){ const t=document.getElementById(c.dataset.copy).textContent; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{ c.textContent='コピーした'; setTimeout(()=>c.textContent='コピー',1500); },()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById(c.dataset.copy)); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }); }
    const r=e.target.closest('[data-rs]'); if(r) sendCmd({cmd:'reset',kind:r.dataset.rs}); });
  const on=document.getElementById('clOn'), us=document.getElementById('clUser'), ky=document.getElementById('clKey'); on.checked=!!CLOUD.on; us.value=CLOUD.user||''; if(CLOUD.key) ky.placeholder='（保存ずみ。変える時だけ入れる）';
  document.getElementById('clSave').onclick=()=>{ CLOUD.on=on.checked; CLOUD.user=us.value.trim().replace(/^@/,''); if(ky.value.trim()) CLOUD.key=ky.value.trim(); ky.value=''; LS.set('ov_cloud',CLOUD); document.getElementById('clMsg').textContent='保存しました。OBSの部品は、目のマークを消して付け直すと反映されます'; };
  let dn=0; const demo=setInterval(()=>{ dn++; tfEvent(Math.random()<.55?demoGift():demoLike()); },1100); for(let i=0;i<14;i++) tfEvent(i%2?demoGift():demoLike()); window.__ready=true;
}
