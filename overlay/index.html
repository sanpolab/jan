<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配信オーバーレイ</title>
<style>
@font-face{font-family:Dela;src:url(font/dela.woff2) format('woff2');font-display:swap}
@font-face{font-family:MPR;src:url(font/mpr.woff2) format('woff2');font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html.one,html.one body{overflow:hidden}
html,body{background:transparent;font-family:MPR,'Hiragino Maru Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif;color:#fff}
html.setup,body.setup{overflow:visible;height:auto;min-height:100%;touch-action:auto}
body.setup{background:#0a0a0c;-webkit-text-size-adjust:100%}
.host{position:relative;overflow:hidden}
.wg{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none}
.pop{font-family:Dela,MPR,sans-serif}
.ol{text-shadow:0 3px 0 #0b0c12,0 -2px 0 #0b0c12,2px 0 0 #0b0c12,-2px 0 0 #0b0c12,2px 2px 0 #0b0c12,-2px 2px 0 #0b0c12,0 6px 10px rgba(0,0,0,.45)}
.panel{background:linear-gradient(180deg,rgba(28,30,46,.92),rgba(14,15,24,.92));border:4px solid #fff;border-radius:28px;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.ctl{position:absolute;right:10px;bottom:8px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.wg:hover .ctl,.wg.show .ctl{opacity:1}
.ctl button{font:700 20px MPR,sans-serif;padding:6px 12px;border-radius:12px;border:2px solid #fff;background:#2b2e45;color:#fff;cursor:pointer}
.st{position:absolute;left:8px;top:8px;font:700 16px MPR,sans-serif;background:#c62828;color:#fff;border-radius:10px;padding:4px 10px;display:none;z-index:9}
/* WIN */
.win{width:600px;height:220px}
.win .panel{position:absolute;inset:8px 8px 14px;display:flex;align-items:center;justify-content:center;gap:34px}
.win .lab{font-size:64px;color:#ffd84a;letter-spacing:4px}
.win .num{font-size:128px;line-height:1;min-width:150px;text-align:center}
.win .num.pos{color:#7dff9a}.win .num.neg{color:#ff7d8b}
.bump{animation:bump .45s}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
/* ランキング */
.rank{width:560px}
.rank .ttl{height:74px;display:flex;align-items:center;justify-content:center;font-size:36px;border-radius:24px 24px 0 0;border:4px solid #fff;border-bottom:0}
.rank.like .ttl{background:linear-gradient(90deg,#ff4f8b,#ff8a5c)}
.rank.gift .ttl{background:linear-gradient(90deg,#7a5cff,#3fb6ff)}
.rank .list{position:relative;background:linear-gradient(180deg,rgba(28,30,46,.92),rgba(14,15,24,.92));border:4px solid #fff;border-radius:0 0 24px 24px;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.rank .row{position:absolute;left:0;right:0;height:84px;display:flex;align-items:center;padding:0 18px 0 12px;gap:12px;transition:top .5s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.rank .no{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:#3a3d57;flex:none}
.rank .row.r1 .no{background:#ffc92e;color:#4a3200}.rank .row.r2 .no{background:#cfd6e3;color:#2e3442}.rank .row.r3 .no{background:#e39a5b;color:#4a2408}
.rank .av{width:60px;height:60px;border-radius:50%;flex:none;border:3px solid #fff;background:#555 center/cover;display:flex;align-items:center;justify-content:center;font:700 28px MPR,sans-serif;overflow:hidden}
.rank .nm{flex:1;font:800 30px MPR,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .val{font-size:32px;color:#ffe37a;flex:none}
.rank .val small{font:700 18px MPR,sans-serif;color:#fff;margin-left:4px}
.rank .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 26px MPR,sans-serif;color:#aab}
/* 時間 */
.time{width:640px;height:220px}
.time .panel{position:absolute;inset:8px 8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time .lab{font:800 28px MPR,sans-serif;color:#9fe3ff;margin-bottom:2px}
.time .num{font-size:104px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:2px}
.time.hot .num{color:#ff6b6b;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.time .add{position:absolute;right:26px;top:16px;font-size:40px;color:#7dff9a;opacity:0}
.time .add.go{animation:rise 1.4s}
@keyframes rise{0%{opacity:0;transform:translateY(20px)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
/* びん */
.jar canvas{position:absolute;left:0;top:0}
.jar .cnt{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:40px}
.jar .cnt small{font:800 24px MPR,sans-serif;margin-left:6px}
/* ガチャ・タワー */
.gacha canvas,.tower canvas{position:absolute;left:0;top:0}
.roul .gres .pz{font-size:46px;margin:2px 0 8px}
.sk-yume .gres{border:4px solid #fff;border-radius:30px;background:linear-gradient(135deg,rgba(255,224,240,.97),rgba(236,220,255,.97) 52%,rgba(214,244,255,.97));box-shadow:0 0 0 4px #ffb3d9,0 8px 0 rgba(255,150,205,.45);font-family:'Hachi Maru Pop',MPR,sans-serif}
.sk-yume .gres .rk{font-family:'Hachi Maru Pop',MPR,sans-serif;text-shadow:0 3px 0 #fff,0 0 14px currentColor;-webkit-text-stroke:2px #fff}.sk-yume .gres .pz{color:#6a4a9c}.sk-yume .gres .who{color:#e0569a;border-top:2px dotted #ffb3d9}
.sk-wa .gres{border:5px double #a8232b;border-radius:6px;background:linear-gradient(180deg,rgba(247,239,220,.98),rgba(236,224,196,.98));box-shadow:0 0 0 3px #c9a44a,0 8px 0 rgba(40,20,10,.4);font-family:'Yuji Syuku','Hiragino Mincho ProN','Yu Mincho',serif}
.sk-wa .gres .rk{font-family:'Yuji Syuku','Hiragino Mincho ProN','Yu Mincho',serif;text-shadow:0 2px 0 rgba(0,0,0,.25);filter:brightness(.72) saturate(1.5)}.sk-wa .gres .pz{color:#1d1a16;font-weight:400}.sk-wa .gres .who{color:#a8232b;border-top:1px solid rgba(90,60,20,.4)}
.sk-neon .gres{border:3px solid #35f2ff;border-radius:8px;background:linear-gradient(180deg,rgba(8,10,26,.96),rgba(3,4,14,.96));box-shadow:0 0 14px #35f2ff,inset 0 0 22px rgba(255,61,214,.35);font-family:'Orbitron','Noto Sans JP',sans-serif}
.sk-neon .gres .rk{font-family:'Orbitron','Noto Sans JP',sans-serif}.sk-neon .gres .pz{color:#eafcff;text-shadow:0 0 10px #35f2ff;font-weight:900}.sk-neon .gres .who{color:#ff5ae0;border-top:1px solid rgba(53,242,255,.5);text-shadow:0 0 8px #ff3dd6}
.gres{position:absolute;left:40px;right:40px;top:8px;padding:14px 18px 16px;text-align:center;border-radius:18px;border:2px solid #d9b866;background:linear-gradient(180deg,rgba(24,20,14,.96),rgba(8,7,6,.96));box-shadow:0 0 0 5px rgba(8,7,6,.9),0 0 0 6px #8a6d2f,0 10px 30px rgba(0,0,0,.6);font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;opacity:0;transform:translateY(16px) scale(.92);transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1)}
.gres.on{opacity:1;transform:none}
.gres .rk{font:700 84px/1 Georgia,'Times New Roman',serif;letter-spacing:4px;text-shadow:0 0 18px currentColor,0 3px 0 rgba(0,0,0,.6)}
.gres .pz{font-size:34px;font-weight:700;line-height:1.3;color:#fff6dc;margin:6px 0 8px;word-break:break-word}
.gres .who{font-size:24px;color:#d9b866;border-top:1px solid rgba(217,184,102,.5);padding-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlab{position:absolute;left:0;right:0;bottom:0;height:104px;text-align:center;font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.8)}
.tlab .tt{font-size:28px;letter-spacing:6px;color:#e6cf8f}
.tlab .tn{font:700 54px/1.1 Georgia,'Times New Roman',serif;color:#fff3c4}
.tlab .tn small{font-size:24px;color:#e6cf8f;font-family:inherit}
.tower.done .tn .a{color:#ffd86b;text-shadow:0 0 20px #ffd86b}
.pg textarea{width:100%;min-height:64px;font:14px/1.7 'Noto Sans JP',sans-serif;padding:10px;border-radius:0;border:1px solid rgba(200,169,106,.35);background:#101013;color:#f2ede2;margin:6px 0 8px}
/* 黒金の着せ替え */
.luxe .panel{background:linear-gradient(180deg,rgba(26,21,14,.96),rgba(8,7,6,.96));border:2px solid #d9b866;border-radius:14px;box-shadow:0 0 0 5px rgba(8,7,6,.9),0 0 0 6px #8a6d2f,0 8px 20px rgba(0,0,0,.5)}
.luxe .pop{font-family:Georgia,'Times New Roman','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif;font-weight:700}
.luxe .ol{text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.7)}
.luxe.win .lab{color:#d9b866;letter-spacing:12px}.luxe.win .num{color:#fff3c4}.luxe.win .num.pos{color:#ffe9a8}.luxe.win .num.neg{color:#ffa3a8}
.luxe.rank .ttl{background:linear-gradient(180deg,#2c2315,#0c0a07);border:2px solid #d9b866;border-bottom:0;border-radius:14px 14px 0 0;color:#e6cf8f;letter-spacing:5px;font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif;font-weight:700}
.luxe.rank .list{background:linear-gradient(180deg,rgba(26,21,14,.96),rgba(8,7,6,.96));border:2px solid #d9b866;border-radius:0 0 14px 14px;box-shadow:0 0 0 5px rgba(8,7,6,.9),0 0 0 6px #8a6d2f}
.luxe.rank .no{background:#231d12;color:#d9b866;border:1px solid #8a6d2f}
.luxe.rank .row.r1 .no{background:linear-gradient(135deg,#fff0b8,#d9a93a);color:#3a2800}.luxe.rank .row.r2 .no{background:linear-gradient(135deg,#f4f6fa,#a9b2c2);color:#2a2f3a}.luxe.rank .row.r3 .no{background:linear-gradient(135deg,#f0c39a,#b5713a);color:#3a1c06}
.luxe.rank .av{border:2px solid #d9b866}.luxe.rank .nm{font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif;color:#fff6dc}.luxe.rank .val{color:#ffe08a}.luxe.rank .val small{color:#d9b866}
.luxe.rank .row+.row{border-top:1px solid rgba(217,184,102,.18)}
.luxe.time .lab{color:#d9b866;letter-spacing:8px;font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif}.luxe.time .num{color:#fff3c4}
/* VIP・王座・ハート・花火 */
.vip{overflow:hidden}
.vip canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
.vip .cu{position:absolute;top:0;width:962px;height:1080px;background-size:100% 100%;transition:transform .5s cubic-bezier(.3,.9,.4,1);will-change:transform;box-shadow:0 0 60px rgba(0,0,0,.6)}
.vip .cl{left:0;background-image:url(img/curtL.webp);transform:translateX(-104%)}.vip .cr{right:0;background-image:url(img/curtR.webp);transform:translateX(104%)}
.vip.st-shut .cu{transform:none}

.vip .pn{position:absolute;left:150px;right:150px;top:158px;height:160px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;font-weight:700;color:#ffe9a8;text-shadow:0 0 22px rgba(255,216,107,.75),0 3px 0 #000;letter-spacing:4px}
.vip .ps{position:absolute;left:150px;right:150px;top:318px;text-align:center;font:700 38px 'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;color:#d9b866;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:3px}
.vip.sk-yume .cl{background-image:url(img/curtL_yume.webp)}.vip.sk-yume .cr{background-image:url(img/curtR_yume.webp)}
.vip.sk-wa .pn{font-family:'Yuji Syuku','Hiragino Mincho ProN','Yu Mincho',serif;font-weight:400;left:380px;right:380px;top:150px;height:140px;color:#f7e3a0}.vip.sk-wa .ps{font-family:'Yuji Syuku','Hiragino Mincho ProN','Yu Mincho',serif;font-weight:400;left:380px;right:380px;top:296px;font-size:32px}
.vip.sk-neon .cu{display:none}
.vip.sk-neon .pn{font-family:'Orbitron','Noto Sans JP',sans-serif;font-weight:900;left:230px;right:230px;top:146px;height:140px;color:#eafcff;text-shadow:0 0 14px #35f2ff,0 0 34px #35f2ff}.vip.sk-neon .ps{font-family:'Orbitron','Noto Sans JP',sans-serif;font-weight:900;left:230px;right:230px;top:292px;font-size:30px;color:#ff5ae0;text-shadow:0 0 10px #ff3dd6}
.vip.sk-neon.st-shut .pl{opacity:0}
.vip.sk-neon.st-shut::after{content:'';position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(90deg,transparent,rgba(53,242,255,.75),rgba(255,61,214,.75),transparent);animation:nsw 1s linear}
@keyframes nsw{to{left:100%}}
.vip.sk-yume .pn{font-family:'Hachi Maru Pop',MPR,sans-serif;font-weight:400;color:#e0569a;text-shadow:0 3px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;top:160px;height:140px;-webkit-text-stroke:1.5px #e0569a}
.vip.sk-yume .ps{font-family:'Hachi Maru Pop',MPR,sans-serif;font-weight:400;color:#6a3fb5;top:322px;font-size:30px;-webkit-text-stroke:.6px #6a3fb5}
.king.sk-yume .kn{font-family:'Hachi Maru Pop',MPR,sans-serif;font-weight:400;text-shadow:0 1px 0 #fff}.king.sk-yume .kc{font-family:'Hachi Maru Pop',MPR,sans-serif;color:#fff;text-shadow:0 2px 0 #e0569a,0 0 10px rgba(0,0,0,.5)}.king.sk-yume .kc small{font-family:'Hachi Maru Pop',MPR,sans-serif;color:#ffd6ec}
.king.sk-neon .kn{font-family:'Orbitron','Noto Sans JP',sans-serif;font-weight:900;text-shadow:0 0 8px #35f2ff}.king.sk-neon .kc{font-family:'Orbitron','Noto Sans JP',sans-serif;font-weight:900;color:#fff36b;text-shadow:0 0 12px #fff36b}.king.sk-neon .kc small{font-family:'Orbitron','Noto Sans JP',sans-serif;color:#35f2ff}
.king.sk-wa .kn,.king.sk-wa .kc,.king.sk-wa .kc small{font-family:'Yuji Syuku','Hiragino Mincho ProN','Yu Mincho',serif;font-weight:400}
.king .kav{position:absolute;left:104px;top:118px;width:308px;height:308px;border-radius:50%;background:#1a140c center/cover;display:flex;align-items:center;justify-content:center;font:700 150px 'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP',serif;color:#fff6dc}
.king .kf{position:absolute;left:0;top:0;width:520px;height:520px}

.king .kc{position:absolute;left:0;right:0;top:522px;text-align:center;font:700 50px/1.1 Georgia,'Times New Roman',serif;color:#fff3c4;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.8)}

/* コメント・あいさつ */
.chatw .cl{position:absolute;left:0;right:0;bottom:6px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.chatw .ci{display:flex;align-items:flex-start;gap:12px;opacity:0;transform:translateX(-30px);transition:opacity .3s,transform .35s cubic-bezier(.2,1.2,.4,1)}

<body>

<script>
'use strict';
const Q=new URLSearchParams(location.search), W=Q.get('w');
const HOME_URL='https://sanpolab.github.io/jan/overlay/', EMBED=!/(^|\.)github\.io$|^localhost$|^127\./.test(location.hostname);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
/* つなぎ先。キーはこの端末（このブラウザ）の中にだけ保存する。アドレスには入れない */
let CLOUD={on:false,user:'',key:''}; Object.assign(CLOUD,LS.get('ov_cloud',{})||{});
if(!CLOUD.key){ for(const src of ['gmerge_cloud','trap_cloud','rocket_cloud','tsumi_cloud','bike_cloud']){ const t=LS.get(src,null); if(t&&t.key&&t.user){ CLOUD={on:!!t.on,user:String(t.user),key:String(t.key)}; LS.set('ov_cloud',CLOUD); break; } } }
const cloudOn=()=>!!(CLOUD.on&&CLOUD.user&&CLOUD.key);
const BUS={h:{},on(ev,f){(this.h[ev]=this.h[ev]||[]).push(f);},emit(ev,d){(this.h[ev]||[]).forEach(f=>{try{f(d);}catch(e){console.error(e);}});}};
const TF={urls:['ws://localhost:21213/','ws://127.0.0.1:21213/'],tries:0,ws:null,ok:false,wait:3000,timer:null,streak:{},why:''};
function tfUI(){ const el=document.getElementById('st'); if(!el) return; if(Q.get('status')==='0'||TF.ok){ el.style.display='none'; return; } el.style.display='block'; el.textContent=(cloudOn()?'つなぎ先':'TikFinity')+'につながっていません'+(TF.why?'：'+TF.why:''); }
function tfConnect(){ clearTimeout(TF.timer); try{ if(TF.ws){ TF.ws.onclose=null; TF.ws.close(); } }catch(e){}
  TF.tries++; const url=cloudOn()?'wss://api.tik.tools?uniqueId='+encodeURIComponent(CLOUD.user.replace(/^@/,''))+'&apiKey='+encodeURIComponent(CLOUD.key):TF.urls[TF.tries%2]; let ws;
  try{ ws=new WebSocket(url); }catch(e){ TF.ok=false; tfUI(); TF.timer=setTimeout(tfConnect,TF.wait=Math.min(20000,TF.wait*1.5)); return; }
  TF.ws=ws; ws.onopen=()=>{ TF.ok=true; TF.tries=0; TF.why=''; TF.wait=3000; tfUI(); };
  ws.onclose=ev=>{ if(TF.ws!==ws) return; TF.ok=false; TF.wait=Math.min(20000,TF.wait*1.5); TF.why='';
    if(cloudOn()&&ev){ const r=String(ev.reason||''), q=r.toLowerCase(), c=ev.code; TF.why=/not currently live|not live|offline/.test(q)?'いまは配信していないようです':/expired|evaluation|trial/.test(q)?'APIキーの期限が切れています':/limit|too many|concurrent|quota|rate/.test(q)||c===4429?'同時につなげる数の上限です':/key|unauthor|forbidden|auth|invalid/.test(q)||c===4401||c===4403?'APIキーがちがうようです':'';
      const mm=/retry after (\d+)\s*s/i.exec(r); if(mm) TF.wait=Math.min(600,(+mm[1])+3)*1000; }
    tfUI(); TF.timer=setTimeout(tfConnect,TF.wait); };
  ws.onerror=()=>{}; ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(_){ return; } try{ tfEvent(m); }catch(err){ console.error(err); } }; }
const isAdmin=uid=>{ const a=String(Q.get('admin')||CLOUD.user||'').replace(/^@/,'').toLowerCase(); return !!a && String(uid||'').replace(/^@/,'').toLowerCase()===a; };
function tfEvent(m){ const ev=String(m.event||m.type||'').toLowerCase(), d=m.data||m||{}, u=d.user||{}, name=d.nickname||u.nickname||d.uniqueId||u.uniqueId||'だれか', uid=String(d.uniqueId||u.uniqueId||d.userId||u.userId||name);
  const av=d.profilePictureUrl||u.profilePictureUrl||(u.profilePicture&&(u.profilePicture.url||(u.profilePicture.urls&&u.profilePicture.urls[0])))||(u.avatarThumb&&u.avatarThumb.url_list&&u.avatarThumb.url_list[0])||null;
  if(ev==='gift'){ const gd=d.giftDetails||d.extendedGiftInfo||d.gift||{}, id=d.giftId!=null?d.giftId:(gd.id!=null?gd.id:gd.giftId), gname=d.giftName||gd.giftName||gd.name||('ID'+id), coins=parseInt(d.diamondCount!=null?d.diamondCount:(gd.diamondCount!=null?gd.diamondCount:gd.diamond_count),10)||1,
      pic=d.giftPictureUrl||gd.giftPictureUrl||gd.pictureUrl||(gd.icon&&gd.icon.url_list&&gd.icon.url_list[0])||(gd.image&&gd.image.url_list&&gd.image.url_list[0])||null, gtype=d.giftType!=null?d.giftType:gd.giftType, rc=Math.max(1,parseInt(d.repeatCount,10)||1), end=!!d.repeatEnd;
    let n=rc; if(gtype===1){ const k=uid+'|'+id, last=TF.streak[k]||0; n=Math.max(0,rc-last); if(end) delete TF.streak[k]; else TF.streak[k]=rc; }
    if(n>0) BUS.emit('gift',{name,uid,av,gname,coins,pic,n:Math.min(n,5000)}); }
  else if(ev==='like'){ const c=parseInt(d.likeCount!=null?d.likeCount:(d.count!=null?d.count:d.likes),10)||1; BUS.emit('like',{name,uid,av,n:c}); }
  else if(ev==='chat'){ const tx=d.comment!=null?d.comment:(d.text!=null?d.text:d.content); BUS.emit('chat',{name,uid,av,text:String(tx||''),admin:isAdmin(uid)}); }
  else if(ev==='follow') BUS.emit('follow',{name,uid,av});
  else if(ev==='member'||ev==='join'||ev==='enter') BUS.emit('join',{name,uid,av});
  else if(ev==='social'){ const t=String(d.displayType||d.label||'').toLowerCase(); if(t.includes('follow')) BUS.emit('follow',{name,uid,av}); } }
window.OvTF={simulate:m=>tfEvent(m),TF,BUS};
/* せつめいページの「ためす」ボタンや操作を、同じブラウザで開いているほかの部品にも届ける */
window.addEventListener('storage',e=>{ if(e.key==='ov_test'&&e.newValue){ try{ tfEvent(JSON.parse(e.newValue).m); }catch(_){} } if(e.key==='ov_cmd'&&e.newValue){ try{ BUS.emit('cmd',JSON.parse(e.newValue)); }catch(_){} } });
const sendCmd=c=>{ c.t=Date.now(); LS.set('ov_cmd',c); BUS.emit('cmd',c); };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLS=['#ff6b8b','#ffb347','#5cc8ff','#8f7bff','#5fd68a','#ff8a5c','#e86bd6','#48c9b0'];
const hue=s=>{ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; return COLS[h%COLS.length]; };

/* ===== WINカウンター ===== */
function mountWin(box,o){ box.innerHTML='<div class="panel"><div class="lab pop ol"></div><div class="num pop ol"></div></div><div class="ctl"><button data-d="-1">−1</button><button data-d="1">＋1</button><button data-z="1">0にもどす</button></div>';
  box.classList.add('win'); box.querySelector('.lab').textContent=o.label||'WIN'; const num=box.querySelector('.num'); let v=LS.get('ov_win',0)|0;
  const draw=b=>{ num.textContent=v; num.className='num pop ol '+(v>0?'pos':v<0?'neg':''); if(b){ void num.offsetWidth; num.classList.add('bump'); } };
  const set=nv=>{ v=Math.max(-999,Math.min(9999,nv|0)); LS.set('ov_win',v); draw(true); };
  box.querySelector('.ctl').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; if(b.dataset.z) set(0); else set(v+(+b.dataset.d)); });
  window.addEventListener('storage',e=>{ if(e.key==='ov_win'){ v=LS.get('ov_win',0)|0; draw(true); } });
  BUS.on('chat',c=>{ if(!c.admin) return; const m=/^\s*win\s*([+\-=＋－−＝])\s*(\d+)\s*$/i.exec(c.text); if(!m) return; const k=m[1], n=+m[2]; set(/[=＝]/.test(k)?n:/[+＋]/.test(k)?v+n:v-n); });
  draw(); return {w:600,h:220}; }

/* ===== ランキング（いいね・ギフト） ===== */
function mountRank(box,o){ const kind=o.kind, top=Math.max(1,Math.min(10,o.top||5)), key='ov_rank_'+kind, RH=78, H1=116, LH=H1+(top-1)*RH+12;
  box.classList.add('rank',kind); box.innerHTML='<div class="ttl pop ol"></div><div class="list"><div class="empty"></div></div>';
  box.querySelector('.ttl').textContent=o.title||(kind==='like'?'♥ いいねランキング':'🎁 ギフトランキング'); const list=box.querySelector('.list'), empty=box.querySelector('.empty'); list.style.height=LH+'px';
  empty.textContent=kind==='like'?'いいねをタップして1位をねらおう！':'ギフトでランクイン！';
  let M=new Map(); if(!o.demo){ const sv=LS.get(key,null); if(sv&&sv.t&&Date.now()-sv.t<8*3600e3) for(const r of sv.l) M.set(r.uid,r); }
  const rows=new Map(); let saveT=0;
  const draw=()=>{ const arr=[...M.values()].sort((a,b)=>b.v-a.v).slice(0,top); empty.style.display=arr.length?'none':'flex'; const keep=new Set();
    arr.forEach((r,i)=>{ keep.add(r.uid); let el=rows.get(r.uid); if(!el){ el=document.createElement('div'); el.className='row'; el.innerHTML='<div class="bar"><i></i></div><div class="cr"></div><div class="no pop"></div><div class="av"></div><div class="nm ol"></div><div class="val pop ol"><span></span><small></small></div>'; el.style.top=LH+'px'; el.style.opacity='0'; list.appendChild(el); rows.set(r.uid,el); void el.offsetWidth; el.querySelector('small').textContent=kind==='like'?'いいね':'コイン'; }
      el.className='row r'+(i+1); el.style.top=(6+(i?H1+(i-1)*RH:0))+'px'; el.querySelector('.bar i').style.width=Math.max(4,r.v/arr[0].v*100)+'%'; el.style.opacity='1'; el.querySelector('.no').textContent=i+1; el.querySelector('.nm').textContent=r.name; const av=el.querySelector('.av'); if(r.av){ av.style.backgroundImage='url("'+String(r.av).replace(/["\\\n]/g,'')+'")'; av.textContent=''; } else { av.style.backgroundImage=''; av.style.backgroundColor=hue(r.uid); av.textContent=[...r.name][0]||'?'; }
      const sp=el.querySelector('.val span'), tx=r.v.toLocaleString('ja-JP'); if(sp.textContent!==tx){ sp.textContent=tx; sp.classList.remove('bump'); void sp.offsetWidth; sp.style.display='inline-block'; sp.classList.add('bump'); } });
    for(const [uid,el] of rows) if(!keep.has(uid)){ el.remove(); rows.delete(uid); } };
  const add=(e,amt)=>{ let r=M.get(e.uid); if(!r){ r={uid:e.uid,name:e.name,av:e.av||null,v:0}; M.set(e.uid,r); } r.name=e.name; if(e.av) r.av=e.av; r.v+=amt; draw();
    if(!o.demo && Date.now()-saveT>2000){ saveT=Date.now(); LS.set(key,{t:Date.now(),l:[...M.values()].sort((a,b)=>b.v-a.v).slice(0,60)}); } };
  if(kind==='like') BUS.on('like',e=>add(e,e.n)); else BUS.on('gift',e=>add(e,e.coins*e.n));

  BUS.on('chat',c=>{ if(c.admin && /^\s*(ランキング|rank)\s*(リセット|reset)\s*$/i.test(c.text)){ M=new Map(); LS.set(key,{t:Date.now(),l:[]}); draw(); } });

/* ===== 時間（時計・配信時間・耐久タイマー） ===== */
function mountTime(box,o){ const mode=o.mode||'clock'; box.classList.add('time');
  box.innerHTML='<div class="panel"><div class="lab"></div><div class="num pop"></div>'+(mode==='down'?'<div class="tbar"><i></i></div>':'')+'<div class="add pop ol"></div></div>'+(mode==='clock'?'':'<div class="ctl">'+(mode==='down'?'<button data-a="tog">▶/⏸</button><button data-a="p">＋1分</button><button data-a="m">−1分</button>':'')+'<button data-a="rst">リセット</button></div>');
