<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>チャリで行け（試作）</title>
<style>
@font-face{font-family:MPR;src:url(./font/mpr.woff2) format('woff2');font-weight:900;font-display:swap}
@font-face{font-family:DELA;src:url(./font/dela.woff2) format('woff2');font-display:swap}
html,body{margin:0;height:100%;background:#fff;overflow:hidden;font-family:MPR,'Hiragino Sans','Noto Sans JP',sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hb{position:absolute;right:1.6%;width:10%;height:3.6%;border-radius:999px;border:2px solid #111;background:#fff;color:#111;font:900 calc(var(--u)*1.7) MPR,sans-serif;z-index:3;padding:0}
#testBtn{top:1.2%}
#tp{position:absolute;left:3%;right:3%;top:17%;bottom:3%;background:rgba(8,12,30,.95);border:2px solid #9be9ff;border-radius:14px;overflow:auto;padding:1.5%;z-index:4;box-sizing:border-box}
#tp h3{color:#ffd23f;font-size:calc(var(--u)*2.2);margin:.6em 0 .3em}
#tp button{width:31.6%;margin:.6%;padding:.7em .2em;border-radius:10px;border:0;color:#fff;font:900 calc(var(--u)*1.75) MPR,sans-serif;line-height:1.3}
#tp button.h{background:#1f8a4c}#tp button.j{background:#b0303a}#tp button.g{background:#39507f}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="1080" height="1080"></canvas>
  <button id="testBtn" class="hb" type="button">テスト</button>
  <div id="tp" hidden>
    <h3>お助け</h3>
    <button class="h" data-a="push">ひと押し<br>大きな手が押す（＋40m）</button><button class="h" data-a="cheer">応援団<br>10秒 1.3倍速（連打で人が増える）</button><button class="h" data-a="assist">電動アシスト<br>15秒 1.5倍速</button><button class="h" data-a="ramp">ジャンプ台<br>大ジャンプで ＋200m</button>
    <button class="h" data-a="helmet">ヘルメット<br>1回こけない（3個まで）</button><button class="h" data-a="heart">ハート<br>体力 ＋1</button><button class="h" data-a="heal">全回復<br>体力まんたん</button>
    <button class="h" data-a="big">でかタイヤ<br>10秒 穴・岩・振動・バナナが効かない</button><button class="h" data-a="rocket">ロケット自転車<br>5秒 ぶっ飛ばす</button>
    <h3>妨害</h3>
    <button class="j" data-a="banana">バナナの皮<br>ふむとこける</button><button class="j" data-a="puddle">水たまり<br>3秒 おそくなる</button>
    <button class="j" data-a="dog">犬<br>追いつかれるとこける</button><button class="j" data-a="rock">奥から岩<br>前後に動いてよける</button><button class="j" data-a="pit">落とし穴<br>落ちるとこける</button>
    <button class="j" data-a="block">ストップの手<br>ずがががっと押しもどす（−60m・連打で続く）</button><button class="j" data-a="bird">鳥<br>3羽（ジャンプするとぶつかる）</button><button class="j" data-a="hill">坂道<br>20回こぐまで終わらない（重ねると増える）</button><button class="j" data-a="cloud">カミナリ雲<br>前後に動いてよける</button><button class="j" data-a="giant">巨人<br>ハンマー3回（ジャンプでよける）</button><button class="j" data-a="punk">パンク<br>6秒 おそくなる</button>
    <h3>その他</h3>
    <button class="g" data-a="g5000">目標 5,000m</button><button class="g" data-a="g20000">目標 20,000m</button><button class="g" data-a="g50000">目標 50,000m</button>
    <button class="g" data-a="reset">さいしょから</button><button class="g" data-a="close">とじる</button>
  </div>
</div></div>
<script>
'use strict';
const cv=document.getElementById('cv'), g=cv.getContext('2d'), stage=document.getElementById('stage');
const W=1080, H=1080, FONT="MPR,'Hiragino Sans','Noto Sans JP',sans-serif", FONTD="DELA,"+FONT;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Math.floor(n).toLocaleString('ja-JP');
function fit(){ const k=Math.min(window.innerWidth/W,window.innerHeight/H), w=Math.floor(W*k); stage.style.width=w+'px'; stage.style.height=w+'px'; stage.style.setProperty('--u',(w/100)+'px'); }
window.addEventListener('resize',fit); fit();

/* ===== 音（効果音ラボの音だけ。自作の電子音は使わない） ===== */
const SND=['hit','heal','speed','fanfare','bad','gust','guard','bless','boost','fall','don','levelup','bite','bubble','boom','count'], sndBuf={}; let actx=null, seGain=null;
function audioInit(){ if(actx) return; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); seGain=actx.createGain(); seGain.gain.value=.8; const hs=actx.createBiquadFilter(); hs.type='highshelf'; hs.frequency.value=5000; hs.gain.value=-6; seGain.connect(hs); hs.connect(actx.destination);
  for(const k of SND) fetch('./snd/'+k+'.mp3').then(r=>r.arrayBuffer()).then(b=>actx.decodeAudioData(b)).then(b=>{ sndBuf[k]=b; }).catch(()=>{}); }catch(e){} }
function play(k,v){ if(!actx || !sndBuf[k]) return; try{ const s=actx.createBufferSource(), gn=actx.createGain(); s.buffer=sndBuf[k]; gn.gain.value=v==null?.7:v; s.connect(gn); gn.connect(seGain); s.start(); }catch(e){} }
window.addEventListener('pointerdown',()=>{ audioInit(); if(actx && actx.state==='suspended') actx.resume(); },{passive:true});

/* ===== 設定の数字 ===== */
const PPM=40;                       /* 1m＝画面の40ドット */
const CFG={goal:20000, speed:28, hp:5, jumpV:-930, grav:2500};
const BX=340, WR=46, WB=150;        /* 自転車の画面上の位置、タイヤの半径、前後のタイヤの間隔 */
const FALLS_PER=5;
/* ひと押し：画面の左から大きな手が出てきて、自転車のうしろをポンと押す（少しだけ前へ進む）。安いギフト向き。連打された分は順番に押す */
const PUSH={gain:40,inT:.28,hold:.12,outT:.35,w:520};
/* ストップの手（妨害）：画面の右はしから大きな手が出てきて、自転車を前から押しもどす（少しだけ後ろへ下がる）。安いギフト向き。連打された分は順番に押す */
const BLOCK={back:60,inT:.24,per:.6,outT:.35,h:300};   /* 1回ぶん（60m）を per 秒かけて、ずがががっと押しもどす。連打された分は、手が出たまま続けて押す */
/* 応援団：道の向こう側に観客がならんで、スピードが上がる。連打されるほど観客が増えて、少しずつ速くなる */
const CHEER={sec:10,maxSec:60,maxN:6,mul:1.3,add:.06,gap:150,h:230};
/* 岩：画面の奥（道の向こう）から、はねながらだんだん大きくなって転がってくる。ねらった場所（赤いしるし）に落ちるので、前後に動いてよける。ジャンプではよけられない */
const ROCK={T:2.6,out:.55,hit:158,max:5,w:280};
/* 鳥：頭より少し高いところを3羽つづけて飛んでくる。ジャンプするとぶつかる（飛ばずにくぐる）
   坂道：急な上り坂。決まった回数（taps回）こぐまで終わらない。こがないとほとんど進まない。何個も投げられたら、その分こぐ回数が増える（タップ1回で、ひとこぎ＋ジャンプ。回数に上限はない）
   カミナリ雲：頭の上についてきて、止まってから落ちる。前後に動いてよける（ジャンプではよけられない） */
const BIRD={n:3,gap:1.1,h:392,v:420,hit:70}, HILL={taps:20,base:.1,tap:.34,decay:1.5,tilt:.2}, CLOUD={follow:2.2,warn:.9,after:.7,h:400,hit:86,max:6,offs:[0,-200,200,-400,400,-600]};   /* 連打された分だけ雲が同時に出る（max個まで）。2つ目からは自転車の前後にずれた場所をねらう */
/* 巨人：画面の奥に出てきて、ハンマーで地面を3回たたく。たたくたびに地面を振動（波）が走ってくるので、ジャンプでよける。よけそこなうとこける */
const GIANT={n:3,inT:2.2,outT:1.6,sink:58,x:810,waveV:1150,h:540,fw:298,fh:325,cols:8,nf:48,fps:12,rate:1.3,hitF:8.6,hx:-.22};   /* 絵のコマ（横298×たて325が48コマ、1秒12コマ）、再生の速さ、ハンマーが地面に当たるコマ、当たる場所（巨人の中心から、横幅の何倍ぶん左か） */
const T_={wind:10,windMul:2,assist:15,assistMul:1.5,rocket:5,rocketMul:3,headwind:5,headMul:.4,puddle:3,puddleMul:.5,punk:6,punkMul:.5,crash:1.7,inv:2,back:1.6,dog:2.6,big:10,bigK:2.1,helmetMax:3,rampGain:200};
let S, best=0, tries=1, wins=0, falls=0, T=0;
try{ const o=JSON.parse(localStorage.getItem('bike_save')||'{}'); best=o.best||0; tries=o.tries||1; wins=o.wins||0; falls=o.falls||0; if(o.g3) CFG.goal=o.g3; }catch(e){}
function save(){ try{ localStorage.setItem('bike_save',JSON.stringify({best,tries,wins,falls,g3:CFG.goal})); }catch(e){} }
function newRun(){ const lg=S?S.log:[]; S={ mode:'ride', x:0, hp:CFG.hp, jy:0, vy:0, air:false, wheel:0, ents:[], pits:[], parts:[], log:lg, windT:0, cheerT:0, cheerN:0, cheerIn:0, push:null, pushQ:0, pushGain:0, block:null, blockLeft:0, assistT:0, rocketT:0, headT:0, puddleT:0, punkT:0, helmet:0, invT:0, crashT:0, backT:0, backFrom:0, clearT:0, dog:null, flash:0, shake:0, red:0, banner:null, winFx:0, fallFx:0, spd:0, lean:0, rider:null, bikeP:null, holdT:.6, bigT:0, bigK:1, birds:[], birdQ:0, birdT:0, hillNeed:0, hillAll:0, tapPow:0, tilt:0, clouds:[], bolts:[], rocks:[], ox:(S?S.ox:0), tx:(S?S.tx:0), mileI:0, mileFx:null, giant:null, waves:[], bursts:[] }; }
function logAdd(t,c){ S.log.push({t,c:c||'#fff',at:T}); if(S.log.length>3) S.log.shift(); }
function banner(t,c,sub){ S.banner={t,c,sub:sub||'',at:0}; }

/* ===== 地面：ゆるい坂。落とし穴の中は地面が無い ===== */
const SEG=380, GH=[0,0,-46,-46,0,34,34,0,0,-60,-60,-20,-20,26,0,0,-34,-34,30,30,0,-52,-52,0,22,22,-28,0];   /* 地面は直線だけ：SEG ドットごとの高さを直線でつなぐ（平らな所と、まっすぐな坂） */
function gh(i){ return i<3?0:GH[(i*7+Math.floor(i/GH.length)*3)%GH.length]; }
function gy0(wx){ const f=Math.max(0,wx)/SEG, i=Math.floor(f), u=f-i; return 742+gh(i)+(gh(i+1)-gh(i))*u; }
function pitAt(wx){ for(const p of S.pits) if(wx>p.x && wx<p.x+p.w) return p; return null; }
const camX=()=>S.x*PPM-BX;
const MOVE={min:-230,max:470,key:620};   /* 自転車を画面の中で前後に動かせる幅（左はし〜右はし）と、キーで動かす速さ */
const BXX=()=>BX+(S?S.ox:0);   /* 自転車の画面上の横の位置。進んだ距離とは別で、前に出るほど物が早く来て、後ろに下がるほど犬に近い */
function bikePose(){ const cx=camX()+BXX(), yr=gy0(cx-WB/2), yf=gy0(cx+WB/2), ang=Math.atan2(yf-yr,WB); return {cx,y:(yr+yf)/2-WR*S.bigK+S.jy,ang}; }

/* ===== できごと（ギフトで起きること） ===== */
const ahead=()=>camX()+W+rand(1500,1900);   /* 速いので、物は画面のずっと先に置く（見えてからよける時間を残す） */
const Game={
  jump(){ if(S.mode==='ride' && S.hillNeed>0 && S.rocketT<=0){ S.tapPow=Math.min(1.25,S.tapPow+HILL.tap); dust(2); S.hillNeed--; if(S.hillNeed<=0){ S.hillNeed=0; S.hillAll=0; play('levelup',.6); logAdd('坂道をのぼりきった！','#5dffb0'); } }   /* 坂道の間は、タップ＝ひとこぎ。ジャンプもふつうにできる（空中で押しても、こいだ数に入る） */
    if(S.mode!=='ride' || S.air || S.rocketT>0) return; S.air=true; S.vy=CFG.jumpV; dust(8); },
  push(n){ if(S.mode!=='ride') return; S.pushQ=Math.min(30,S.pushQ+1); logAdd((n||'だれか')+' がうしろから押してくれた（＋'+PUSH.gain+'m）','#5dffb0'); },
  block(n){ if(S.mode!=='ride' || S.rocketT>0) return; S.blockLeft+=BLOCK.back; if(!S.block) S.block={t:0,st:'in',tick:0}; else if(S.block.st==='out'){ S.block.st='in'; S.block.t=BLOCK.inT*(1-Math.min(1,S.block.t/BLOCK.outT)); } logAdd((n||'だれか')+' の手が押しもどした（−'+BLOCK.back+'m）','#ff9aa8'); },
  cheer(n){ if(S.mode!=='ride') return; S.cheerT=Math.min(CHEER.maxSec,S.cheerT+CHEER.sec); S.cheerN=Math.min(CHEER.maxN,S.cheerN+1); if(S.cheerN===1) S.cheerIn=0; play('levelup',.5); logAdd((n||'だれか')+' が応援団を呼んだ（'+CHEER.sec+'秒 スピードアップ・'+S.cheerN+'組め）','#5dffb0'); },
  assist(n){ if(S.mode!=='ride') return; S.assistT=Math.min(45,S.assistT+T_.assist); S.punkT=0; play('boost',.6); logAdd((n||'だれか')+' が電動アシストをつけた（'+T_.assist+'秒 1.5倍速）','#5dffb0'); },
  ramp(n){ if(S.mode!=='ride') return; S.ents.push({k:'ramp',x:ahead(),by:n}); logAdd((n||'だれか')+' がジャンプ台を置いた','#5dffb0'); },
  helmet(n){ if(S.mode!=='ride') return; S.helmet=Math.min(T_.helmetMax,S.helmet+1); play('bless',.6); logAdd((n||'だれか')+' がヘルメットをくれた（あと'+S.helmet+'回こけない）','#5dffb0'); },
  heart(n){ if(S.mode!=='ride') return; if(S.hp<CFG.hp){ S.hp++; play('heal',.6); } logAdd((n||'だれか')+' のハートで体力 ＋1','#5dffb0'); },
  heal(n){ if(S.mode!=='ride') return; S.hp=CFG.hp; S.punkT=0; S.puddleT=0; play('heal',.7); S.flash=.3; logAdd((n||'だれか')+' が全回復してくれた','#5dffb0'); },
  rocket(n){ if(S.mode!=='ride') return; S.hillNeed=0; S.hillAll=0; S.rocketT=Math.min(15,S.rocketT+T_.rocket); S.headT=0; S.punkT=0; S.puddleT=0; S.dog=null; S.air=true; S.vy=-400; play('boom',.6); play('speed',.7); S.flash=.4; S.shake=.4; banner('ロケット自転車！','#ffd23f',n); logAdd((n||'だれか')+' がロケットをつけた（'+T_.rocket+'秒 ぶっ飛ばす）','#ffd23f'); },
  banana(n){ if(S.mode!=='ride') return; S.ents.push({k:'banana',x:ahead(),by:n}); logAdd((n||'だれか')+' がバナナの皮を置いた','#ff9aa8'); },
  puddle(n){ if(S.mode!=='ride') return; S.ents.push({k:'puddle',x:ahead(),by:n}); logAdd((n||'だれか')+' が水たまりを作った','#ff9aa8'); },
  dog(n){ if(S.mode!=='ride' || S.dog || S.rocketT>0) return; S.dog={t:0,by:n,x:-180,st:'run'}; play('bite',.5); logAdd((n||'だれか')+' の犬が追いかけてきた！','#ff9aa8'); },
  rock(n){ if(S.mode!=='ride' || S.rocks.length>=ROCK.max) return; const tx=clamp(BXX()+(S.rocks.length?rand(-280,280):0),150,W-170); S.rocks.push({f0:Math.floor(rand(0,12)),t:0,tx,x0:clamp(tx+rand(-260,260)+180,200,W-80),by:n,rot:0,hit:false}); play('don',.5); logAdd((n||'だれか')+' が奥から岩を転がした（前後に動いてよけろ）','#ff9aa8'); },
  pit(n){ if(S.mode!=='ride') return; S.pits.push({x:ahead()+60,w:560,by:n}); logAdd((n||'だれか')+' が落とし穴をほった','#ff9aa8'); },
  big(n){ if(S.mode!=='ride') return; S.bigT=Math.min(30,S.bigT+T_.big); S.punkT=0; play('levelup',.7); S.flash=.2; banner('でかタイヤ！','#111',n); logAdd((n||'だれか')+' がタイヤをでっかくした（'+T_.big+'秒 落とし穴・岩・振動・バナナが効かない）','#5dffb0'); },
  bird(n){ if(S.mode!=='ride') return; S.birdQ+=BIRD.n; play('gust',.4); logAdd((n||'だれか')+' が鳥を飛ばした（'+BIRD.n+'羽・ジャンプするとぶつかる）','#ff9aa8'); S.birdBy=n; },
  hill(n){ if(S.mode!=='ride' || S.rocketT>0) return; const add=HILL.taps; S.hillNeed+=add; S.hillAll=Math.max(S.hillAll,0)+add; S.windT=0; S.assistT=0; play('bad',.5); banner('坂道！ 連打でこげ！','#e23a3a',n); logAdd((n||'だれか')+' が急な坂道にした（あと'+S.hillNeed+'回こぐまで終わらない）','#ff9aa8'); },
  cloud(n){ if(S.mode!=='ride') return; if(S.clouds.length>=CLOUD.max) return; { let sl=0; while(S.clouds.some(c=>c.sl===sl)) sl++; S.clouds.push({t:0,x:W+200,by:n,st:'follow',sl,off:CLOUD.offs[sl%CLOUD.offs.length]}); } play('don',.4); logAdd((n||'だれか')+' がカミナリ雲を呼んだ（前後に動いてよけろ）','#ff9aa8'); },
  giant(n){ if(S.mode!=='ride') return; if(S.giant){ S.giant.left+=GIANT.n; logAdd((n||'だれか')+' が巨人をもっとあばれさせた（あと'+S.giant.left+'回）','#ff9aa8'); return; } S.giant={t:0,st:'in',left:GIANT.n,by:n,tc:0,hit:false,hitFx:0}; play('don',.6); banner('巨人が出た！','#111',n); logAdd((n||'だれか')+' が巨人を呼んだ（ハンマー'+GIANT.n+'回・ジャンプでよけろ）','#ff9aa8'); },
  punk(n){ if(S.mode!=='ride' || S.rocketT>0) return; S.punkT=Math.min(18,S.punkT+T_.punk); S.assistT=0; play('hit',.5); logAdd((n||'だれか')+' がタイヤをパンクさせた（'+T_.punk+'秒 おそくなる）','#ff9aa8'); },
  setGoal(v){ CFG.goal=v; best=0; newRun(); save(); logAdd('目標を '+fmt(v)+'m にした','#ffd23f'); },
  reset(){ best=0; tries=1; wins=0; falls=0; newRun(); save(); }
};
const inv=()=>S.invT>0 || S.rocketT>0;
function dust(n){ const p=bikePose(); for(let i=0;i<n;i++) S.parts.push({x:BXX()-60+rand(-20,20),y:p.y+WR+rand(-6,4),vx:rand(-260,-60),vy:rand(-160,-20),g:300,t:rand(.3,.6),r:rand(10,22),c:'rgba(214,190,150,.8)'}); }
/* こける：ヘルメットがあれば1回たえる。体力−1。0になったらスタートへもどる */
function crash(what,by){ if(S.mode!=='ride' || inv()) return false; if(S.helmet>0){ S.helmet--; S.invT=1.2; play('guard',.7); S.flash=.2; logAdd('ヘルメットが'+what+'から守った（あと'+S.helmet+'回）','#9be9ff'); return false; }
  const p=bikePose(); S.hp--; S.mode='crash'; S.crashT=0; S.red=.5; S.shake=.6; S.windT=0; S.assistT=0; S.air=false; S.jy=0; S.vy=0; play('hit',.8); play('fall',.5);
  S.rider={x:BXX(),y:p.y-110,vx:rand(260,420),vy:-rand(620,820),rot:0,vr:rand(7,11)}; S.bikeP={x:BXX(),y:p.y,vx:rand(120,220),vy:-rand(260,420),rot:p.ang,vr:-rand(4,7)};
  for(let i=0;i<14;i++) S.parts.push({x:BXX()+rand(-30,30),y:p.y+rand(-40,30),vx:rand(-300,300),vy:rand(-500,-100),g:900,t:rand(.4,.9),r:rand(6,12),c:pick(['#ffd23f','#fff','#ff9aa8'])});
  logAdd(what+'でこけた！（体力−1）','#ff9aa8'); return true; }

/* ===== 進める ===== */
function update(dt){ T+=dt; if(S.cheerT>0) S.cheerIn=Math.min(1,S.cheerIn+dt*2.5); else S.cheerIn=Math.max(0,S.cheerIn-dt*2.5); { const kx=(KEYS.ArrowRight||KEYS.d?1:0)-(KEYS.ArrowLeft||KEYS.a?1:0); if(kx) S.tx=clamp(S.tx+kx*MOVE.key*dt,MOVE.min,MOVE.max); S.ox+=(S.tx-S.ox)*Math.min(1,dt*14); } if(S.flash>0) S.flash-=dt; if(S.shake>0) S.shake-=dt; if(S.red>0) S.red-=dt; if(S.winFx>0) S.winFx-=dt; if(S.fallFx>0) S.fallFx-=dt; if(S.banner){ S.banner.at+=dt; if(S.banner.at>2.2) S.banner=null; } if(S.mileFx){ S.mileFx.t+=dt; if(S.mileFx.t>2) S.mileFx=null; }
  for(const p of S.parts){ p.t-=dt; p.vy+=(p.g||0)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; } S.parts=S.parts.filter(p=>p.t>0);
  if(S.mode==='ride'){
    if(S.holdT>0){ S.holdT-=dt; }
    let mul=1; if(S.rocketT>0){ S.rocketT-=dt; mul=T_.rocketMul; } else { if(S.windT>0){ S.windT-=dt; mul*=T_.windMul; } if(S.assistT>0){ S.assistT-=dt; mul*=T_.assistMul; } if(S.cheerT>0){ S.cheerT-=dt; mul*=CHEER.mul+CHEER.add*(S.cheerN-1); if(S.cheerT<=0){ S.cheerT=0; S.cheerN=0; logAdd('応援団が帰っていった','#fff'); } } if(S.headT>0){ S.headT-=dt; mul*=T_.headMul; } if(S.puddleT>0){ S.puddleT-=dt; mul*=T_.puddleMul; } if(S.punkT>0){ S.punkT-=dt; mul*=T_.punkMul; } mul=Math.max(.35,mul); if(S.hillNeed>0){ S.tapPow=Math.max(0,S.tapPow-HILL.decay*dt); mul*=HILL.base+Math.min(1,S.tapPow)*.9; } }
    S.tilt+=((S.hillNeed>0?HILL.tilt:0)-S.tilt)*Math.min(1,dt*5);
    if(S.invT>0) S.invT-=dt; if(S.bigT>0){ S.bigT-=dt; if(S.bigT<=0){ S.bigT=0; logAdd('タイヤが元の大きさにもどった','#fff'); } } S.bigK+=((S.bigT>0?T_.bigK:1)-S.bigK)*Math.min(1,dt*7);
    const v=(S.holdT>0 || (S.block && S.block.st==='push'))?0:CFG.speed*mul; S.spd=lerp(S.spd,v,clamp(dt*4,0,1)); S.x+=S.spd*dt; S.wheel+=S.spd*PPM*dt/WR; if(S.x>best) best=S.x;
    /* ジャンプ・ロケット中は浮く */
    if(S.rocketT>0){ S.air=true; S.jy=lerp(S.jy,-190+Math.sin(T*6)*14,clamp(dt*5,0,1)); S.vy=0; if(Math.random()<dt*60) S.parts.push({x:BXX()-90,y:bikePose().y+rand(-10,20),vx:rand(-700,-400),vy:rand(-60,60),g:0,t:rand(.25,.5),r:rand(14,30),c:pick(['#ffd23f','#ff8a1f','#fff3b0'])}); }
    else if(S.air){ S.vy+=CFG.grav*dt; S.jy+=S.vy*dt; if(S.jy>=0){ S.jy=0; S.vy=0; S.air=false; dust(6); } }
    const cx=camX()+BXX();
    /* 落とし穴 */
    if(!S.air){ const p=pitAt(cx); if(p && cx>p.x+34 && cx<p.x+p.w-34 && !(S.bigT>0)){ if(inv()){ S.air=true; S.vy=-500; } else if(crash('落とし穴',p.by)){ S.afterPit=p.x+p.w+260; S.pitFall=true; } } }
    S.pits=S.pits.filter(p=>p.x+p.w>camX()-300);
    /* 道の上のもの */
    for(const e of S.ents){ if(e.dead) continue; if(e.k==='rock'){ e.x-=230*dt; e.rot-=dt*5; }
      const dx=e.x-cx, low=S.jy>-58;
      if(e.k==='ramp'){ if(Math.abs(dx-40)<70 && low && !e.used){ e.used=true; S.air=true; S.vy=-1250; S.invT=Math.max(S.invT,1.1); S.x+=0; S.rampGain=T_.rampGain; play('speed',.6); S.flash=.2; banner('大ジャンプ！ ＋'+T_.rampGain+'m','#5dffb0',e.by); } }
      else if(Math.abs(dx)<(e.k==='rock'?96:84) && (e.k==='rock'?(S.jy>-120||S.bigT>0):low) && !e.hit){
        if(e.k==='banana'){ e.hit=true; e.dead=true; if(S.bigT>0){ for(let i=0;i<8;i++) S.parts.push({x:e.x-camX()+rand(-30,30),y:gy0(e.x)-6,vx:rand(-300,300),vy:rand(-400,-100),g:1300,t:rand(.3,.6),r:rand(8,14),c:'#111'}); } else crash('バナナの皮',e.by); }
        else if(e.k==='rock'){ e.hit=true; if(S.rocketT>0 || S.bigT>0){ e.dead=true; S.shake=Math.max(S.shake,.3); play('boom',.5); for(let i=0;i<12;i++) S.parts.push({x:e.x-camX(),y:gy0(e.x)-60,vx:rand(-400,400),vy:rand(-600,-100),g:1200,t:rand(.5,1),r:rand(10,24),c:'#8a8f9a'}); } else crash('岩',e.by); }
        else if(e.k==='puddle'){ e.hit=true; if(!inv()){ S.puddleT=T_.puddle; play('bubble',.6); for(let i=0;i<16;i++) S.parts.push({x:BXX()+rand(-40,60),y:gy0(e.x)-6,vx:rand(-260,260),vy:rand(-520,-160),g:1300,t:rand(.4,.8),r:rand(6,12),c:'#7fd0ff'}); logAdd('水たまりにつっこんだ（'+T_.puddle+'秒 おそくなる）','#ff9aa8'); } } } }
    if(S.rampGain>0){ const d=Math.min(S.rampGain,T_.rampGain*dt/.8); S.rampGain-=d; S.x+=d; }
    S.ents=S.ents.filter(e=>!e.dead && e.x>camX()-300);
    /* 犬：後ろから追いついてきて、かみつく。そのしゅんかんにジャンプしていればよけられる。速いときは追いつけない */
    if(S.dog){ const d=S.dog; d.t+=dt; const fast=S.spd>CFG.speed*1.3; if(d.st==='run'){ d.x=lerp(d.x,fast?-260:BXX()-150,clamp(dt*(fast?1.2:1.6),0,1)); if(fast && d.t>1.5){ d.st='out'; logAdd('犬は追いつけなかった','#5dffb0'); } else if(d.t>=T_.dog){ if(S.jy<-60){ d.st='miss'; d.t=0; logAdd('犬のかみつきをジャンプでよけた！','#5dffb0'); } else { d.st='out'; play('bite',.7); crash('犬',d.by); } } }
      else if(d.st==='miss'){ d.x+=520*dt; if(d.x>W+200) S.dog=null; } else { d.x-=420*dt; if(d.x<-260) S.dog=null; } }
    /* ひと押し */
    if(!S.push && S.pushQ>0){ S.pushQ--; S.push={t:0,hit:false}; }
    if(S.push){ const h=S.push; h.t+=dt; if(!h.hit && h.t>=PUSH.inT){ h.hit=true; S.pushGain+=PUSH.gain; S.shake=Math.max(S.shake,.18); play('speed',.5); dust(6); } if(h.t>=PUSH.inT+PUSH.hold+PUSH.outT) S.push=null; }
    if(S.pushGain>0){ const d=Math.min(S.pushGain,PUSH.gain*dt/.45); S.pushGain-=d; S.x+=d; }
    /* ストップの手：出てくる → 残りの距離がなくなるまで押しもどし続ける → 引っこむ */
    if(S.block){ const h=S.block; h.t+=dt;
      if(h.st==='in'){ if(h.t>=BLOCK.inT){ h.st='push'; h.t=0; S.shake=Math.max(S.shake,.5); play('hit',.6); } }
      else if(h.st==='push'){ const d=Math.min(S.blockLeft,BLOCK.back/BLOCK.per*dt); S.blockLeft-=d; S.x=Math.max(0,S.x-d); S.spd=0; S.wheel-=d*PPM/WR; S.shake=Math.max(S.shake,.28); h.tick-=dt; if(h.tick<=0){ h.tick=.11; play('hit',.28); }
        if(!S.air){ const p=bikePose(); for(let i=0;i<2;i++) S.parts.push({x:BXX()+rand(-90,90),y:p.y+WR*S.bigK+rand(-8,2),vx:rand(260,620),vy:rand(-260,-40),g:900,t:rand(.2,.45),r:rand(8,18),c:'#111'}); }
        if(S.blockLeft<=0 || S.x<=0){ S.blockLeft=0; h.st='out'; h.t=0; } }
      else if(h.t>=BLOCK.outT) S.block=null; }
    /* 鳥 */
    if(S.birdQ>0){ S.birdT-=dt; if(S.birdT<=0){ S.birdT=BIRD.gap; S.birdQ--; S.birds.push({x:W+220,ph:rand(0,6),by:S.birdBy,hit:false}); } }
    for(const b of S.birds){ b.x-=(BIRD.v+S.spd*PPM*.55)*dt; if(!b.hit && Math.abs(b.x-BXX())<BIRD.hit && S.jy<-64 && !(S.rocketT>0)){ b.hit=true; crash('鳥',b.by); } }
    S.birds=S.birds.filter(b=>b.x>-260);
    /* カミナリ雲 */
    for(const c of S.clouds){ c.t+=dt; if(c.st==='follow'){ c.x+=(clamp(BXX()+c.off,90,W-90)-c.x)*Math.min(1,dt*3.2); if(c.t>=CLOUD.follow){ c.st='warn'; c.t=0; } }
      else if(c.st==='warn'){ if(c.t>=CLOUD.warn){ c.st='after'; c.t=0; S.bolts.push({x:c.x,t:0}); S.flash=.35; S.shake=Math.max(S.shake,.5); play('boom',.8); if(Math.abs(c.x-BXX())<CLOUD.hit && !(S.rocketT>0)) crash('カミナリ',c.by); else if(S.mode==='ride') logAdd('カミナリをよけた！','#5dffb0'); } }
      else if(c.t>=CLOUD.after) c.gone=true; }
    S.clouds=S.clouds.filter(c=>!c.gone); for(const b of S.bolts) b.t+=dt; S.bolts=S.bolts.filter(b=>b.t<.35);
    /* 奥から転がってくる岩 */
    for(const r of S.rocks){ r.t+=dt; r.rot-=dt*(3+r.t*3); if(!r.hit && r.t>=ROCK.T){ r.hit=true; S.shake=Math.max(S.shake,.5); play('don',.8); play('boom',.5); for(let i=0;i<10;i++) S.parts.push({x:r.tx+rand(-70,70),y:gy0(camX()+r.tx)-rand(0,20),vx:rand(-380,380),vy:rand(-520,-140),g:1400,t:rand(.3,.7),r:rand(10,20),c:'#111'});
        if(Math.abs(r.tx-BXX())<ROCK.hit && !(S.rocketT>0)){ if(S.bigT>0){ r.smash=true; logAdd('でかタイヤが岩をくだいた','#5dffb0'); } else crash('岩',r.by); } else if(S.mode==='ride') logAdd('岩をよけた！','#5dffb0'); } }
    S.rocks=S.rocks.filter(r=>r.t<ROCK.T+ROCK.out && !r.smash);
    /* 巨人と振動 */
    if(S.giant){ const d=S.giant; d.t+=dt; if(d.hitFx>0) d.hitFx-=dt; const cyc=GIANT.nf/GIANT.fps, gw=GIANT.h*GIANT.fw/GIANT.fh, hx=GIANT.x+GIANT.hx*gw;
      if(d.st==='in'){ if(d.t>=GIANT.inT){ d.st='act'; d.tc=0; d.hit=false; } }
      else if(d.st==='act'){ d.tc+=dt*GIANT.rate; if(!d.hit && d.tc*GIANT.fps>=GIANT.hitF){ d.hit=true; d.left--; d.hitFx=.5; S.shake=Math.max(S.shake,.7); play('boom',.7); play('don',.7); S.waves.push({x:hx-60,by:d.by,hit:false,dir:-1},{x:hx+60,by:d.by,hit:false,dir:1}); S.bursts.push({x:hx,t:0}); }   /* 振動は左右の両方へ走る（巨人の前に出ても逃げられない） */
        if(d.tc>=cyc){ if(d.left>0){ d.tc=0; d.hit=false; } else { d.st='out'; d.t=0; } } }
      else if(d.st==='out'){ if(d.t>=GIANT.outT) S.giant=null; } }
    for(const b of S.bursts) b.t+=dt; S.bursts=S.bursts.filter(b=>b.t<.55);
    for(const w of S.waves){ const x0=w.x; w.x+=w.dir*GIANT.waveV*dt; const bx=BXX(), cross=(x0-bx)*(w.x-bx)<=0 || Math.abs(w.x-bx)<46; if(!w.hit && !w.ok && cross){ if(S.bigT>0){ w.ok=true; } else if(S.jy>-46){ w.hit=true; crash('巨人の振動',w.by); } else { w.ok=true; if(S.mode==='ride') logAdd('振動をジャンプでよけた！','#5dffb0'); } } }
    S.waves=S.waves.filter(w=>w.x>-300 && w.x<W+300);
    /* 100mごとの立て札 */
    { const idx=Math.floor(S.x/1000); if(idx>S.mileI){ S.mileI=idx; if(S.x<CFG.goal) S.mileFx={t:0,text:fmt(idx*1000)+'m 突破！',sub:'ゴールまで あと '+fmt(CFG.goal-idx*1000)+'m'}; } }
    if(S.x>=CFG.goal){ S.x=CFG.goal; S.mode='clear'; S.clearT=0; wins++; best=CFG.goal; save(); play('fanfare',.8); S.flash=.6; banner('ゴール！','#ffd23f',fmt(CFG.goal)+'m　'+tries+'回目で成功'); logAdd(fmt(CFG.goal)+'m 走りきった！ おつかれさま','#ffd23f'); S.winFx=0; }
  }
  else if(S.mode==='crash'){ S.crashT+=dt; S.spd=lerp(S.spd,0,clamp(dt*6,0,1)); const gyb=gy0(camX()+BXX())-10;
    for(const o of [S.rider,S.bikeP]){ o.vy+=2200*dt; o.x+=o.vx*dt; o.y+=o.vy*dt; o.rot+=o.vr*dt; const fl=S.pitFall?H+300:gyb-(o===S.rider?60:WR); if(o.y>fl){ o.y=fl; o.vy*=-.42; o.vx*=.6; o.vr*=.5; if(Math.abs(o.vy)<90){ o.vy=0; o.vr*=.3; } } }
    if(S.crashT>=T_.crash){ S.pitFall=false; if(S.afterPit){ S.x=Math.max(S.x,(S.afterPit-BXX())/PPM); S.afterPit=0; }
      if(S.hp<=0){ S.mode='back'; S.backT=0; S.backFrom=S.x; tries++; falls++; const lost=falls>=FALLS_PER; if(lost){ falls=0; wins--; S.winFx=2.2; } S.fallFx=1.2; save(); play('bad',.7); banner('スタートにもどる…','#ff5c5c',lost?FALLS_PER+'回もどされた（WIN −1）':''); logAdd('体力が0になった。スタートからやり直し（'+tries+'回目）','#ff5c5c'); }
      else { S.mode='ride'; S.invT=T_.inv; S.holdT=.25; S.rider=null; S.bikeP=null; } } }
  else if(S.mode==='back'){ S.backT+=dt; const u=clamp(S.backT/T_.back,0,1), e=u*u*(3-2*u); S.x=lerp(S.backFrom,0,e); S.wheel-=dt*40; if(u>=1){ const wf=S.winFx, ff=S.fallFx; newRun(); S.winFx=wf; S.fallFx=ff; S.invT=1.5; } }
  else if(S.mode==='clear'){ S.clearT+=dt; if(Math.random()<dt*40) S.parts.push({x:rand(0,W),y:150,vx:rand(-80,80),vy:rand(100,400),g:300,t:rand(1,2),r:rand(8,14),c:pick(['#ffd400','#fff','#4cc3ff','#ff5c8a','#5dffb0'])}); if(S.clearT>4){ tries=1; best=0; newRun(); save(); logAdd(fmt(CFG.goal)+'m まで走るまで終われません！','#ffd23f'); } }
}

/* ===== 描く：白い紙に黒い線。妨害だけは色つきの絵（img/ に絵があればそれを使い、無ければ線で描く） ===== */
const IMG={}; for(const k of ['banana','puddle','rock','dog0','dog1','giant','wave','burst','bird0','bird1','cloud','rockroll','fan0','fan1','fan2','fan3','hand','zlines','impact']){ const im=new Image(); im.src='./img/'+k+'.webp'; IMG[k]=im; } const ok=k=>IMG[k] && IMG[k].complete && IMG[k].naturalWidth>0;
const INK='#111', LW=7;
function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function txt(s,x,y,size,color,align,stroke,font){ g.font=(font===FONTD?'400 ':'900 ')+size+'px '+(font||FONT); g.textAlign=align||'left'; g.textBaseline='middle'; if(stroke){ g.lineWidth=Math.max(4,size*.16); g.strokeStyle=stroke; g.lineJoin='round'; g.strokeText(s,x,y); } g.fillStyle=color; g.fillText(s,x,y); }
function line(pts,w,c){ g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]); g.lineWidth=w||LW; g.strokeStyle=c||INK; g.lineCap='round'; g.lineJoin='round'; g.stroke(); }
function ring(x,y,r,w,fill){ g.beginPath(); g.arc(x,y,r,0,7); if(fill){ g.fillStyle=fill; g.fill(); } g.lineWidth=w||LW; g.strokeStyle=INK; g.stroke(); }
function drawGround(cx){
  /* 地面は1本の線。落とし穴のところは線が切れて、下へ落ちる線を引く */
  let cur=null; const segs=[]; for(let x=-20;x<=W+20;x+=10){ const wx=x+cx; if(pitAt(wx)){ if(cur){ segs.push(cur); cur=null; } } else { if(!cur) cur=[]; cur.push([x,gy0(wx)]); } } if(cur) segs.push(cur);
  for(const s of segs){ g.beginPath(); g.moveTo(s[0][0],H); for(const q of s) g.lineTo(q[0],q[1]); g.lineTo(s[s.length-1][0],H); g.closePath(); g.fillStyle='#fff'; g.fill(); }   /* 道より下は白くぬる（道の向こう側にいる巨人の足もとをかくす） */
  for(const s of segs) line(s,LW);
  for(const p of S.pits){ const x0=p.x-cx, x1=x0+p.w; if(x0>W+40||x1<-40) continue; line([[x0,gy0(p.x)],[x0+14,gy0(p.x)+150]],LW); line([[x1,gy0(p.x+p.w)],[x1-14,gy0(p.x+p.w)+150]],LW); }
  /* 流れて見えるように、地面に短いしるしを打つ */
  for(let wx=Math.floor(cx/90)*90;wx<cx+W+90;wx+=90){ if(pitAt(wx)) continue; const x=wx-cx, y=gy0(wx); line([[x,y+16],[x-26,y+44]],4); }
  /* 100mごとの立て札と、ゴールの旗 */
  for(let m=Math.ceil((cx/PPM)/100)*100;m<(cx+W)/PPM+5;m+=100){ if(m<=0||m>=CFG.goal) continue; const x=m*PPM-cx, y=gy0(m*PPM); line([[x,y],[x,y-150]],5); txt(fmt(m)+'m',x,y-176,30,INK,'center'); }
  { const x=CFG.goal*PPM-cx; if(x<W+200){ const y=gy0(CFG.goal*PPM); line([[x,y],[x,y-330]],LW); for(let r=0;r<4;r++) for(let c=0;c<5;c++){ if((r+c)%2){ g.fillStyle=INK; g.fillRect(x+4+c*30,y-330+r*30,30,30); } } g.lineWidth=5; g.strokeStyle=INK; g.strokeRect(x+4,y-330,150,120); txt('ゴール',x+80,y-366,44,INK,'center',null,FONTD); } }
}
function drawEnts(cx){ for(const e of S.ents){ const x=e.x-cx, y=gy0(e.x);
    if(ok(e.k) && e.k!=='ramp'){ const im=IMG[e.k]; if(e.k==='rock'){ g.save(); g.translate(x,y-78); g.rotate(e.rot); g.drawImage(im,-82,-82,164,164); g.restore(); } else if(e.k==='puddle'){ const w=230, h=w*im.naturalHeight/im.naturalWidth; g.drawImage(im,x-w/2,y-h*.45,w,h); } else { const w=170, h=w*im.naturalHeight/im.naturalWidth; g.drawImage(im,x-w/2,y-h+8,w,h); } }
    else if(e.k==='banana'){ g.save(); g.translate(x,y-8); line([[-44,0],[-16,-12],[0,-44],[16,-12],[44,0]],LW); line([[-16,-12],[0,-4],[16,-12]],5); line([[0,-44],[0,-58]],LW); g.restore(); }
    else if(e.k==='puddle'){ { const y0=gy0(e.x-90), y1=gy0(e.x+90); g.fillStyle='#fff'; g.fillRect(x-86,Math.min(y0,y1)-6,172,14); line([[x-90,y0],[x-74,y0+20],[x+74,y1+20],[x+90,y1]],LW); line([[x-52,y0+8],[x-22,y0+8]],4); line([[x-4,y1+8],[x+50,y1+8]],4); line([[x-30,y0-2],[x+12,y0-2]],4); } }
    else if(e.k==='rock'){ g.save(); g.translate(x,y-70); g.rotate(e.rot); g.beginPath(); for(let i=0;i<9;i++){ const a=i/9*6.283, r=70+((i*37)%17)-8; g.lineTo(Math.cos(a)*r,Math.sin(a)*r); } g.closePath(); g.fillStyle='#fff'; g.fill(); g.lineWidth=LW; g.strokeStyle=INK; g.lineJoin='round'; g.stroke(); line([[-30,-20],[0,4],[26,-10]],5); line([[-10,30],[14,22]],5); g.restore(); }

  if(ok('dog0') && ok('dog1')){ const im=IMG['dog'+(Math.floor(T*9)%2)], k=.47, w=im.naturalWidth*k, h=im.naturalHeight*k, hop=Math.abs(Math.sin(T*9*Math.PI))*10; g.drawImage(im,-w*.5,-h-hop+8,w,h); if(d.st==='run' && d.t>T_.dog-.7) txt('ガウ！',40,-h-34,38,'#e23a3a','center','#fff'); g.restore(); return; }
  line([[-50,-52],[40,-56]]); line([[-46,-50],[-52+run*22,0]],6); line([[-34,-50],[-22-run*22,0]],6); line([[26,-54],[18+run*22,0]],6); line([[36,-54],[48-run*22,0]],6); line([[-50,-52],[-78,-84+run*8]],6);
  line([[40,-56],[52,-92],[84,-92],[112,-74],[84,-62],[40,-56]],LW); line([[52,-92],[46,-116],[66,-92]],6);
  if(d.st==='run' && d.t>T_.dog-.7) txt('ガウ！',40,-140,36,INK,'center'); g.restore(); }
function draw(){ const cx=camX(); g.fillStyle='#fff'; g.fillRect(0,0,W,H); g.save(); if(S.shake>0) g.translate(rand(-1,1)*S.shake*16,rand(-1,1)*S.shake*16);
  if(S.tilt>.002){ g.translate(BXX(),gy0(cx+BXX())); g.rotate(-S.tilt); g.translate(-BXX(),-gy0(cx+BXX())); }   /* 坂道：画面ごとかたむける */
  drawFar(cx); drawFans(cx); drawGiant(cx); drawRocks(cx,false); drawGround(cx); drawWaves(cx); drawRocks(cx,true); drawEnts(cx); drawSpeed(); drawWarn(cx);
  /* 風のすじ */
  if(S.windT>0 || S.headT>0 || S.rocketT>0){ const back=S.headT>0 && !(S.rocketT>0); for(let i=0;i<10;i++){ const sp=back?900:-1500, x=(((i*197+T*sp)%1300)+1300)%1300-110, y=330+i*38, L=back?90:150; line([[x,y],[x+L,y]],4); } }
  if(S.dog) drawDog(S.dog); drawSky(cx); drawPush(); drawBlock();
  if(S.mode==='crash'){ const b=S.bikeP; g.save(); g.translate(b.x,b.y); g.rotate(b.rot); drawBikeOnly(S.wheel,false); g.restore(); drawStickFly(S.rider); }
  else { const p=bikePose(), blink=S.invT>0 && S.rocketT<=0 && Math.floor(T*14)%2===0; if(!blink){ g.save(); g.translate(BXX()+((S.block&&S.block.st==='push')?Math.sin(T*70)*7-14:0),p.y+WR*S.bigK); g.rotate(((S.block&&S.block.st==='push')?-.1+Math.sin(T*50)*.03:0)+p.ang+(S.air?clamp(S.vy/3000,-.3,.3):0)+(S.punkT>0?Math.sin(T*18)*.03:0)); g.translate(0,-WR*S.bigK);
      if(S.rocketT>0){ rr(-124,-72,100,36,16); g.fillStyle='#fff'; g.fill(); g.lineWidth=LW; g.strokeStyle=INK; g.stroke(); const fl=70+Math.sin(T*40)*20; line([[-124,-66],[-124-fl,-54],[-124,-42]],6); line([[-124,-60],[-124-fl*.5,-54],[-124,-48]],4); }
      drawBikeOnly(S.wheel,S.punkT>0); drawRider(S.wheel,S.headT>0?-.6:(S.spd>CFG.speed*1.3?1:.45),!!S.dog||S.air); g.restore(); } }
  for(const p of S.parts){ g.globalAlpha=clamp(p.t*3,0,1); g.beginPath(); g.arc(p.x,p.y,p.r*.5,0,7); g.lineWidth=3; g.strokeStyle=INK; g.stroke(); } g.globalAlpha=1;
  g.restore();
  if(S.red>0){ g.fillStyle='rgba(0,0,0,'+(S.red*.25)+')'; g.fillRect(0,0,W,H); }
  drawHud(); }
function heart(x,y,sc,on){ g.save(); g.translate(x,y); g.scale(sc,sc); g.beginPath(); g.moveTo(0,20); g.bezierCurveTo(-34,-4,-22,-30,0,-12); g.bezierCurveTo(22,-30,34,-4,0,20); g.closePath(); g.fillStyle=on?INK:'#fff'; g.fill(); g.lineWidth=5; g.strokeStyle=INK; g.lineJoin='round'; g.stroke(); g.restore(); }
function drawHud(){
  txt(fmt(CFG.goal)+'m まで走るまで終われません',W/2,44,30,INK,'center');
  { const ds=fmt(S.x), sz=ds.length>=6?70:ds.length>=5?80:92; g.font='400 '+sz+'px '+FONTD; const tw=g.measureText(ds).width, x0=W/2-(tw+56)/2; txt(ds,x0+tw,112,sz,INK,'right',null,FONTD); txt('m',x0+tw+12,124,44,INK,'left',null,FONTD); }
  txt('挑戦 '+tries+'回目',40,96,28,INK); txt('最高 '+fmt(best)+'m',40,136,24,INK);
  line([[0,172],[W,172]],4);
  for(let i=0;i<CFG.hp;i++) heart(56+i*52,216,.9,i<S.hp);
  /* 効果の札 */
  { const tags=[]; if(S.rocketT>0) tags.push('ロケット あと'+Math.ceil(S.rocketT)+'秒'); if(S.cheerT>0) tags.push('応援団 あと'+Math.ceil(S.cheerT)+'秒'); if(S.assistT>0) tags.push('アシスト あと'+Math.ceil(S.assistT)+'秒'); if(S.bigT>0) tags.push('でかタイヤ あと'+Math.ceil(S.bigT)+'秒'); if(S.helmet>0) tags.push('ヘルメット ×'+S.helmet); if(S.headT>0) tags.push('向かい風 あと'+Math.ceil(S.headT)+'秒'); if(S.puddleT>0) tags.push('びしょぬれ あと'+Math.ceil(S.puddleT)+'秒'); if(S.punkT>0) tags.push('パンク あと'+Math.ceil(S.punkT)+'秒');
    let y=276; for(const t of tags){ g.font='900 24px '+FONT; const tw=g.measureText(t).width+36; rr(34,y-20,tw,40,20); g.fillStyle='#fff'; g.fill(); g.lineWidth=3; g.strokeStyle=INK; g.stroke(); txt(t,34+tw/2,y+1,24,INK,'center'); y+=48; } }
  /* WIN */
  { const bx=W-224, by=8, bw=120, bh=156, cx0=bx+bw/2; txt('WIN',cx0,by+26,26,INK,'center'); txt(''+(wins<0?'−'+(-wins):wins),cx0,by+80,70,INK,'center',null,FONTD); if(S.winFx>0){ g.globalAlpha=clamp(S.winFx,0,1); txt('−1',bx-10,by+80-(2.2-S.winFx)*18,44,INK,'right'); g.globalAlpha=1; }
    for(let i=0;i<FALLS_PER;i++) ring(cx0+(i-(FALLS_PER-1)/2)*24,by+136,8,3,i<falls?INK:'#fff'); }
  /* 下：道のりの物差しと、できごとの記録 */
  g.fillStyle='#fff'; g.fillRect(0,930,W,150); line([[0,930],[W,930]],4); const pr=clamp(S.x/CFG.goal,0,1); line([[60,962],[W-120,962]],4); line([[60,950],[60,974]],4); line([[W-120,950],[W-120,974]],4); { const bx=60+(W-180)*clamp(best/CFG.goal,0,1); line([[bx,952],[bx,972]],3); } ring(60+(W-180)*pr,962,12,5,INK);
  txt(Math.floor(pr*100)+'%',W-62,962,24,INK,'center');
  { let y=1008; for(const l of S.log.slice(-2)){ txt(l.t,40,y,27,INK,'left'); y+=38; } }
  if(S.mileFx){ const m=S.mileFx, a=clamp(m.t/.25,0,1)*clamp((2-m.t)/.4,0,1); g.globalAlpha=a; txt(m.text,W/2,400,64,INK,'center','#fff',FONTD); txt(m.sub,W/2,462,30,INK,'center','#fff'); g.globalAlpha=1; }
  if(S.banner){ const b=S.banner, a=clamp(b.at/.2,0,1)*clamp((2.2-b.at)/.4,0,1); g.globalAlpha=a; txt(b.t,W/2,520,76,INK,'center','#fff',FONTD); if(b.sub) txt(b.sub,W/2,592,32,INK,'center','#fff'); g.globalAlpha=1; }
  if(S.mode==='ride' && S.x<40 && tries===1) txt('タップでジャンプ！　押したまま左右で前後に動く',W/2,880,32,INK,'center','#fff');
}

/* ===== 操作：タップ・スペースでジャンプ ===== */
/* 押した瞬間にジャンプ。押したまま左右に動かすと、動かした分だけ自転車が前後に動く。キーは ←→ で前後、スペース・↑ でジャンプ */
const KEYS={}; let drag=null;
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); Game.jump(); drag={x:e.clientX,tx:S.tx}; try{ cv.setPointerCapture(e.pointerId); }catch(err){} });
cv.addEventListener('pointermove',e=>{ if(!drag) return; const r=cv.getBoundingClientRect(), k=W/r.width*1.25; S.tx=clamp(drag.tx+(e.clientX-drag.x)*k,MOVE.min,MOVE.max); e.preventDefault(); });
for(const ev of ['pointerup','pointercancel']) cv.addEventListener(ev,()=>{ drag=null; });
window.addEventListener('keydown',e=>{ KEYS[e.key]=true; if(e.code==='Space' || e.code==='ArrowUp'){ e.preventDefault(); Game.jump(); } if(e.key.indexOf('Arrow')===0) e.preventDefault(); });
window.addEventListener('keyup',e=>{ KEYS[e.key]=false; });
const tp=document.getElementById('tp'); document.getElementById('testBtn').addEventListener('click',()=>{ tp.hidden=!tp.hidden; });
tp.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b) return; const a=b.dataset.a; if(a==='close'){ tp.hidden=true; return; } if(a==='reset'){ Game.reset(); tp.hidden=true; return; } if(a[0]==='g' && /^g\d+$/.test(a)){ Game.setGoal(+a.slice(1)); tp.hidden=true; return; } if(Game[a]){ Game[a]('テスト'); tp.hidden=true; } });

newRun(); logAdd(fmt(CFG.goal)+'m まで走るまで終われません！','#ffd23f');
let last=performance.now(); window.__ready=false; window.__dbg={ get S(){ return S; }, Game, CFG, T_, update, draw, get wins(){ return wins; }, get falls(){ return falls; }, get tries(){ return tries; } };
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(!window.__frozen){ update(dt); draw(); } requestAnimationFrame(loop); }
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(()=>{ window.__ready=true; requestAnimationFrame(loop); });
</script>
