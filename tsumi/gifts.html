<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>つみつみアニマル ギフト表</title>
<style>
@font-face{font-family:'MPR';src:url('./font/mpr.woff2') format('woff2');font-weight:100 900;font-display:swap}
html,body{margin:0;background:#000;color:#fff;font-family:'MPR','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif}
#grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:.55vw;padding:.6vw;box-sizing:border-box;width:100%}
.c{border:.32vw solid #e0262e;border-radius:1.3vw;background:linear-gradient(#17171d,#08080b);padding:.5vw .3vw .45vw;display:flex;flex-direction:column;align-items:center;min-width:0;box-shadow:0 0 1vw rgba(224,38,46,.35) inset}
.c.help{border-color:#2fbf4f;box-shadow:0 0 1vw rgba(47,191,79,.35) inset}
.c.free{border-color:#58b8ff;box-shadow:0 0 1vw rgba(88,184,255,.35) inset}
.g svg{width:86%;height:86%}
.c.both{border-color:#ffcc33;box-shadow:0 0 1vw rgba(255,204,51,.35) inset}
.pair{display:flex;align-items:center;justify-content:center;gap:.2vw;width:100%}
.pair>div{flex:1 1 50%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative}
.pair img{width:100%;height:100%;object-fit:contain}
.g .t{font-weight:900;font-size:calc(11.5vw / var(--cols));line-height:1.15;text-align:center;overflow-wrap:anywhere;color:#ffe680}
.g .q{font-weight:900;font-size:calc(34vw / var(--cols));color:#555}
.g .coin{position:absolute;right:0;bottom:0;font-weight:900;font-size:calc(10.5vw / var(--cols));background:rgba(0,0,0,.78);border-radius:.6vw;padding:0 .35vw;color:#ffd23f}
.nm{font-weight:900;font-size:calc(13.5vw / var(--cols));line-height:1.15;text-align:center;margin-top:.25vw;text-shadow:0 .15vw 0 #000;white-space:nowrap;overflow:hidden;max-width:100%}
.g .sp{width:92%;height:92%;border-radius:12%;background-image:url('./img/giftcat.jpg');background-repeat:no-repeat}
.g.txt{flex-direction:column;gap:.15vw}.g.txt .coin{position:static}
</style>
</head>
<body>
<div id="grid"></div>
<script>
/* つみつみアニマルのギフト表。ゲームの「ギフト」画面で登録した割り当てをそのまま表示する。
   URLの後ろに ?cols=9（1段の数）や ?all=1（未登録の効果も出す）を付けられる */
const FX=[['ant','jam','アリ'],['wind','jam','突風'],['ink','jam','イカスミ'],['quake','jam','地震'],['crow','jam','カラス'],['giant','jam','10秒 巨大化'],['slot','jam','動物スロット'],['biggacha','jam','巨大ガチャ'],['mangacha','jam','タイツガチャ'],['usagi','jam','早送り'],['eel','jam','タコ解除'],
 ['necro','jam','見えない'],['witch','jam','ゴール+3m'],['wrm','jam','−ルーレット'],['coin','jam','−60 か −200'],['dragon','jam','全消し'],['robot','jam','全リセット'],['cerberus','jam','WIN −100'],['reaper','jam','WIN −1000'],
 ['fairy','help','10秒 ちび化'],['sun','help','突風を消す'],['kame','help','スロー'],['tako','help','ずっと吸着'],['rewind','help','負け取消'],['golem','help','落ちない壁'],['angel','help','ゴール−2m'],['wrp','help','＋ルーレット'],['wingacha','help','＋50 か ＋100'],['tree','help','台が広がる'],
 ['statue','help','＋5 と 5回ガード'],['pegasus','help','WIN ＋100'],['phoenix','help','WIN ＋1000'],['double','both','5分間 2倍']];
const q=new URLSearchParams(location.search), cols=Math.max(3,Math.min(13,parseInt(q.get('cols'),10)||9)), showAll=q.get('all')==='1';
document.documentElement.style.setProperty('--cols',cols);
let last='', CATN=0, CATL=null; const nrm=t=>String(t||'').trim().toLowerCase().replace(/\s+/g,'').replace(/！/g,'!').replace(/？/g,'?').replace(/[〜～]/g,'~').replace(/[．。]/g,'.'); fetch('./gifts_cat.json').then(r=>r.json()).then(j=>{ CATL=j; CATN=j.length; last=''; build(); }).catch(()=>{});
/* 割り当ての読みこみ元：①同じブラウザでゲームを開いていればその設定（変えると自動で反映）②なければURLの # 以降に書かれた設定 */
function fromHash(){ const h=new URLSearchParams(location.hash.replace(/^#/,'')), g=h.get('g'), o=h.get('o'), m={}; if(g) for(const part of g.split(',')){ const a=part.split('.'); if(a.length<2) continue; const e={id:null,name:'',coins:a[2]!=null&&a[2]!==''?Number(a[2]):null,ci:null}; if(a[1][0]==='n'){ try{ e.name=decodeURIComponent(a[1].slice(1)); }catch(_){ e.name=a[1].slice(1); } } else { e.ci=parseInt(a[1],10); e.name=(CATL&&CATL[e.ci])?CATL[e.ci][0]:'#'+e.ci; } m[a[0]]=e; }
  const lb={}, l=h.get('l'); if(l) for(const part of l.split(',')){ const p=part.indexOf('.'); if(p<1) continue; try{ lb[part.slice(0,p)]=decodeURIComponent(part.slice(p+1)); }catch(_){} } return {m, lb, op:o?{followOn:o[0]==='1',likeOn:o[1]==='1'}:null}; }
function load(){ let m={}, src='local'; try{ m=JSON.parse(localStorage.getItem('tsumi_gifts')||'{}')||{}; }catch(e){} if(!Object.keys(m).some(k=>m[k]&&m[k].name)){ m=fromHash().m; src='hash'; } if(window.__sample) m=window.__sample; SRC=src; return m; }
let SRC='local';
function build(){ const m=load(); if(CATL) for(const k in m){ const b=m[k]; if(b && b.name && b.ci==null){ const i=CATL.findIndex(e=>nrm(e[0])===nrm(b.name)); if(i>=0){ b.ci=i; if(b.coins==null) b.coins=CATL[i][1]; } } } let LB={}; if(SRC==='hash') LB=fromHash().lb; else { try{ LB=JSON.parse(localStorage.getItem('tsumi_lbl')||'{}')||{}; }catch(e){} } const key=JSON.stringify(m)+JSON.stringify(LB)+CATN+(localStorage.getItem('tsumi_opts')||'')+location.hash; if(key===last) return; last=key; const g=document.getElementById('grid'); g.innerHTML=''; const any=FX.some(f=>m[f[0]]&&m[f[0]].name);
  let op={likeOn:true,followOn:true}; if(SRC==='hash'){ const ho=fromHash().op; if(ho) op=ho; } else { try{ Object.assign(op,JSON.parse(localStorage.getItem('tsumi_opts')||'{}')); }catch(e){} }
  const free=(svg,label)=>{ const c=document.createElement('div'); c.className='c free'; const pair=document.createElement('div'); pair.className='pair'; const gd=document.createElement('div'); gd.className='g'; gd.innerHTML=svg; const fx=document.createElement('div'); const fi=document.createElement('img'); fi.src='./img/fx/slot.png'; fx.appendChild(fi); pair.appendChild(gd); pair.appendChild(fx); const nm=document.createElement('div'); nm.className='nm'; nm.textContent=label; c.appendChild(pair); c.appendChild(nm); g.appendChild(c); };
  if(op.followOn) free('<svg viewBox="0 0 100 100"><circle cx="40" cy="30" r="20" fill="#3ddc6a"/><path d="M6 92c0-24 15-38 34-38s34 14 34 38z" fill="#3ddc6a"/><path d="M78 40v34M61 57h34" stroke="#3ddc6a" stroke-width="11" stroke-linecap="round"/></svg>','ランダム動物');
  if(op.likeOn) free('<svg viewBox="0 0 100 100"><path d="M50 90C20 68 6 52 6 33 6 18 17 8 30 8c8 0 15 4 20 11 5-7 12-11 20-11 13 0 24 10 24 25 0 19-14 35-44 57z" fill="#ff3b5c"/><text x="50" y="57" text-anchor="middle" font-size="27" font-weight="900" fill="#fff" font-family="MPR,sans-serif">1000</text></svg>','ランダム動物');
  for(const f of FX){ const b=m[f[0]]; if(!showAll && any && !(b&&b.name)) continue; const c=document.createElement('div'); c.className='c '+f[1];
    const pair=document.createElement('div'); pair.className='pair'; const gd=document.createElement('div'); gd.className='g';
    if(b&&b.ci!=null){ const d2=document.createElement('div'); d2.className='sp'; const rows=CATN?Math.ceil(CATN/24):20; d2.style.backgroundSize='2400% '+(rows*100)+'%'; d2.style.backgroundPosition=((b.ci%24)/23*100)+'% '+(rows>1?(Math.floor(b.ci/24)/(rows-1)*100):0)+'%'; gd.appendChild(d2); }
    else if(b&&b.pic){ const im=document.createElement('img'); im.src=b.pic; im.alt=b.name||''; im.referrerPolicy='no-referrer'; im.onerror=()=>{ gd.innerHTML=''; gd.classList.add('txt'); const t=document.createElement('div'); t.className='t'; t.textContent=b.name||'？'; gd.appendChild(t); }; gd.appendChild(im); }
    else if(b&&b.name){ gd.classList.add('txt'); const t=document.createElement('div'); t.className='t'; t.textContent=b.name; gd.appendChild(t); }
    else { const t=document.createElement('div'); t.className='q'; t.textContent='？'; gd.appendChild(t); }
    if(b&&b.coins!=null){ const cn=document.createElement('div'); cn.className='coin'; cn.textContent=b.coins; gd.appendChild(cn); }
    const fx=document.createElement('div'); const fi=document.createElement('img'); fi.src='./img/fx/'+f[0]+'.png'; fi.alt=f[2]; fx.appendChild(fi);
    pair.appendChild(gd); pair.appendChild(fx); const nm=document.createElement('div'); nm.className='nm'; { const lab=LB[f[0]]||f[2]; nm.textContent=lab; if(LB[f[0]] && lab.length>8) nm.style.fontSize='calc('+(13.5*8/lab.length).toFixed(2)+'vw / var(--cols))'; } c.appendChild(pair); c.appendChild(nm); g.appendChild(c); } }
build(); window.addEventListener('storage',build); window.addEventListener('hashchange',build); setInterval(build,2000);
</script>
</body>
</html>
