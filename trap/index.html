<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>ワナだらけ（試作）</title>
<style>
@font-face{font-family:MPR;src:url(./font/mpr.woff2) format('woff2');font-weight:900;font-display:swap}
@font-face{font-family:DELA;src:url(./font/dela.woff2) format('woff2');font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#10162b;overflow:hidden;font-family:MPR,'Hiragino Sans','Noto Sans JP',sans-serif;font-weight:900;touch-action:none}
#stage{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:10px;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#testBtn{position:absolute;right:.7em;top:.6em;font:inherit;font-size:1.75em;background:#fff;color:#111;border:.12em solid #111;border-radius:2em;padding:.2em .7em;z-index:5}
#tp{position:absolute;right:1em;top:5em;width:60em;max-height:84%;overflow:auto;background:rgba(255,255,255,.97);border:.3em solid #111;border-radius:1.6em;padding:1em 1.4em 1.6em;z-index:6;touch-action:pan-y}
#tp h3{margin:.7em 0 .3em;font-size:2em;color:#111}
#tp button{font:inherit;font-size:1.7em;line-height:1.25;color:#fff;border:0;border-radius:.6em;padding:.5em .4em;margin:.2em;width:9.6em;vertical-align:top}
#tp .j{background:#c0392b}#tp .h{background:#1f9a55}#tp .n{background:#444}
/* 操作ボタン：画面の下の帯に置く（左に ← →、右にジャンプ）。2本の指で同時に押せる */
#pads{position:fixed;z-index:4;touch-action:none}
.pad{position:absolute;top:0;height:100%;border-radius:1.6em;border:.4em solid #fff;background:rgba(255,255,255,.14);color:#fff;font-family:DELA,MPR,sans-serif;font-weight:400;display:flex;align-items:center;justify-content:center;touch-action:none}
.pad.on{background:#ffd23f;color:#111;border-color:#ffd23f}
#bL{left:2%;width:19%;font-size:6em}#bR{left:23%;width:19%;font-size:6em}#bJ{right:2%;width:34%;font-size:4.6em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1080" height="1080"></canvas>
  <button id="testBtn" type="button">テスト</button>
  <div id="tp" hidden>
    <h3>お助け</h3>
    <button class="h" data-a="check">中間ポイント<br>今いる場所から再開</button><!-- バリアのギフトは外した（プレゼント箱のおにぎりと同じ効果なので。Game.barrier は残してある） --><button class="h" data-a="bridge">足場<br>この先の穴をふさぐ</button><button class="h" data-a="sweep">おそうじ<br>画面の罠を全部消す</button><button class="h" data-a="present">プレゼント箱<br>たたくと おにぎり</button><button class="h" data-a="skip">1面スキップ<br>今のステージをとばす</button>
    <h3>妨害（ギフト用はこの4つ）</h3>
    <button class="j" data-a="jam1">妨害 小<br>ランダムで1個</button><button class="j" data-a="jam5">妨害 中<br>ランダムで5個</button><button class="j" data-a="jam10">妨害 大<br>ランダムで10個</button><button class="j" data-a="back">1ステージ戻る<br>前のステージの最初から</button>
    <h3>妨害を1つずつためす（テスト用）</h3>
    <button class="j" data-a="flee">逃げるゴール<br>近づくと先へ逃げる</button><button class="j" data-a="hole">動く穴<br>8秒 追ってくる</button><button class="j" data-a="cloud">落ちてくる雲<br>頭の上から</button><button class="j" data-a="fakespring">ニセのバネ<br>空のかなたへ</button><button class="j" data-a="fakebox">ニセの箱<br>たたくと ばくだん</button><button class="j" data-a="spike">トゲ<br>目の前に飛び出す</button><button class="j" data-a="crumble">床ぬけ<br>足元がくずれる</button><button class="j" data-a="drop">落石<br>頭の上から</button><button class="j" data-a="ghost">見えないブロック<br>頭の上に12秒</button><button class="j" data-a="bullet">矢<br>右から飛んでくる</button><button class="j" data-a="wall">せまるトゲ壁<br>6秒 左から追ってくる</button><!-- あべこべは外した（Game.reverse は残してある） --><button class="j" data-a="wallf">前からトゲ壁<br>5秒 前からせまる（うしろへ逃げろ）</button><button class="j" data-a="fake">ニセのゴール<br>さわるとやられる</button><button class="j" data-a="flip">さかさま<br>6秒 上下がひっくり返る</button><!-- つるつる床・向かい風・おもりは不採用（Game.ice / wind / heavy は残してある。戻すときはここにボタンを足す） --><button class="j" data-a="mob">ぷにスライム<br>歩いてくる（踏むと倒せる）</button><button class="j" data-a="fakemob">ニセスライム<br>踏むと爆発する</button><button class="j" data-a="icicle">つらら<br>3本 つづけて落ちてくる</button><button class="j" data-a="bombdrop">ばくだん落とし<br>空からふってきて爆発</button><button class="j" data-a="crow">カラス<br>うねりながら飛んでくる</button><button class="j" data-a="spikeblock">トゲブロック<br>10秒 頭の上にトゲ</button><button class="j" data-a="fastmob">はやスライム<br>すばやい（踏むと倒せる）</button><button class="j" data-a="spikewave">トゲの波<br>前から順に飛び出す（8秒）</button><button class="j" data-a="wisp">ひとだま<br>8秒 追いかけてくる</button><button class="j" data-a="slab">たおれる背景<br>景色が切りぬかれて倒れてくる</button><button class="j" data-a="fakeoni">ニセおにぎり<br>さわると巨大化して地面をつきぬける</button><button class="j" data-a="thunder">カミナリ雲<br>6秒 頭の上から落雷</button><button class="j" data-a="boulder">大岩<br>うしろから転がってくる</button><button class="j" data-a="bouncer">はねるトゲ玉<br>はねながら向かってくる</button><button class="j" data-a="fakecheck">ニセ中間ポイント<br>さわると爆発</button><button class="j" data-a="tarai">タライ<br>頭に落ちて1.3秒うごけない</button><button class="j" data-a="banana">バナナの皮<br>ふむとすべって止まれない</button><button class="j" data-a="tornado">たつまき<br>8秒 ふれると吹きとばされる</button><button class="j" data-a="weakfloor">もろい床<br>この先の床がくずれる床に</button><button class="j" data-a="laser">レーザー<br>足もとを横一直線にうつ</button><button class="j" data-a="missile">ミサイル<br>4.5秒 追いかけてくる</button><button class="j" data-a="balloon">ふうせん<br>1.7秒 勝手に空へ</button><button class="j" data-a="mobpack">スライムの群れ<br>3体いっぺんに</button><button class="j" data-a="goo">ねばねば床<br>10秒 おそい＋跳べない</button><button class="j" data-a="bigfoot">巨大な足<br>空からふみつぶす</button><button class="j" data-a="portal">ワープ穴<br>さわると10マスもどる</button><button class="j" data-a="fakebridge">ニセの足場<br>この先の穴に のれない足場</button><button class="j" data-a="ufo">UFO<br>6秒 つかまるとスタートへ</button><button class="j" data-a="blackhole">ブラックホール<br>6秒 すいよせる（跳ぶな）</button><button class="j" data-a="ball">トゲ玉<br>15秒 転がってくる</button>
    <h3>その他</h3>
    <button class="n" data-a="next">次のステージへ</button><button class="n" data-a="reset">記録を消す</button><button class="n" data-a="close">とじる</button>
  </div>
</div>
<div id="pads"><div class="pad" id="bL">←</div><div class="pad" id="bR">→</div><div class="pad" id="bJ">ジャンプ</div></div>
<script>
'use strict';
/* ===== ワナだらけ（試作）：初見殺しの罠だらけの横スクロール。←→とジャンプでゴールの旗まで行く。
   ギフトで罠（妨害）やお助けがその場に出る。キャラもステージもオリジナル ===== */
const W=1080, H=1080, FONT="MPR,'Hiragino Sans','Noto Sans JP',sans-serif", FONTD="DELA,"+FONT;
const cv=document.getElementById('cv'), g=cv.getContext('2d'), stage=document.getElementById('stage');
const TS=60, ROWS=12, OY=210, TOPH=172, BOTY=930;   /* 1マス60。ゲームの世界は画面の y=210〜930 に12段 */
const PH={run:330,acc:3200,air:2400,fric:3000,grav:2400,jump:-985,cut:.45,maxFall:1150,coyote:.09,buf:.12,w:36,h:50,spring:-1500};
const T_={holeT:8,holeStep:.2,cloudWait:.7,fleeN:8,dead:1.0,clear:2.4,hPop:.1,fFall:.22,crumb:.55,drop:.55,ghost:12,bulletV:560,bulletWarn:.55,wallT:6,wallV:255,rev:8,bridge:15,inv:1.0,ice:10,dark:8,wind:6,windV:215,flip:6,heavy:8,ballT:15,mobT:40,mobV:95,crowV:400,wispT:8,wispV:150,tempT:10,waveT:8,slabCut:.65,slabFall:.6,slabW:3,slabH:5,wallFT:5,wallFV:250};
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, pick=a=>a[Math.floor(Math.random()*a.length)], fmt=n=>Math.round(n).toLocaleString('en-US');

/* ===== ステージ：地面は下2段。そこから穴をあけたり、ものを置いたりして作る =====
   #＝地面　=＝ブロック　^＝トゲ　v＝天井のトゲ　h＝かくれトゲ（近づくと飛び出す）　f＝のると落ちる床　i＝見えないブロック　L＝バネ */
function mk(name,n,ops){ const rows=[]; for(let r=0;r<ROWS;r++) rows.push(new Array(n).fill(r>=10?'#':'.')); const t={name,n,rows,ents:[],start:[2,9]};
  const put=(x,y,c)=>{ if(x>=0&&x<n&&y>=0&&y<ROWS) rows[y][x]=c; };
  ops({ p:put, gap:(x,w)=>{ for(let i=0;i<w;i++){ put(x+i,10,'.'); put(x+i,11,'.'); } }, box:(x,y,w,h,c)=>{ for(let i=0;i<w;i++) for(let j=0;j<h;j++) put(x+i,y+j,c||'='); },
    row:(x,y,w,c)=>{ for(let i=0;i<w;i++) put(x+i,y,c); }, fall:(x,w)=>{ for(let i=0;i<w;i++){ put(x+i,10,'f'); put(x+i,11,'.'); } }, e:(k,x,y,o)=>t.ents.push(Object.assign({k,x,y},o||{})) }); return t; }
/* ステージは「ふつうの道」にしてある（穴・段差・見えているトゲ・ぷにスライムが少し）。罠はギフトで足してもらう。fake:true のスライムは、踏むと爆発するニセモノ */
const STAGES=[
 mk('はじめの一歩',56,s=>{ s.p(22,6,'B'); s.p(12,9,'^'); s.gap(18,2); s.box(26,9,1,1); s.box(27,8,1,2); s.gap(34,2); s.p(42,9,'^'); s.e('mob',30,9,{v:-1}); s.e('goal',52,9); }),
 mk('でこぼこ道',60,s=>{ s.p(40,9,'L'); s.p(21,6,'B'); s.gap(10,2); s.box(16,8,3,1); s.gap(24,3); s.box(30,9,1,1); s.box(31,8,1,2); s.box(32,7,1,3); s.row(36,9,2,'^'); s.gap(44,2); s.e('mob',20,9,{v:-1}); s.e('goal',56,9); }),
 mk('あなぼこ',62,s=>{ s.p(42,6,'B'); s.gap(9,2); s.gap(14,2); s.gap(20,3); s.box(27,7,4,1); s.gap(33,3); s.p(40,9,'^'); s.gap(45,2); s.gap(50,2); s.e('mob',30,9,{v:-1}); s.e('goal',58,9); }),
 mk('かいだん',64,s=>{ s.p(46,6,'B'); s.box(10,9,1,1); s.box(11,8,1,2); s.box(12,7,1,3); s.box(13,6,6,1); s.gap(22,3); s.gap(30,8); s.box(28,8,2,1); s.box(33,7,2,1); s.p(44,9,'^'); s.p(50,9,'^'); s.e('mob',40,9,{v:-1}); s.e('mob',55,9,{v:-1}); s.e('goal',60,9); }),
 mk('まんなか',70,s=>{ s.p(43,9,'L'); s.p(24,6,'B'); s.p(9,9,'^'); s.gap(13,3); s.box(19,9,1,1); s.box(20,8,1,2); s.p(22,9,'^'); s.gap(27,2); s.gap(31,2); s.box(37,7,3,1); s.row(37,9,3,'^'); s.gap(46,3); s.row(52,9,2,'^'); s.gap(58,2); s.e('mob',34,9,{v:-1}); s.e('mob',55,9,{v:-1,fake:true}); s.e('goal',66,9); }),
 mk('とびうつれ',66,s=>{ s.p(31,6,'B'); s.box(7,9,1,1); s.box(8,7,1,3); s.gap(13,3); s.row(19,9,10,'^'); s.box(19,8,2,1); s.box(23,6,2,1); s.box(27,8,2,1); s.gap(34,3); s.p(40,9,'^'); s.gap(44,2); s.row(49,9,2,'^'); s.gap(54,3); s.e('mob',11,9,{v:-1}); s.e('mob',42,9,{v:-1}); s.e('goal',62,9); }),
 mk('とびいし',70,s=>{ s.p(43,6,'B'); s.gap(8,22); s.box(11,10,2,2,'#'); s.box(16,10,2,2,'#'); s.box(21,10,1,2,'#'); s.box(25,10,2,2,'#'); s.p(34,9,'^'); s.row(38,9,3,'^'); s.box(38,7,3,1); s.gap(45,3); s.gap(50,6); s.box(52,10,2,2,'#'); s.row(60,9,2,'^'); s.e('mob',31,9,{v:-1}); s.e('mob',42,9,{v:-1}); s.e('goal',66,9); }),
 mk('のぼりくだり',72,s=>{ s.p(44,9,'L'); s.p(49,6,'B'); s.box(8,9,1,1); s.box(9,8,1,2); s.box(10,7,1,3); s.box(11,6,1,4); s.box(12,5,4,5); s.p(14,4,'^'); s.gap(17,3); s.gap(24,18); s.box(24,8,2,1); s.box(28,6,2,1); s.box(32,4,2,1); s.box(36,6,2,1); s.box(40,8,2,1); s.row(46,9,2,'^'); s.gap(51,3); s.p(56,9,'^'); s.p(58,9,'^'); s.gap(62,3); s.e('mob',49,9,{v:-1}); s.e('mob',60,9,{v:-1,fake:true}); s.e('goal',68,9); }),
 mk('トゲの道',74,s=>{ s.p(11,6,'B'); s.row(8,9,2,'^'); s.row(13,9,3,'^'); s.p(18,9,'^'); s.p(21,9,'^'); s.p(24,9,'^'); s.gap(28,3); s.row(33,9,6,'^'); s.box(34,7,3,1); s.gap(43,2); s.row(46,9,2,'^'); s.gap(50,3); s.row(54,9,3,'^'); s.box(60,9,1,1); s.box(61,8,1,2); s.row(62,9,2,'^'); s.e('mob',41,9,{v:-1}); s.e('mob',58,9,{v:-1}); s.e('goal',70,9); }),
 mk('さいごの試練',84,s=>{ s.p(27,9,'L'); s.p(39,6,'B'); s.row(7,9,2,'^'); s.gap(11,3); s.box(16,7,2,1); s.gap(18,6); s.box(20,10,2,2,'#'); s.p(26,9,'^'); s.box(29,9,1,1); s.box(30,8,1,2); s.box(31,7,1,3); s.gap(33,3); s.row(36,9,2,'^'); s.gap(41,14); s.box(43,8,2,1); s.box(47,6,2,1); s.box(51,8,2,1); s.row(58,9,3,'^'); s.gap(64,3); s.p(69,9,'^'); s.p(72,9,'^'); s.gap(75,3); s.e('mob',15,9,{v:-1}); s.e('mob',56,9,{v:-1,fake:true}); s.e('goal',80,9); }) ];

/* ===== 状態 ===== */
let S, deaths=0, stageI=0, T=0, playT=0, saveT=0;   /* playT＝はじめてからの時間（秒）。全ステージをクリアするまで続く */
try{ const o=JSON.parse(localStorage.getItem('trap_save')||'{}'); deaths=o.deaths|0; playT=+o.time||0; stageI=clamp(o.stage|0,0,STAGES.length-1); }catch(e){}
function save(){ try{ localStorage.setItem('trap_save',JSON.stringify({deaths,time:Math.round(playT),stage:stageI})); }catch(e){} }
function newRun(keepCp){ const st=STAGES[stageI], cp=keepCp&&S?S.cp:null, sd=S?S.stDeaths||0:0, sp=cp||{x:st.start[0]*TS+TS/2,y:(st.start[1]+1)*TS};
  S={ mode:'play', n:st.n, t:0, map:st.rows.map(r=>r.slice()), ents:st.ents.map(e=>Object.assign({},e,{st:'wait',t:0,px:e.x*TS+TS/2,py:(e.y+1)*TS,vy:0,dir:e.v||1})), p:{x:sp.x,y:sp.y,vx:0,vy:0,face:1,ground:false,coy:0,buf:0,run:0,jumping:false},
    cp, stDeaths:keepCp?sd:0, cam:0, parts:[], pops:[], crumbs:[], debris:[], warns:[], bullets:[], drops:[], ghosts:[], bridges:[], items:[], booms:[], hiT:0, sky:null, twinkle:null, holes:[], clouds:[], flee:0, wall:null, wallF:null, crows:[], wisps:[], temps:[], slabs:[], big:null, lasers:[], missiles:[], goos:[], feet:[], ufo:null, grab:null, bh:null, balloonT:0, weaks:[], stunT:0, slipT:0, slipDir:1, thunder:null, rolls:[], tarais:[], revT:0, iceT:0, darkT:0, windT:0, flipT:0, flipK:0, heavyT:0, barrier:0, invT:1, safe:{x:sp.x,y:sp.y}, shake:0, flash:0, red:0, log:S?S.log:[], banner:null, wanim:[], deadT:0, clearT:0, fakeHit:null };
  S.cam=clamp(S.p.x-W*.38,0,S.n*TS-W); }
const logAdd=(s,c)=>{ S.log.unshift({s,c:c||'#fff',t:6}); S.log.length=Math.min(S.log.length,3); };
const banner=(a,c,b)=>{ S.banner={a,b:b||'',c:c||'#fff',t:0}; };
const tile=(tx,ty)=>(ty<0?'.':(ty>=ROWS||tx<0||tx>=S.n)?(tx<0||tx>=S.n?'#':'.'):S.map[ty][tx]);
const solidCh=c=>c==='#'||c==='='||c==='f'||c==='i'||c==='b'||c==='r'||c==='B'||c==='F'||c==='u';   /* B＝プレゼント箱（下からたたくと、おにぎりが出る）、F＝ニセの箱（ばくだんが出る）、u＝あけたあとの箱 */   /* r＝落ちてきて残った岩 */   /* b＝お助けの足場 */
const inHole=tx=>{ for(const h of S.holes) if(tx>=h.x && tx<h.x+h.w) return true; return false; };   /* 動く穴：その列の地面（下2段）がなくなる */
const solid=(tx,ty)=>solidCh(tile(tx,ty)) && !(ty>=10 && S.holes.length && inHole(tx));
const setT=(tx,ty,c)=>{ if(tx>=0&&tx<S.n&&ty>=0&&ty<ROWS) S.map[ty][tx]=c; };
function burst(x,y,cols,n,v){ for(let i=0;i<n;i++) S.parts.push({x,y,vx:rand(-v,v),vy:rand(-v*1.3,v*.3),g:1800,t:rand(.4,.9),s:pick([8,12,16]),c:pick(cols)}); }

/* ===== 音（効果音ラボ） ===== */
const SND=['jump','crash','lose','goal','clap','cheer','heavy','crack','rockhit','boyon','pon','swing','kick','harp','harp2','glass','dark','bad','guard','bless','levelup','fanfare','don','block','punch','beam','bell','wing'], sndBuf={}; let actx=null, seGain=null; const SE_LAST={};
function audioInit(){ if(actx) return; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); seGain=actx.createGain(); seGain.gain.value=.8; const hs=actx.createBiquadFilter(); hs.type='highshelf'; hs.frequency.value=5000; hs.gain.value=-6; seGain.connect(hs); hs.connect(actx.destination);
  for(const k of SND) fetch('./snd/'+k+'.mp3').then(r=>r.arrayBuffer()).then(b=>actx.decodeAudioData(b)).then(b=>{ sndBuf[k]=b; }).catch(()=>{}); }catch(e){} }
function play(k,v){ if(!actx || !sndBuf[k]) return; const now=actx.currentTime; if(SE_LAST[k] && now-SE_LAST[k]<.05) return; SE_LAST[k]=now; try{ const s=actx.createBufferSource(), gn=actx.createGain(); s.buffer=sndBuf[k]; gn.gain.value=v==null?.7:v; s.connect(gn); gn.connect(seGain); s.start(); }catch(e){} }
window.addEventListener('pointerdown',()=>{ audioInit(); if(actx && actx.state==='suspended') actx.resume(); },{passive:true});

/* ===== 操作 ===== */
const IN={l:false,r:false,j:false}, KEYS={};
function padBind(id,k){ const el=document.getElementById(id); const on=e=>{ e.preventDefault(); IN[k]=true; el.classList.add('on'); if(k==='j') jumpPress(); try{ el.setPointerCapture(e.pointerId); }catch(_){} }, off=e=>{ IN[k]=false; el.classList.remove('on'); if(k==='j') jumpRelease(); };
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off); el.addEventListener('lostpointercapture',off); }
padBind('bL','l'); padBind('bR','r'); padBind('bJ','j');
function jumpPress(){ if(S.mode==='play') S.p.buf=PH.buf; else if(S.mode==='allclear' && S.clearT>3) S.again=true; }
function jumpRelease(){ const p=S.p; if(p.jumping && p.vy<0){ p.vy*=PH.cut; } p.jumping=false; }
window.addEventListener('keydown',e=>{ if(e.repeat) return; KEYS[e.code]=true; if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='KeyZ'){ e.preventDefault(); jumpPress(); } if(e.code==='ArrowLeft'||e.code==='ArrowRight') e.preventDefault(); });
window.addEventListener('keyup',e=>{ KEYS[e.code]=false; if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='KeyZ') jumpRelease(); });
const axis=()=>{ if(S.stunT>0 || S.slipT>0 || S.grab) return 0; let a=((IN.r||KEYS.ArrowRight||KEYS.KeyD)?1:0)-((IN.l||KEYS.ArrowLeft||KEYS.KeyA)?1:0); return S.revT>0?-a:a; };

/* ===== ギフトで起きること ===== */
const pTile=()=>({tx:Math.floor(S.p.x/TS), ty:Math.floor((S.p.y-1)/TS)});
function groundBelow(tx,fromTy){ for(let y=Math.max(0,fromTy);y<ROWS;y++) if(solid(tx,y)) return y; return -1; }
const Game={
  /* お助け */
  check(n){ const s=S.safe; S.cp={x:s.x,y:s.y}; S.ents=S.ents.filter(e=>!e.gift||e.k!=='check'); S.ents.push({k:'check',gift:true,x:Math.floor(s.x/TS),y:Math.floor(s.y/TS)-1,px:s.x,py:s.y,st:'on',t:0}); play('bless',.7); burst(s.x,s.y-40,['#5dffb0','#fff'],14,300); logAdd((n||'だれか')+' が中間ポイントを置いた','#5dffb0'); },
  barrier(n){ if(S.barrier>=3){ logAdd((n||'だれか')+' のバリア（もう3枚ある）','#8fd3ff'); return; } S.barrier++; play('guard',.7); logAdd((n||'だれか')+' がバリアをくれた（'+S.barrier+'枚）','#8fd3ff'); },
  bridge(n){ const {tx,ty}=pTile(); let done=0; for(let x=tx;x<tx+14 && x<S.n;x++){ if(!solid(x,10) && !solid(x,11) && tile(x,10)!=='b'){ let w=0; while(x+w<S.n && !solid(x+w,10) && w<6) w++; for(let i=0;i<w;i++){ setT(x+i,10,'b'); S.bridges.push({x:x+i,y:10,t:T_.bridge}); } done=w; break; } }
    if(!done && !S.p.ground){ const y=clamp(Math.floor(S.p.y/TS)+1,1,10); for(let i=-1;i<=1;i++) if(tile(tx+i,y)==='.'){ setT(tx+i,y,'b'); S.bridges.push({x:tx+i,y,t:T_.bridge}); done++; } }
    play('pon',.7); logAdd((n||'だれか')+(done?' が足場を出した（'+T_.bridge+'秒）':' の足場（この先に穴がなかった）'),'#5dffb0'); },
  sweep(n){ const x0=Math.floor(S.cam/TS)-1, x1=x0+20; let c=0; for(let y=0;y<ROWS;y++) for(let x=x0;x<=x1;x++){ const ch=tile(x,y); if(ch==='^'||ch==='v'||ch==='h'||ch==='p'||ch==='F'||ch==='M'){ setT(x,y,'.'); burst(x*TS+30,y*TS+30,['#fff','#ffd23f'],4,220); c++; } }
    for(const gh of S.ghosts) setT(gh.x,gh.y,'.'); S.ghosts=[]; c+=S.holes.length+S.clouds.length+S.flee; S.holes=[]; S.clouds=[]; S.flee=0; c+=S.bullets.length+S.drops.length+S.warns.length; S.bullets=[]; S.drops=[]; S.warns=[]; S.pops=[]; c+=S.weaks.length; S.weaks=[]; c+=S.lasers.length+S.missiles.length+S.goos.length+S.feet.length+(S.ufo?1:0)+(S.bh?1:0)+(S.balloonT>0?1:0); S.lasers=[]; S.missiles=[]; S.goos=[]; S.feet=[]; S.ufo=null; S.bh=null; S.balloonT=0; S.ents=S.ents.filter(e=>e.k!=='portal'); c+=S.rolls.length+S.tarais.length+(S.thunder?1:0); S.rolls=[]; S.tarais=[]; S.thunder=null; S.ents=S.ents.filter(e=>!(e.k==='banana'||e.k==='tornado'||e.fakeC)); c+=S.crows.length+S.wisps.length+S.slabs.length; S.crows=[]; S.wisps=[]; S.slabs=[]; S.items=S.items.filter(it=>it.type!=='fakeoni'); for(const q of S.temps){ if(tile(q.x,q.y)===q.ch) setT(q.x,q.y,'.'); } S.temps=[]; if(S.wall){ S.wall=null; c++; } if(S.wallF){ S.wallF=null; c++; } if(S.revT>0){ S.revT=0; c++; } for(const k of ['iceT','darkT','windT','flipT','heavyT']) if(S[k]>0){ S[k]=0; c++; }
    S.ents=S.ents.filter(e=>{ const on=e.px>S.cam-80&&e.px<S.cam+W+80; if(on&&(e.k==='ball'||e.k==='mob'||e.k==='crusher'||e.k==='fake')){ burst(e.px,e.py-30,['#fff','#ffd23f'],10,300); c++; return false; } return true; });
    S.flash=.35; play('harp2',.7); play('kick',.6); banner('おそうじ！','#ffd23f',(n||'だれか')+' が画面の罠を消した'); logAdd((n||'だれか')+' が罠を'+c+'こ消した','#5dffb0'); },
  present(n){ const {tx,ty}=pTile(); for(const dx of [S.p.face*2,S.p.face*3,S.p.face,0]){ const x=tx+dx, gy=groundBelow(x,ty); if(gy<4) continue; const y=gy-4; if(tile(x,y)==='.' && tile(x,y+1)==='.' && tile(x,y+2)==='.'){ setT(x,y,'B'); play('pon',.6); burst(x*TS+30,y*TS+30,['#ffd23f','#fff'],10,260); logAdd((n||'だれか')+' がプレゼント箱を置いた（下からたたく）','#5dffb0'); return; } } logAdd((n||'だれか')+' のプレゼント箱（置けなかった）','#5dffb0'); },
  skip(n){ const last=stageI>=STAGES.length-1; burst(S.p.x,S.p.y-30,['#ffd23f','#fff','#5dffb0'],24,460); play('levelup',.7); logAdd((n||'だれか')+' がこのステージをスキップさせた','#5dffb0'); clearStage(); if(!last) banner('1面スキップ！','#5dffb0',(n||'だれか')+' のおかげで次のステージへ'); },
  /* 妨害 */
  flee(n){ S.flee++; play('pon',.5); logAdd((n||'だれか')+' がゴールに逃げ足をつけた（あと'+S.flee+'回逃げる）','#ff9aa8'); },
  hole(n){ const {tx}=pTile(), x=clamp(tx+S.p.face*7,2,S.n-8); S.holes.push({x,w:2,t:T_.holeT,acc:0}); play('crack',.7); S.shake=Math.max(S.shake,.25); logAdd((n||'だれか')+' が動く穴をあけた（'+T_.holeT+'秒 追ってくる）','#ff9aa8'); },
  cloud(n){ S.clouds.push({x:S.p.x+S.p.vx*.35,y:40,st:'wait',t:T_.cloudWait,vy:0}); logAdd((n||'だれか')+' が雲を落とした','#ff9aa8'); },
  fakespring(n){ const {tx,ty}=pTile(), p=S.p; for(const dx of [p.face*2,p.face*3,p.face*4,p.face]){ const x=tx+dx, gy=groundBelow(x,ty-1); if(gy>0 && tile(x,gy-1)==='.' && x>1 && x<S.n-2){ setT(x,gy-1,'M'); play('pon',.6); burst(x*TS+30,gy*TS-20,['#e23a3a','#fff'],8,220); logAdd((n||'だれか')+' がバネを置いた…？','#ff9aa8'); return; } } logAdd((n||'だれか')+' のニセのバネ（置けなかった）','#ff9aa8'); },
  fakebox(n){ const {tx,ty}=pTile(); for(const dx of [S.p.face*2,S.p.face*3,S.p.face,0]){ const x=tx+dx, gy=groundBelow(x,ty); if(gy<4) continue; const y=gy-4; if(tile(x,y)==='.' && tile(x,y+1)==='.' && tile(x,y+2)==='.'){ setT(x,y,'F'); play('pon',.6); burst(x*TS+30,y*TS+30,['#ffd23f','#fff'],10,260); logAdd((n||'だれか')+' がプレゼント箱を置いた…？','#ff9aa8'); return; } } logAdd((n||'だれか')+' のニセの箱（置けなかった）','#ff9aa8'); },
  spike(n){ const {tx,ty}=pTile(), p=S.p; let best=null; for(const dx of [p.face*2,p.face*3,p.face,-p.face*2]){ const x=tx+dx, gy=groundBelow(x,ty-1); if(gy>0 && tile(x,gy-1)==='.'){ best={x,y:gy-1}; break; } } if(!best){ logAdd((n||'だれか')+' のトゲ（置ける場所がなかった）','#ff9aa8'); return; }
    S.warns.push({k:'spike',x:best.x,y:best.y,t:.5}); play('swing',.6); logAdd((n||'だれか')+' がトゲをしかけた','#ff9aa8'); },
  crumble(n){ const {tx,ty}=pTile(); let c=0; for(let dx=-1;dx<=1;dx++){ const gy=groundBelow(tx+dx,ty); if(gy<0) continue; const ch=tile(tx+dx,gy); if(ch==='#'||ch==='='||ch==='f'||ch==='b'){ if(!S.crumbs.some(q=>q.x===tx+dx&&q.y===gy)){ S.crumbs.push({x:tx+dx,y:gy,t:T_.crumb,deep:true}); c++; } } }
    play('crack',.7); S.shake=Math.max(S.shake,.3); logAdd((n||'だれか')+(c?' が足元をくずした':' の床ぬけ（くずす床がなかった）'),'#ff9aa8'); },
  drop(n){ const {tx}=pTile(); S.drops.push({x:tx,st:'warn',t:T_.drop,py:-80,vy:0}); play('swing',.5); logAdd((n||'だれか')+' が落石を落とした','#ff9aa8'); },

  bullet(n){ S.warns.push({k:'bullet',y:clamp(S.p.y-26,OY*0+60,10*TS-20),t:T_.bulletWarn}); play('swing',.5); logAdd((n||'だれか')+' が矢を放った','#ff9aa8'); },
  wall(n){ if(S.wall){ S.wall.t+=T_.wallT; logAdd((n||'だれか')+' がトゲ壁をのばした','#ff9aa8'); return; } S.wall={x:S.cam-260,t:T_.wallT,out:0}; play('dark',.7); play('heavy',.5); banner('うしろからトゲ壁！','#ff5c5c',n); logAdd((n||'だれか')+' がトゲ壁を呼んだ（'+T_.wallT+'秒 前に逃げろ）','#ff9aa8'); },

  dark(n){ S.darkT=Math.min(40,S.darkT+T_.dark); play('dark',.8); logAdd((n||'だれか')+' がまっくらにした（'+T_.dark+'秒）','#ff9aa8'); },
  wind(n){ S.windT=Math.min(40,S.windT+T_.wind); play('swing',.8); play('wing',.6); banner('向かい風！','#c9ced8','うしろへ押される'); logAdd((n||'だれか')+' が向かい風をふかせた（'+T_.wind+'秒）','#ff9aa8'); },
  flip(n){ S.flipT=Math.min(30,S.flipT+T_.flip); play('bad',.6); play('boyon',.5); logAdd((n||'だれか')+' が画面をさかさまにした（'+T_.flip+'秒）','#ff9aa8'); },
  heavy(n){ S.heavyT=Math.min(40,S.heavyT+T_.heavy); play('heavy',.8); banner('おもり！','#9aa3b5','ジャンプが低くなる'); logAdd((n||'だれか')+' がおもりをのせた（'+T_.heavy+'秒）','#ff9aa8'); },
  ball(n){ const {tx,ty}=pTile(), f=S.p.face; for(const dx of [f*8,f*7,f*6,-f*7]){ const x=tx+dx, gy=groundBelow(x,ty-1); if(gy>0 && tile(x,gy-1)==='.' && x>1 && x<S.n-2){ S.ents.push({k:'ball',gift:true,x,px:x*TS+30,py:gy*TS,dir:dx>0?-1:1,a:x-9,b:x+9,life:T_.ballT,t:0}); play('pon',.6); burst(x*TS+30,gy*TS-26,['#333','#fff'],8,240); logAdd((n||'だれか')+' がトゲ玉を転がした（'+T_.ballT+'秒）','#ff9aa8'); return; } } logAdd((n||'だれか')+' のトゲ玉（置けなかった）','#ff9aa8'); },
  mob(n){ const {tx,ty}=pTile(), f=S.p.face; for(const dx of [f*7,f*6,f*8,f*5,-f*6]){ const x=tx+dx, gy=groundBelow(x,ty-1); if(gy>0 && tile(x,gy-1)==='.' && x>1 && x<S.n-2){ S.ents.push({k:'mob',gift:true,x,px:x*TS+30,py:gy*TS,dir:dx>0?-1:1,st:'walk',life:T_.mobT,t:0}); play('pon',.6); burst(x*TS+30,gy*TS-20,['#8a5cf0','#fff'],8,240); logAdd((n||'だれか')+' がぷにスライムを呼んだ（踏むと倒せる）','#ff9aa8'); return; } } logAdd((n||'だれか')+' のぷにスライム（置けなかった）','#ff9aa8'); },
  fakemob(n){ const {tx,ty}=pTile(), f=S.p.face; for(const dx of [f*7,f*6,f*8,f*5,-f*6]){ const x=tx+dx, gy=groundBelow(x,ty-1); if(gy>0 && tile(x,gy-1)==='.' && x>1 && x<S.n-2){ S.ents.push({k:'mob',fake:true,gift:true,x,px:x*TS+30,py:gy*TS,dir:dx>0?-1:1,st:'walk',life:T_.mobT,t:0}); play('pon',.6); burst(x*TS+30,gy*TS-20,['#8a5cf0','#fff'],8,240); logAdd((n||'だれか')+' がぷにスライムを呼んだ…？','#ff9aa8'); return; } } logAdd((n||'だれか')+' のニセスライム（置けなかった）','#ff9aa8'); },
  wallf(n){ if(S.wallF){ S.wallF.t+=T_.wallFT; S.wallF.out=0; logAdd((n||'だれか')+' が前のトゲ壁をのばした','#ff9aa8'); return; } S.wallF={x:S.cam+W+260,t:T_.wallFT,out:0}; play('dark',.7); play('heavy',.5); banner('前からトゲ壁！','#ff5c5c',n); logAdd((n||'だれか')+' が前からトゲ壁を呼んだ（'+T_.wallFT+'秒 うしろへ逃げろ）','#ff9aa8'); },
  rifujin(n){ const got=rifPick(3); S.shake=Math.max(S.shake,.5); S.red=.3; play('bad',.8); play('don',.7); RIF.left=Math.min(30,RIF.left+RIF.n); RIF.cd=RIF.gap; RIF.pop=.6; logAdd((n||'だれか')+' の理不尽！ あと'+RIF.left+'回やられるまで、理不尽オニが妨害を出し続ける','#ff5c5c'); for(const k of got){ try{ Game[k](n); }catch(e){} } banner('理不尽！','#ff5c5c',(n||'だれか')+' のしわざ（'+RIF.left+'回やられるまで消えない）'); },
  icicle(n){ const {tx}=pTile(), f=S.p.face; for(let i=0;i<3;i++) S.drops.push({x:clamp(tx+f*(1+i*2),1,S.n-2),st:'warn',t:.5+i*.3,py:-80,vy:0,ice:true}); play('glass',.6); logAdd((n||'だれか')+' がつららを落とした（3本）','#ff9aa8'); },

  crow(n){ const fromR=S.p.face>=0; S.crows.push({x:fromR?S.cam+W+60:S.cam-60,y0:clamp(S.p.y-60,120,9*TS),dir:fromR?-1:1,t:0}); play('wing',.7); logAdd((n||'だれか')+' がカラスを飛ばした','#ff9aa8'); },
  spikeblock(n){ const {tx,ty}=pTile(), f=S.p.face; let c=0; for(let i=2;i<=4;i++){ const x=tx+f*i, y=ty-2; if(y>=1 && x>1 && x<S.n-2 && tile(x,y)==='.' && tile(x,y-1)==='.'){ setT(x,y-1,'='); setT(x,y,'v'); S.temps.push({x,y:y-1,ch:'=',t:T_.tempT},{x,y,ch:'v',t:T_.tempT}); burst(x*TS+30,y*TS,['#c9ced8','#fff'],4,200); c++; } } play('heavy',.6); logAdd((n||'だれか')+(c?' がトゲブロックを置いた（'+T_.tempT+'秒 ジャンプに注意）':' のトゲブロック（置けなかった）'),'#ff9aa8'); },
  fastmob(n){ const {tx,ty}=pTile(), f=S.p.face; for(const dx of [f*9,f*8,f*7,-f*8]){ const x=tx+dx, gy=groundBelow(x,ty-1); if(gy>0 && tile(x,gy-1)==='.' && x>1 && x<S.n-2){ S.ents.push({k:'mob',fast:true,gift:true,x,px:x*TS+30,py:gy*TS,dir:dx>0?-1:1,st:'walk',life:T_.mobT,t:0}); play('pon',.6); burst(x*TS+30,gy*TS-20,['#ff8a1f','#fff'],8,240); logAdd((n||'だれか')+' がはやスライムを呼んだ（踏むと倒せる）','#ff9aa8'); return; } } logAdd((n||'だれか')+' のはやスライム（置けなかった）','#ff9aa8'); },

    if(S.barrier>0){ g.strokeStyle='rgba(143,211,255,'+(.7+.2*Math.sin(T*8))+')'; g.lineWidth=5; g.beginPath(); g.arc(p.x,p.y-27,44,0,7); g.stroke(); if(S.barrier>1) txt('×'+S.barrier,p.x+40,p.y-64,26,'#8fd3ff','left','#111'); }
    if(S.revT>0){ txt('？',p.x,p.y-82+Math.sin(T*8)*4,40,'#c08bff','center','#111',FONTD); }
    if(S.balloonT>0){ const bx=p.x+Math.sin(T*6)*6, by=p.y-150; g.strokeStyle='#111'; g.lineWidth=3; g.beginPath(); g.moveTo(p.x,p.y-50); g.lineTo(bx,by+34); g.stroke(); g.fillStyle='#111'; g.beginPath(); g.ellipse(bx,by,34,40,0,0,7); g.fill(); g.fillStyle='#e23a3a'; g.beginPath(); g.ellipse(bx,by,29,35,0,0,7); g.fill(); g.fillStyle='#ff9a9a'; g.fillRect(bx-16,by-20,10,12); }
    if(S.stunT>0){ for(let i=0;i<3;i++){ const a=T*7+i*2.1; txt('★',p.x+Math.cos(a)*26,p.y-74+Math.sin(a)*8,22,'#ffd23f','center','#111'); } }
    if(S.heavyT>0){ const hx=p.x, hy=p.y-62; g.fillStyle='#111'; g.fillRect(hx-24,hy-30,48,34); g.fillRect(hx-10,hy-40,20,12); g.fillStyle='#5b6474'; g.fillRect(hx-20,hy-26,40,26); g.fillStyle='#9aa3b5'; g.fillRect(hx-20,hy-26,40,6); g.fillStyle='#111'; g.fillRect(hx-6,hy-36,12,4); txt('10t',hx,hy-11,18,'#fff','center'); } }
  if(S.windT>0){ g.fillStyle='rgba(255,255,255,.75)'; for(let i=0;i<16;i++){ const L=90+(i*37)%120, x=cam+W+200-((T*(900+i*60)+i*211)%(W+500)), y=30+(i*97)%(ROWS*TS-60); g.fillRect(x,y,L,5); } }
  if(S.twinkle && S.twinkle.t<.9){ const k=S.twinkle.t/.9, r=70*Math.sin(k*Math.PI), x=S.twinkle.x, y=26; g.fillStyle='#fff'; g.beginPath(); g.moveTo(x,y-r); g.lineTo(x+r*.18,y-r*.18); g.lineTo(x+r,y); g.lineTo(x+r*.18,y+r*.18); g.lineTo(x,y+r); g.lineTo(x-r*.18,y+r*.18); g.lineTo(x-r,y); g.lineTo(x-r*.18,y-r*.18); g.closePath(); g.fill(); g.strokeStyle='#ffd23f'; g.lineWidth=4; g.stroke(); }
  if(S.mode==='dead' && S.corpse) drawHero(S.corpse.x,S.corpse.y,S.corpse.face,'dead',1,0);
  /* トゲ壁 */
  if(S.wall){ const wx=S.wall.x; g.fillStyle='#333'; g.fillRect(wx-400,-40,430,ROWS*TS+80); for(let y=-20;y<ROWS*TS;y+=40){ g.fillStyle='#c9ced8'; g.beginPath(); g.moveTo(wx+30,y); g.lineTo(wx+78,y+20); g.lineTo(wx+30,y+40); g.closePath(); g.fill(); g.strokeStyle='#111'; g.lineWidth=3; g.stroke(); } g.fillStyle='#e23a3a'; g.fillRect(wx-60,ROWS*TS*.35,26,26); g.fillRect(wx-60,ROWS*TS*.55,26,26); }
  if(RIF.left>0){ const ox=Math.round(cam+W-150+Math.sin(T*1.7)*24), oy=Math.round(150+Math.sin(T*2.6)*18), f=RIF.fire>0, k=1+(RIF.pop>0?RIF.pop*.6:0)+(f?.15:0); g.save(); g.translate(ox,oy); g.scale(k,k);
    g.fillStyle='#111'; g.fillRect(-40,-34,80,72); g.fillRect(-48,-22,96,48); g.fillRect(-34,-52,14,22); g.fillRect(20,-52,14,22); g.fillStyle=f?'#e23a3a':'#5b2a86'; g.fillRect(-34,-28,68,60); g.fillRect(-42,-16,84,36); g.fillStyle='#ffd23f'; g.fillRect(-30,-48,6,14); g.fillRect(24,-48,6,14);
    g.fillStyle='#fff'; g.fillRect(-26,-12,18,14); g.fillRect(8,-12,18,14); g.fillStyle='#e23a3a'; g.fillRect(-18,-8,8,8); g.fillRect(12,-8,8,8); g.fillStyle='#111'; g.fillRect(-28,-16,20,5); g.fillRect(8,-16,20,5); g.fillStyle='#fff'; g.fillRect(-20,12,40,10); g.fillStyle='#111'; for(let i=-12;i<=12;i+=8) g.fillRect(i-1,12,2,10); g.restore();
    txt('あと'+RIF.left+'回',ox,oy+70,26,'#fff','center','#111'); }
  if(S.wallF){ const wx=S.wallF.x; g.fillStyle='#333'; g.fillRect(wx-30,-40,430,ROWS*TS+80); for(let y=-20;y<ROWS*TS;y+=40){ g.fillStyle='#c9ced8'; g.beginPath(); g.moveTo(wx-30,y); g.lineTo(wx-78,y+20); g.lineTo(wx-30,y+40); g.closePath(); g.fill(); g.strokeStyle='#111'; g.lineWidth=3; g.stroke(); } g.fillStyle='#e23a3a'; g.fillRect(wx+34,ROWS*TS*.35,26,26); g.fillRect(wx+34,ROWS*TS*.55,26,26); }
  for(const q of S.parts){ g.globalAlpha=clamp(q.t*3,0,1); g.fillStyle=q.c; g.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s); } g.globalAlpha=1;
  if(S.fakeHit && S.fakeHit.t<1.2){ txt('ハズレ',S.fakeHit.x,S.fakeHit.y-220-S.fakeHit.t*40,70,'#e23a3a','center','#fff',FONTD); }
  g.restore();
  if(S.flash>0){ g.fillStyle='rgba(255,255,255,'+clamp(S.flash*1.6,0,.8)+')'; g.fillRect(0,TOPH,W,BOTY-TOPH); } if(S.red>0){ g.fillStyle='rgba(226,58,58,'+clamp(S.red*.9,0,.4)+')'; g.fillRect(0,TOPH,W,BOTY-TOPH); }
  if(S.revT>0){ g.fillStyle='rgba(160,90,255,.12)'; g.fillRect(0,TOPH,W,BOTY-TOPH); }
  if(S.darkT>0){ const a=clamp(S.darkT*2.5,0,1), px=p.x-S.cam; let py=p.y-27+OY; if(S.flipK>.5) py=TOPH+BOTY-py; const gr=g.createRadialGradient(px,py,90,px,py,230); gr.addColorStop(0,'rgba(5,6,16,0)'); gr.addColorStop(1,'rgba(5,6,16,'+(.97*a)+')'); g.fillStyle=gr; g.fillRect(0,TOPH,W,BOTY-TOPH); }
  drawHud(); }
function drawHud(){ g.fillStyle='#1b2440'; g.fillRect(0,0,W,TOPH); g.fillStyle='#ffd23f'; g.fillRect(0,TOPH-6,W,6); g.fillStyle='#1b2440'; g.fillRect(0,BOTY,W,H-BOTY); g.fillStyle='#ffd23f'; g.fillRect(0,BOTY,W,6);
  txt('ステージ '+(stageI+1)+' / '+STAGES.length,24,40,34,'#fff'); txt(STAGES[stageI].name,24,84,30,'#9fb0d8'); txt('このステージ '+S.stDeaths+'回',24,128,28,'#ff9aa8');
  txt('やられた回数',W/2-40,34,30,'#ff9aa8','center'); txtD(fmt(deaths),W/2-40,104,96,S.mode==='dead'?'#ff5c5c':'#fff'); txt('回',W/2-40+g.measureText(fmt(deaths)).width/2+34,120,36,'#fff','left');
  { const bx=W-224; txt('時間',bx+60,30,30,'#fff','center'); txtD(tstr(playT),bx+60,96,playT>=3600?46:60,'#ffd23f'); }
  /* 効いているもの */
  let tx=24; const tag=(s,c)=>{ g.font='900 28px '+FONT; const w=g.measureText(s).width+32; g.fillStyle=c; rr(tx,TOPH+14,w,44,22); g.fill(); txt(s,tx+16,TOPH+37,28,'#111'); tx+=w+10; };
  if(S.barrier>0) tag('バリア ×'+S.barrier,'#8fd3ff'); if(S.flee>0) tag('逃げるゴール ×'+S.flee,'#ff9aa8'); if(S.holes.length) tag('動く穴 あと'+Math.ceil(Math.max.apply(null,S.holes.map(h=>h.t)))+'秒','#ff9aa8'); if(S.hiT>0) tag('ハイジャンプ あと'+Math.ceil(S.hiT)+'秒','#5dffb0'); if(S.revT>0) tag('あべこべ あと'+Math.ceil(S.revT)+'秒','#c08bff'); if(S.iceT>0) tag('つるつる あと'+Math.ceil(S.iceT)+'秒','#8fd3ff'); if(S.darkT>0) tag('まっくら あと'+Math.ceil(S.darkT)+'秒','#9aa3b5'); if(S.windT>0) tag('向かい風 あと'+Math.ceil(S.windT)+'秒','#c9ced8'); if(S.flipT>0) tag('さかさま あと'+Math.ceil(S.flipT)+'秒','#c08bff'); if(S.heavyT>0) tag('おもり あと'+Math.ceil(S.heavyT)+'秒','#9aa3b5'); if(S.ufo) tag('UFO あと'+Math.ceil(Math.max(0,S.ufo.t))+'秒','#8fd3ff'); if(S.bh) tag('ブラックホール あと'+Math.ceil(S.bh.t)+'秒','#c08bff'); if(S.thunder) tag('カミナリ雲 あと'+Math.ceil(Math.max(0,S.thunder.t))+'秒','#ffd23f'); if(S.wisps.some(w=>w.t>0)) tag('ひとだま あと'+Math.ceil(Math.max.apply(null,S.wisps.map(w=>w.t)))+'秒','#8fd3ff'); if(S.wall&&S.wall.t>0) tag('トゲ壁 あと'+Math.ceil(S.wall.t)+'秒','#ff9aa8'); if(S.wallF&&S.wallF.t>0) tag('前のトゲ壁 あと'+Math.ceil(S.wallF.t)+'秒','#ff9aa8'); if(RIF.left>0) tag('理不尽 あと'+RIF.left+'回やられるまで','#ff5c5c'); if(S.cp) tag('中間ポイントあり','#5dffb0');
  /* できごと */
  for(let i=0;i<S.log.length;i++){ const l=S.log[i]; g.globalAlpha=clamp(l.t,0,1)*(i?.75:1); if(TALLPAD) txt(l.s,24,BOTY+40+i*38,30,l.c,'left'); else txt(l.s,W-24,BOTY-34-i*38,28,l.c,'right','rgba(0,0,0,.75)'); } g.globalAlpha=1;
  if(S.banner){ const b=S.banner, k=clamp(b.t/.18,0,1), al=clamp((2.2-b.t)/.3,0,1); g.globalAlpha=al; txtD(b.a,W/2,470,96*(.7+.3*k),b.c,'center','#111'); if(b.b) txt(b.b,W/2,560,36,'#fff','center','#111'); g.globalAlpha=1; }
  if(S.mode==='allclear'){ const k=clamp(S.clearT/.4,0,1); g.fillStyle='rgba(16,22,43,'+(.72*k)+')'; g.fillRect(0,TOPH,W,BOTY-TOPH); g.globalAlpha=k; txtD('全ステージ クリア！',W/2,330,84,'#ffd23f','center','#111'); txt('やられた回数',W/2-170,470,36,'#ff9aa8','center'); txtD(fmt(deaths)+'回',W/2-170,550,84,'#fff'); txt('かかった時間',W/2+190,470,36,'#9fd0ff','center'); txtD(tstr(playT),W/2+190,550,84,'#fff'); txt('おつかれさま！',W/2,680,48,'#fff','center'); if(S.clearT>3 && Math.floor(T*2)%2) txt('ジャンプを押すと、最初からもう一度',W/2,780,34,'#ffd23f','center'); g.globalAlpha=1; }
  if(S.mode==='dead'){ const k=clamp(S.deadT/.2,0,1); txtD('×',W/2,480,220*(1.3-.3*k),'#e23a3a','center','#fff'); txt(fmt(deaths)+'回目',W/2,620,56,'#fff','center','#111'); }
  if(S.t<5 && stageI===0 && S.stDeaths===0 && deaths===0 && !S.log.length){ txt('← → で動く　ジャンプで跳ぶ　旗まで行けばクリア',W/2,BOTY-40,32,'#111','center','#fff'); } }
function txtD(s,x,y,size,color,align,stroke){ txt(s,x,y,size,color,align||'center',stroke,FONTD); }

/* ===== 画面に合わせる・テスト・ループ ===== */
/* スマホの縦画面では、操作ボタンをゲームの下の空いた場所に大きく出す。それ以外は、ゲームの下の帯に重ねる */
let TALLPAD=false;
function fit(){ const iw=window.innerWidth, ih=window.innerHeight, k=Math.min(iw/W,ih/H), w=Math.floor(W*k), pads=document.getElementById('pads'); stage.style.width=w+'px'; stage.style.height=w+'px'; stage.style.fontSize=(w/108)+'px';
  const rest=ih-w; TALLPAD=rest>w*.3; if(TALLPAD){ const hh=Math.min(rest-24,w*.44); pads.style.left=((iw-w)/2)+'px'; pads.style.width=w+'px'; pads.style.top=(w+12)+'px'; pads.style.height=hh+'px'; pads.style.fontSize=(w/108*1.5)+'px'; }
  else { pads.style.left=((iw-w)/2)+'px'; pads.style.width=w+'px'; pads.style.top=(w*(1-.128))+'px'; pads.style.height=(w*.116)+'px'; pads.style.fontSize=(w/108)+'px'; } }
window.addEventListener('resize',fit); fit();
const tp=document.getElementById('tp'), NAMES=['たぬ吉','ぽんた','みけ','そら','りく','はな','こてつ','もも','ゆず','まる'];
document.getElementById('testBtn').onclick=()=>{ tp.hidden=!tp.hidden; };
tp.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b) return; const a=b.dataset.a; tp.hidden=true; if(a==='close') return; if(Game[a]) Game[a](pick(NAMES)); });
newRun(false);
let last=performance.now(); window.__ready=false;
function loop(now){ let dt=Math.min(.05,(now-last)/1000); last=now; if(!window.__frozen){ const n=Math.max(1,Math.ceil(dt/(1/120))); for(let i=0;i<n;i++) update(dt/n); draw(); } requestAnimationFrame(loop); }
window.__dbg={ get S(){ return S; }, set S(v){ S=v; }, Game, STAGES, PH, T_, IN, KEYS, update, draw, tile, solid, RIF, JAMQ, jumpPress, jumpRelease, WAITQ, get playT(){ return playT; }, get deaths(){ return deaths; }, get stageI(){ return stageI; }, set stageI(v){ stageI=v; newRun(false); } };
Promise.all([document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()].concat(Object.values(IMG).map(im=>new Promise(r=>{ if(im.complete) r(); else { im.onload=r; im.onerror=r; } })))).then(()=>{ window.__ready=true; requestAnimationFrame(loop); });
</script>
