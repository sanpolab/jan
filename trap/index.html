<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>ワナだらけ（試作）</title>
<style>
@font-face{font-family:MPR;src:url(./font/mpr.woff2) format('woff2');font-weight:900;font-display:swap}
@font-face{font-family:DELA;src:url(./font/dela.woff2) format('woff2');font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#10162b;overflow:hidden;font-family:MPR,'Hiragino Sans','Noto Sans JP',sans-serif;font-weight:900;touch-action:none}
#stage{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:10px;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#testBtn{position:absolute;right:.7em;top:.6em;font:inherit;font-size:1.75em;background:#fff;color:#111;border:.12em solid #111;border-radius:2em;padding:.2em .7em;z-index:5}
#tp{position:absolute;right:1em;top:5em;width:60em;max-height:84%;overflow:auto;background:rgba(255,255,255,.97);border:.3em solid #111;border-radius:1.6em;padding:1em 1.4em 1.6em;z-index:6;touch-action:pan-y}
#tp h3{margin:.7em 0 .3em;font-size:2em;color:#111}
#tp button{font:inherit;font-size:1.7em;line-height:1.25;color:#fff;border:0;border-radius:.6em;padding:.5em .4em;margin:.2em;width:9.6em;vertical-align:top}
#tp .j{background:#c0392b}#tp .h{background:#1f9a55}#tp .n{background:#444}
/* 操作ボタン：画面の下の帯に置く（左に ← →、右にジャンプ）。2本の指で同時に押せる */
#pads{position:fixed;z-index:4;touch-action:none}
.pad{position:absolute;top:0;height:100%;border-radius:1.6em;border:.4em solid #fff;background:rgba(255,255,255,.14);color:#fff;font-family:DELA,MPR,sans-serif;font-weight:400;display:flex;align-items:center;justify-content:center;touch-action:none}
.pad.on{background:#ffd23f;color:#111;border-color:#ffd23f}
#bL{left:2%;width:19%;font-size:6em}#bR{left:23%;width:19%;font-size:6em}#bJ{right:2%;width:34%;font-size:4.6em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1080" height="1080"></canvas>
  <button id="testBtn" type="button">テスト</button>
  <div id="tp" hidden>
    <h3>お助け</h3>
    <button class="h" data-a="check">中間ポイント<br>今いる場所から再開</button><button class="h" data-a="barrier">バリア<br>1回だけ守る</button><button class="h" data-a="bridge">足場<br>この先の穴をふさぐ</button><button class="h" data-a="sweep">おそうじ<br>画面の罠を全部消す</button><button class="h" data-a="winUp">WIN ＋1</button>
    <h3>妨害</h3>
    <button class="j" data-a="spike">トゲ<br>目の前に飛び出す</button><button class="j" data-a="crumble">床ぬけ<br>足元がくずれる</button><button class="j" data-a="drop">落石<br>頭の上から</button><button class="j" data-a="ghost">見えないブロック<br>頭の上に12秒</button><button class="j" data-a="bullet">矢<br>右から飛んでくる</button><button class="j" data-a="wall">せまるトゲ壁<br>6秒 左から追ってくる</button><button class="j" data-a="reverse">あべこべ<br>8秒 左右が逆</button><button class="j" data-a="fake">ニセのゴール<br>さわるとやられる</button><button class="j" data-a="winDown">WIN −1</button>
    <h3>その他</h3>
    <button class="n" data-a="next">次のステージへ</button><button class="n" data-a="reset">記録を消す</button><button class="n" data-a="close">とじる</button>
  </div>
</div>
<div id="pads"><div class="pad" id="bL">←</div><div class="pad" id="bR">→</div><div class="pad" id="bJ">ジャンプ</div></div>
<script>
'use strict';
/* ===== ワナだらけ（試作）：初見殺しの罠だらけの横スクロール。←→とジャンプでゴールの旗まで行く。
   ギフトで罠（妨害）やお助けがその場に出る。キャラもステージもオリジナル ===== */
const W=1080, H=1080, FONT="MPR,'Hiragino Sans','Noto Sans JP',sans-serif", FONTD="DELA,"+FONT;
const cv=document.getElementById('cv'), g=cv.getContext('2d'), stage=document.getElementById('stage');
const TS=60, ROWS=12, OY=210, TOPH=172, BOTY=930;   /* 1マス60。ゲームの世界は画面の y=210〜930 に12段 */
const PH={run:330,acc:3200,air:2400,fric:3000,grav:2400,jump:-985,cut:.45,maxFall:1150,coyote:.09,buf:.12,w:36,h:50,spring:-1500};
const T_={dead:1.0,clear:2.4,hPop:.1,fFall:.22,crumb:.55,drop:.55,ghost:12,bulletV:560,bulletWarn:.55,wallT:6,wallV:255,rev:8,bridge:15,inv:1.0};
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, pick=a=>a[Math.floor(Math.random()*a.length)], fmt=n=>Math.round(n).toLocaleString('en-US');

/* ===== ステージ：地面は下2段。そこから穴をあけたり、ものを置いたりして作る =====
   #＝地面　=＝ブロック　^＝トゲ　v＝天井のトゲ　h＝かくれトゲ（近づくと飛び出す）　f＝のると落ちる床　i＝見えないブロック　L＝バネ */
function mk(name,n,ops){ const rows=[]; for(let r=0;r<ROWS;r++) rows.push(new Array(n).fill(r>=10?'#':'.')); const t={name,n,rows,ents:[],start:[2,9]};
  const put=(x,y,c)=>{ if(x>=0&&x<n&&y>=0&&y<ROWS) rows[y][x]=c; };
  ops({ p:put, gap:(x,w)=>{ for(let i=0;i<w;i++){ put(x+i,10,'.'); put(x+i,11,'.'); } }, box:(x,y,w,h,c)=>{ for(let i=0;i<w;i++) for(let j=0;j<h;j++) put(x+i,y+j,c||'='); },
    row:(x,y,w,c)=>{ for(let i=0;i<w;i++) put(x+i,y,c); }, fall:(x,w)=>{ for(let i=0;i<w;i++){ put(x+i,10,'f'); put(x+i,11,'.'); } }, e:(k,x,y,o)=>t.ents.push(Object.assign({k,x,y},o||{})) }); return t; }
/* ステージは「ふつうの道」にしてある（穴・段差・見えているトゲだけ）。罠はギフトで足してもらう */
const STAGES=[
 mk('はじめの一歩',56,s=>{ s.p(12,9,'^'); s.gap(18,2); s.box(26,9,1,1); s.box(27,8,1,2); s.gap(34,2); s.p(42,9,'^'); s.e('goal',52,9); }),
 mk('でこぼこ道',60,s=>{ s.gap(10,2); s.box(16,8,3,1); s.gap(24,3); s.box(30,9,1,1); s.box(31,8,1,2); s.box(32,7,1,3); s.row(36,9,2,'^'); s.gap(44,2); s.e('goal',56,9); }),
 mk('あなぼこ',62,s=>{ s.gap(9,2); s.gap(14,2); s.gap(20,3); s.box(27,7,4,1); s.gap(33,3); s.p(40,9,'^'); s.gap(45,2); s.gap(50,2); s.e('goal',58,9); }),
 mk('かいだん',64,s=>{ s.box(10,9,1,1); s.box(11,8,1,2); s.box(12,7,1,3); s.box(13,6,6,1); s.gap(22,3); s.gap(30,8); s.box(28,8,2,1); s.box(33,7,2,1); s.p(44,9,'^'); s.p(50,9,'^'); s.e('goal',60,9); }),
 mk('さいごの道',70,s=>{ s.p(9,9,'^'); s.gap(13,3); s.box(19,9,1,1); s.box(20,8,1,2); s.p(22,9,'^'); s.gap(27,2); s.gap(31,2); s.box(37,7,3,1); s.row(37,9,3,'^'); s.gap(46,3); s.row(52,9,2,'^'); s.gap(58,2); s.e('goal',66,9); }) ];

/* ===== 状態 ===== */
let S, wins=0, deaths=0, stageI=0, T=0;
try{ const o=JSON.parse(localStorage.getItem('trap_save')||'{}'); wins=o.wins|0; deaths=o.deaths|0; stageI=clamp(o.stage|0,0,STAGES.length-1); }catch(e){}
function save(){ try{ localStorage.setItem('trap_save',JSON.stringify({wins,deaths,stage:stageI})); }catch(e){} }
function newRun(keepCp){ const st=STAGES[stageI], cp=keepCp&&S?S.cp:null, sd=S?S.stDeaths||0:0, sp=cp||{x:st.start[0]*TS+TS/2,y:(st.start[1]+1)*TS};
  S={ mode:'play', n:st.n, t:0, map:st.rows.map(r=>r.slice()), ents:st.ents.map(e=>Object.assign({},e,{st:'wait',t:0,px:e.x*TS+TS/2,py:(e.y+1)*TS,vy:0,dir:e.v||1})), p:{x:sp.x,y:sp.y,vx:0,vy:0,face:1,ground:false,coy:0,buf:0,run:0,jumping:false},
    cp, stDeaths:keepCp?sd:0, cam:0, parts:[], pops:[], crumbs:[], debris:[], warns:[], bullets:[], drops:[], ghosts:[], bridges:[], wall:null, revT:0, barrier:0, invT:1, safe:{x:sp.x,y:sp.y}, shake:0, flash:0, red:0, log:S?S.log:[], banner:null, wanim:[], deadT:0, clearT:0, fakeHit:null };
  S.cam=clamp(S.p.x-W*.38,0,S.n*TS-W); }
const logAdd=(s,c)=>{ S.log.unshift({s,c:c||'#fff',t:6}); S.log.length=Math.min(S.log.length,3); };
const banner=(a,c,b)=>{ S.banner={a,b:b||'',c:c||'#fff',t:0}; };
const tile=(tx,ty)=>(ty<0?'.':(ty>=ROWS||tx<0||tx>=S.n)?(tx<0||tx>=S.n?'#':'.'):S.map[ty][tx]);
const solidCh=c=>c==='#'||c==='='||c==='f'||c==='i'||c==='b'||c==='r';   /* r＝落ちてきて残った岩 */   /* b＝お助けの足場 */
const solid=(tx,ty)=>solidCh(tile(tx,ty));
const setT=(tx,ty,c)=>{ if(tx>=0&&tx<S.n&&ty>=0&&ty<ROWS) S.map[ty][tx]=c; };
function burst(x,y,cols,n,v){ for(let i=0;i<n;i++) S.parts.push({x,y,vx:rand(-v,v),vy:rand(-v*1.3,v*.3),g:1800,t:rand(.4,.9),s:pick([8,12,16]),c:pick(cols)}); }

/* ===== 音（効果音ラボ） ===== */
const SND=['jump','crash','lose','goal','clap','cheer','heavy','crack','rockhit','boyon','pon','swing','kick','harp','harp2','glass','dark','bad','guard','bless','levelup','fanfare','don','block','punch','beam','bell','wing'], sndBuf={}; let actx=null, seGain=null; const SE_LAST={};
function audioInit(){ if(actx) return; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); seGain=actx.createGain(); seGain.gain.value=.8; const hs=actx.createBiquadFilter(); hs.type='highshelf'; hs.frequency.value=5000; hs.gain.value=-6; seGain.connect(hs); hs.connect(actx.destination);
  for(const k of SND) fetch('./snd/'+k+'.mp3').then(r=>r.arrayBuffer()).then(b=>actx.decodeAudioData(b)).then(b=>{ sndBuf[k]=b; }).catch(()=>{}); }catch(e){} }
function play(k,v){ if(!actx || !sndBuf[k]) return; const now=actx.currentTime; if(SE_LAST[k] && now-SE_LAST[k]<.05) return; SE_LAST[k]=now; try{ const s=actx.createBufferSource(), gn=actx.createGain(); s.buffer=sndBuf[k]; gn.gain.value=v==null?.7:v; s.connect(gn); gn.connect(seGain); s.start(); }catch(e){} }
window.addEventListener('pointerdown',()=>{ audioInit(); if(actx && actx.state==='suspended') actx.resume(); },{passive:true});

/* ===== 操作 ===== */
const IN={l:false,r:false,j:false}, KEYS={};
function padBind(id,k){ const el=document.getElementById(id); const on=e=>{ e.preventDefault(); IN[k]=true; el.classList.add('on'); if(k==='j') jumpPress(); try{ el.setPointerCapture(e.pointerId); }catch(_){} }, off=e=>{ IN[k]=false; el.classList.remove('on'); if(k==='j') jumpRelease(); };
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off); el.addEventListener('lostpointercapture',off); }
padBind('bL','l'); padBind('bR','r'); padBind('bJ','j');
function jumpPress(){ if(S.mode==='play') S.p.buf=PH.buf; }
function jumpRelease(){ const p=S.p; if(p.jumping && p.vy<0){ p.vy*=PH.cut; } p.jumping=false; }
window.addEventListener('keydown',e=>{ if(e.repeat) return; KEYS[e.code]=true; if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='KeyZ'){ e.preventDefault(); jumpPress(); } if(e.code==='ArrowLeft'||e.code==='ArrowRight') e.preventDefault(); });
window.addEventListener('keyup',e=>{ KEYS[e.code]=false; if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='KeyZ') jumpRelease(); });
const axis=()=>{ let a=((IN.r||KEYS.ArrowRight||KEYS.KeyD)?1:0)-((IN.l||KEYS.ArrowLeft||KEYS.KeyA)?1:0); return S.revT>0?-a:a; };

/* ===== ギフトで起きること ===== */
const pTile=()=>({tx:Math.floor(S.p.x/TS), ty:Math.floor((S.p.y-1)/TS)});
function groundBelow(tx,fromTy){ for(let y=Math.max(0,fromTy);y<ROWS;y++) if(solid(tx,y)) return y; return -1; }
const Game={
  /* お助け */
  check(n){ const s=S.safe; S.cp={x:s.x,y:s.y}; S.ents=S.ents.filter(e=>!e.gift||e.k!=='check'); S.ents.push({k:'check',gift:true,x:Math.floor(s.x/TS),y:Math.floor(s.y/TS)-1,px:s.x,py:s.y,st:'on',t:0}); play('bless',.7); burst(s.x,s.y-40,['#5dffb0','#fff'],14,300); logAdd((n||'だれか')+' が中間ポイントを置いた','#5dffb0'); },
  barrier(n){ if(S.barrier>=3){ logAdd((n||'だれか')+' のバリア（もう3枚ある）','#8fd3ff'); return; } S.barrier++; play('guard',.7); logAdd((n||'だれか')+' がバリアをくれた（'+S.barrier+'枚）','#8fd3ff'); },
  bridge(n){ const {tx,ty}=pTile(); let done=0; for(let x=tx;x<tx+14 && x<S.n;x++){ if(!solid(x,10) && !solid(x,11) && tile(x,10)!=='b'){ let w=0; while(x+w<S.n && !solid(x+w,10) && w<6) w++; for(let i=0;i<w;i++){ setT(x+i,10,'b'); S.bridges.push({x:x+i,y:10,t:T_.bridge}); } done=w; break; } }
    if(!done && !S.p.ground){ const y=clamp(Math.floor(S.p.y/TS)+1,1,10); for(let i=-1;i<=1;i++) if(tile(tx+i,y)==='.'){ setT(tx+i,y,'b'); S.bridges.push({x:tx+i,y,t:T_.bridge}); done++; } }
    play('pon',.7); logAdd((n||'だれか')+(done?' が足場を出した（'+T_.bridge+'秒）':' の足場（この先に穴がなかった）'),'#5dffb0'); },
  sweep(n){ const x0=Math.floor(S.cam/TS)-1, x1=x0+20; let c=0; for(let y=0;y<ROWS;y++) for(let x=x0;x<=x1;x++){ const ch=tile(x,y); if(ch==='^'||ch==='v'||ch==='h'||ch==='p'){ setT(x,y,'.'); burst(x*TS+30,y*TS+30,['#fff','#ffd23f'],4,220); c++; } }
    for(const gh of S.ghosts) setT(gh.x,gh.y,'.'); S.ghosts=[]; c+=S.bullets.length+S.drops.length+S.warns.length; S.bullets=[]; S.drops=[]; S.warns=[]; S.pops=[]; if(S.wall){ S.wall=null; c++; } if(S.revT>0){ S.revT=0; c++; }
    S.ents=S.ents.filter(e=>{ const on=e.px>S.cam-80&&e.px<S.cam+W+80; if(on&&(e.k==='ball'||e.k==='crusher'||e.k==='fake')){ burst(e.px,e.py-30,['#fff','#ffd23f'],10,300); c++; return false; } return true; });
    S.flash=.35; play('harp2',.7); play('kick',.6); banner('おそうじ！','#ffd23f',(n||'だれか')+' が画面の罠を消した'); logAdd((n||'だれか')+' が罠を'+c+'こ消した','#5dffb0'); },
  winUp(n){ wins++; save(); S.wanim.push({t:0,d:1}); S.flash=.3; play('fanfare',.6); logAdd((n||'だれか')+' が WIN ＋1','#ffd23f'); },
  /* 妨害 */
  spike(n){ const {tx,ty}=pTile(), p=S.p; let best=null; for(const dx of [p.face*2,p.face*3,p.face,-p.face*2]){ const x=tx+dx, gy=groundBelow(x,ty-1); if(gy>0 && tile(x,gy-1)==='.'){ best={x,y:gy-1}; break; } } if(!best){ logAdd((n||'だれか')+' のトゲ（置ける場所がなかった）','#ff9aa8'); return; }
    S.warns.push({k:'spike',x:best.x,y:best.y,t:.5}); play('swing',.6); logAdd((n||'だれか')+' がトゲをしかけた','#ff9aa8'); },
  crumble(n){ const {tx,ty}=pTile(); let c=0; for(let dx=-1;dx<=1;dx++){ const gy=groundBelow(tx+dx,ty); if(gy<0) continue; const ch=tile(tx+dx,gy); if(ch==='#'||ch==='='||ch==='f'||ch==='b'){ if(!S.crumbs.some(q=>q.x===tx+dx&&q.y===gy)){ S.crumbs.push({x:tx+dx,y:gy,t:T_.crumb,deep:true}); c++; } } }
    play('crack',.7); S.shake=Math.max(S.shake,.3); logAdd((n||'だれか')+(c?' が足元をくずした':' の床ぬけ（くずす床がなかった）'),'#ff9aa8'); },
  drop(n){ const {tx}=pTile(); S.drops.push({x:tx,st:'warn',t:T_.drop,py:-80,vy:0}); play('swing',.5); logAdd((n||'だれか')+' が落石を落とした','#ff9aa8'); },
  ghost(n){ const {tx,ty}=pTile(), y=ty-2; let ok=false; for(const dx of [S.p.face,0,S.p.face*2]){ if(y>=0 && tile(tx+dx,y)==='.'){ setT(tx+dx,y,'i'); S.ghosts.push({x:tx+dx,y,t:T_.ghost,seen:false}); ok=true; break; } } play('dark',.5); logAdd((n||'だれか')+(ok?' が見えないブロックを置いた（'+T_.ghost+'秒）':' の見えないブロック（置けなかった）'),'#ff9aa8'); },
  bullet(n){ S.warns.push({k:'bullet',y:clamp(S.p.y-26,OY*0+60,10*TS-20),t:T_.bulletWarn}); play('swing',.5); logAdd((n||'だれか')+' が矢を放った','#ff9aa8'); },
  wall(n){ if(S.wall){ S.wall.t+=T_.wallT; logAdd((n||'だれか')+' がトゲ壁をのばした','#ff9aa8'); return; } S.wall={x:S.cam-260,t:T_.wallT,out:0}; play('dark',.7); play('heavy',.5); banner('うしろからトゲ壁！','#ff5c5c',n); logAdd((n||'だれか')+' がトゲ壁を呼んだ（'+T_.wallT+'秒 前に逃げろ）','#ff9aa8'); },
  reverse(n){ S.revT=Math.min(40,S.revT+T_.rev); play('bad',.6); banner('あべこべ！','#c08bff','左右が逆になった'); logAdd((n||'だれか')+' があべこべにした（'+T_.rev+'秒）','#ff9aa8'); },
  fake(n){ const {tx,ty}=pTile(); for(const dx of [S.p.face*4,S.p.face*5,S.p.face*3,-S.p.face*4]){ const x=tx+dx, gy=groundBelow(x,ty-1); if(gy>0 && tile(x,gy-1)==='.' && x>1 && x<S.n-1){ S.ents.push({k:'fake',gift:true,x,y:gy-1,px:x*TS+30,py:gy*TS,st:'wait',t:0}); play('pon',.5); logAdd((n||'だれか')+' がゴールの旗を立てた…？','#ff9aa8'); return; } } logAdd((n||'だれか')+' のニセのゴール（置けなかった）','#ff9aa8'); },
  winDown(n){ wins--; save(); S.wanim.push({t:0,d:-1}); S.red=.35; S.shake=Math.max(S.shake,.5); play('glass',.55); play('bad',.5); logAdd((n||'だれか')+' が WIN −1','#ff9aa8'); },
  next(){ stageI=(stageI+1)%STAGES.length; save(); newRun(false); },
  reset(){ wins=0; deaths=0; stageI=0; save(); newRun(false); } };
/* やられている間・ゴール演出中に届いたギフトは、ためておいて動けるようになってから順番に出す */
const WAITQ=[]; let waitT=0;
for(const k of ['check','barrier','bridge','sweep','winUp','spike','crumble','drop','ghost','bullet','wall','reverse','fake','winDown']){ const f=Game[k]; Game[k]=function(n){ if(S.mode!=='play'){ if(WAITQ.length<80) WAITQ.push(()=>f.call(Game,n)); return; } return f.call(Game,n); }; }

/* ===== やられる・ゴール ===== */
function die(cause){ const p=S.p; if(S.mode!=='play') return;
  if(S.barrier>0 && S.invT<=0){ S.barrier--; S.invT=T_.inv; play('guard',.8); S.flash=.2; burst(p.x,p.y-25,['#8fd3ff','#fff'],16,360); if(cause==='穴'){ p.x=S.safe.x; p.y=S.safe.y; p.vx=0; p.vy=0; } else { p.vy=-720; } logAdd('バリアが守った！（'+cause+'）','#8fd3ff'); return; }
  if(S.invT>0 && cause!=='穴') return;

  else if(ch==='v'){ for(let i=0;i<3;i++){ const bx=x+i*20; g.fillStyle='#c9ced8'; g.beginPath(); g.moveTo(bx,y); g.lineTo(bx+10,y+44); g.lineTo(bx+20,y); g.closePath(); g.fill(); g.strokeStyle='#111'; g.lineWidth=3; g.beginPath(); g.moveTo(bx,y); g.lineTo(bx+10,y+44); g.lineTo(bx+20,y); g.stroke(); } }
  else if(ch==='L'){ const sq=S.springFx&&S.springFx.x===tx&&S.springFx.y===ty?.4:1, hh=30*sq; g.fillStyle='#555'; g.fillRect(x+6,y+TS-8,48,8); g.strokeStyle='#888'; g.lineWidth=5; g.beginPath(); for(let i=0;i<=4;i++){ const yy=y+TS-8-hh*i/4; g.lineTo(x+(i%2?44:16),yy); } g.stroke(); g.fillStyle='#e23a3a'; g.fillRect(x+4,y+TS-8-hh-12,52,12); g.fillStyle='#ff8a8a'; g.fillRect(x+4,y+TS-8-hh-12,52,4); }
  else if(ch==='i'){ const seen=S.seenI&&S.seenI[tx+','+ty]; if(seen){ g.fillStyle='rgba(255,255,255,.75)'; g.fillRect(x,y,TS,TS); g.strokeStyle='#111'; g.lineWidth=4; g.strokeRect(x+2,y+2,TS-4,TS-4); g.fillStyle='#111'; g.fillRect(x+26,y+14,8,22); g.fillRect(x+26,y+42,8,8); } else { g.strokeStyle='rgba(255,255,255,'+(.2+.1*Math.sin(T*3+tx))+')'; g.lineWidth=3; g.setLineDash([6,10]); g.strokeRect(x+4,y+4,TS-8,TS-8); g.setLineDash([]); } } }
function rock(x,y){ g.fillStyle='#7c8088'; g.beginPath(); g.moveTo(x+10,y+4); g.lineTo(x+44,y+2); g.lineTo(x+58,y+20); g.lineTo(x+56,y+46); g.lineTo(x+40,y+58); g.lineTo(x+14,y+58); g.lineTo(x+2,y+40); g.lineTo(x+2,y+18); g.closePath(); g.fill(); g.strokeStyle='#111'; g.lineWidth=4; g.lineJoin='round'; g.stroke(); g.fillStyle='#a3a7ae'; g.fillRect(x+14,y+10,18,8); g.fillRect(x+10,y+18,8,10); g.fillStyle='#5a5e66'; g.fillRect(x+36,y+34,12,8); g.fillRect(x+20,y+44,10,6); }
function drawFlag(x,y,real,t,hit){ if(ok('flag') && !hit){ g.drawImage(IMG.flag,x-11,y-180,69,180); if(real){ const tw=(Math.sin(t*5)+1)/2; g.fillStyle='rgba(255,255,255,'+(.9*tw)+')'; g.fillRect(x-3,y-176,5,5); g.fillRect(x-9,y-170,17,3); g.fillRect(x-2,y-183,3,17); } return; }
  g.fillStyle='#eee'; g.fillRect(x-4,y-170,8,170); g.fillStyle='#999'; g.fillRect(x+2,y-170,2,170); g.fillStyle='#ffd23f'; g.fillRect(x-8,y-182,16,14); g.fillStyle='#8e4d20'; g.fillRect(x-16,y-8,32,8);
  if(hit){ g.fillStyle='#111'; g.fillRect(x+4,y-164,70,46); g.fillStyle='#fff'; g.fillRect(x+18,y-152,10,10); g.fillRect(x+46,y-152,10,10); g.fillRect(x+18,y-134,38,6); return; }
  const wv=real?Math.sin(t*6)*6:0; g.fillStyle='#e23a3a'; g.beginPath(); g.moveTo(x+4,y-164); g.lineTo(x+74,y-150+wv); g.lineTo(x+4,y-118); g.closePath(); g.fill(); g.fillStyle='#fff'; g.fillRect(x+14,y-148+wv*.3,16,12); }
function draw(){ const p=S.p; g.setTransform(1,0,0,1,0,0);
  /* 空と遠くの景色 */
  g.fillStyle='#bfe6ff'; g.fillRect(0,TOPH,W,BOTY-TOPH); const cam=S.cam; g.save(); g.beginPath(); g.rect(0,TOPH,W,BOTY-TOPH); g.clip();
  if(ok('bg')){ g.fillStyle='#84d9f4'; g.fillRect(0,TOPH,W,BOTY-TOPH); const bw=1672, off=-((cam*.25)%bw); for(let x=off;x<W;x+=bw) g.drawImage(IMG.bg,Math.round(x),185,bw+1,941); }
  else { g.fillStyle='#fff'; for(let i=0;i<8;i++){ const x=((i*310-cam*.2)%2480+2480)%2480-200, y=TOPH+50+(i*67)%170; g.fillRect(x,y,120,28); g.fillRect(x+24,y-20,68,20); g.fillRect(x-20,y+12,160,16); } }
  const sx=S.shake>0?rand(-1,1)*S.shake*14:0, sy=S.shake>0?rand(-1,1)*S.shake*14:0; g.translate(Math.round(-cam+sx),OY+Math.round(sy));
  /* マス */
  const x0=Math.max(0,Math.floor(cam/TS)-1), x1=Math.min(S.n-1,x0+20); for(let ty=0;ty<ROWS;ty++) for(let tx=x0;tx<=x1;tx++){ const ch=S.map[ty][tx]; if(ch==='.'||ch==='h') continue; let ox=0, oy=0; const cr=S.crumbs.find(q=>q.x===tx&&q.y===ty); if(cr){ ox=rand(-3,3); oy=rand(-2,2); } drawTile(ch,tx*TS+ox,ty*TS+oy,tx,ty); }
  for(let tx=x0;tx<=x1;tx++) if(S.map[ROWS-1][tx]==='#'){ if(ok('tiles')) g.drawImage(IMG.tiles,60,0,60,60,tx*TS,ROWS*TS,TS+.5,TS+.5); else { g.fillStyle='#9a6234'; g.fillRect(tx*TS,ROWS*TS,TS,40); } }
  for(const q of S.debris){ g.save(); g.translate(q.x+30,q.y+30); g.rotate(q.rot); g.translate(-30,-30); drawTile(q.c==='f'?'f':q.c,0,0,-9,-9); g.restore(); }
  /* 置いてあるもの */
  for(const e of S.ents){ if(e.k==='goal') drawFlag(e.px,e.py,true,T,false); else if(e.k==='fake') drawFlag(e.px,e.py,false,T,e.st==='hit');
    else if(e.k==='check' && ok('check')){ const on=e.st==='on'; g.globalAlpha=on?1:.5; g.drawImage(IMG.check,e.px-14,e.py-96-(on?Math.abs(Math.sin(Math.min(e.t,.6)*10))*10*(e.t<.6?1:0):0),76,96); g.globalAlpha=1; }
    else if(e.k==='check'){ const on=e.st==='on'; g.fillStyle='#eee'; g.fillRect(e.px-3,e.py-96,6,96); g.fillStyle=on?'#5dffb0':'#9aa3b5'; g.fillRect(e.px+3,e.py-(on?96:60),38,26); g.fillStyle='#fff'; g.fillRect(e.px+10,e.py-(on?90:54),10,8); }
    else if(e.k==='crusher'){ if(e.st==='fall'){ rock(e.px-30,e.py-TS); } else { const x=e.px-30, y=e.py-TS; g.fillStyle='#c9773a'; g.fillRect(x,y,TS,TS); g.fillStyle='#8e4d20'; g.fillRect(x,y+28,TS,4); g.fillRect(x,y+56,TS,4); g.fillRect(x+28,y,4,28); g.fillRect(x+12,y+32,4,24); g.fillRect(x+44,y+32,4,24); g.fillStyle='#e7a063'; g.fillRect(x,y,TS,4); } }
    else if(e.k==='ball'){ g.save(); g.translate(e.px,e.py-26); g.rotate(e.px/26); g.fillStyle='#c9ced8'; for(let i=0;i<8;i++){ g.rotate(Math.PI/4); g.beginPath(); g.moveTo(-9,-18); g.lineTo(0,-34); g.lineTo(9,-18); g.closePath(); g.fill(); g.strokeStyle='#111'; g.lineWidth=3; g.stroke(); } g.fillStyle='#333'; g.beginPath(); g.arc(0,0,21,0,7); g.fill(); g.strokeStyle='#111'; g.lineWidth=4; g.stroke(); g.fillStyle='#e23a3a'; g.fillRect(-10,-6,7,7); g.fillRect(4,-6,7,7); g.restore(); } }
  /* 予告（！）と落石・たま */
  for(const w of S.warns){ const bl=Math.floor(T*14)%2; if(w.k==='spike'){ g.fillStyle=bl?'#e23a3a':'#ffd23f'; g.fillRect(w.x*TS+4,(w.y+1)*TS-8,TS-8,8); txt('！',w.x*TS+30,w.y*TS+10,46,'#e23a3a','center','#fff',FONTD); } else if(w.k==='bullet'){ txt('！',cam+W-50,w.y,70,bl?'#e23a3a':'#ffd23f','center','#111',FONTD); g.fillStyle='rgba(226,58,58,.25)'; g.fillRect(cam,w.y-16,W,32); } }
  for(const d of S.drops){ const x=d.x*TS; if(d.st==='warn'){ const bl=Math.floor(T*14)%2; g.fillStyle='rgba(226,58,58,'+(bl?.3:.12)+')'; g.fillRect(x,0,TS,ROWS*TS); txt('！',x+30,40,60,'#e23a3a','center','#fff',FONTD); } else { rock(x,d.py-TS); } }
  for(const b of S.bullets){ const x=b.x, y=b.y; g.fillStyle='#111'; g.fillRect(x-22,y-5,66,10); g.fillStyle='#b9793a'; g.fillRect(x-20,y-3,62,6); g.fillStyle='#111'; g.beginPath(); g.moveTo(x-44,y); g.lineTo(x-18,y-15); g.lineTo(x-18,y+15); g.closePath(); g.fill(); g.fillStyle='#c9ced8'; g.beginPath(); g.moveTo(x-37,y); g.lineTo(x-21,y-9); g.lineTo(x-21,y+9); g.closePath(); g.fill(); g.fillStyle='#111'; g.fillRect(x+30,y-14,18,28); g.fillStyle='#e23a3a'; g.fillRect(x+33,y-11,12,8); g.fillRect(x+33,y+3,12,8); for(let i=1;i<=3;i++){ g.fillStyle='rgba(17,17,17,'+(.3-i*.08)+')'; g.fillRect(x+48+i*16,y-2,12,4); } }
  /* 主人公 */
  if(S.mode!=='dead'){ const pose=!p.ground?'jump':(Math.abs(p.vx)>30?(Math.floor(p.run)%2?'run1':'run2'):'stand'), bl=S.invT>0&&Math.floor(T*20)%2; if(!bl) drawHero(p.x,p.y,p.face,pose);
    if(S.barrier>0){ g.strokeStyle='rgba(143,211,255,'+(.7+.2*Math.sin(T*8))+')'; g.lineWidth=5; g.beginPath(); g.arc(p.x,p.y-27,44,0,7); g.stroke(); if(S.barrier>1) txt('×'+S.barrier,p.x+40,p.y-64,26,'#8fd3ff','left','#111'); }
    if(S.revT>0){ txt('？',p.x,p.y-82+Math.sin(T*8)*4,40,'#c08bff','center','#111',FONTD); } }
  if(S.mode==='dead' && S.corpse) drawHero(S.corpse.x,S.corpse.y,S.corpse.face,'dead',1,0);
  /* トゲ壁 */
  if(S.wall){ const wx=S.wall.x; g.fillStyle='#333'; g.fillRect(wx-400,-40,430,ROWS*TS+80); for(let y=-20;y<ROWS*TS;y+=40){ g.fillStyle='#c9ced8'; g.beginPath(); g.moveTo(wx+30,y); g.lineTo(wx+78,y+20); g.lineTo(wx+30,y+40); g.closePath(); g.fill(); g.strokeStyle='#111'; g.lineWidth=3; g.stroke(); } g.fillStyle='#e23a3a'; g.fillRect(wx-60,ROWS*TS*.35,26,26); g.fillRect(wx-60,ROWS*TS*.55,26,26); }
  for(const q of S.parts){ g.globalAlpha=clamp(q.t*3,0,1); g.fillStyle=q.c; g.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s); } g.globalAlpha=1;
  if(S.fakeHit && S.fakeHit.t<1.2){ txt('ハズレ',S.fakeHit.x,S.fakeHit.y-220-S.fakeHit.t*40,70,'#e23a3a','center','#fff',FONTD); }
  g.restore();
  if(S.flash>0){ g.fillStyle='rgba(255,255,255,'+clamp(S.flash*1.6,0,.8)+')'; g.fillRect(0,TOPH,W,BOTY-TOPH); } if(S.red>0){ g.fillStyle='rgba(226,58,58,'+clamp(S.red*.9,0,.4)+')'; g.fillRect(0,TOPH,W,BOTY-TOPH); }
  if(S.revT>0){ g.fillStyle='rgba(160,90,255,.12)'; g.fillRect(0,TOPH,W,BOTY-TOPH); }
  drawHud(); }
function drawHud(){ g.fillStyle='#1b2440'; g.fillRect(0,0,W,TOPH); g.fillStyle='#ffd23f'; g.fillRect(0,TOPH-6,W,6); g.fillStyle='#1b2440'; g.fillRect(0,BOTY,W,H-BOTY); g.fillStyle='#ffd23f'; g.fillRect(0,BOTY,W,6);
  txt('ステージ '+(stageI+1)+' / '+STAGES.length,24,40,34,'#fff'); txt(STAGES[stageI].name,24,84,30,'#9fb0d8'); txt('このステージ '+S.stDeaths+'回',24,128,28,'#ff9aa8');
  txt('やられた回数',W/2-40,34,30,'#ff9aa8','center'); txtD(fmt(deaths),W/2-40,104,96,S.mode==='dead'?'#ff5c5c':'#fff'); txt('回',W/2-40+g.measureText(fmt(deaths)).width/2+34,120,36,'#fff','left');
  const bx=W-224, a=S.wanim[0]; txt('WIN',bx+60,30,30,'#fff','center'); const sc=a?1+.5*Math.max(0,1-a.t/.4):1; txtD(String(wins<0?'−'+(-wins):wins),bx+60,96,78*sc,a?(a.d>0?'#5dffb0':'#ff5c5c'):'#ffd23f'); if(a) txt(a.d>0?'＋1':'−1',bx+60,150-a.t*14,30,a.d>0?'#5dffb0':'#ff5c5c','center');
  /* 効いているもの */
  let tx=24; const tag=(s,c)=>{ g.font='900 28px '+FONT; const w=g.measureText(s).width+32; g.fillStyle=c; rr(tx,TOPH+14,w,44,22); g.fill(); txt(s,tx+16,TOPH+37,28,'#111'); tx+=w+10; };
  if(S.barrier>0) tag('バリア ×'+S.barrier,'#8fd3ff'); if(S.revT>0) tag('あべこべ あと'+Math.ceil(S.revT)+'秒','#c08bff'); if(S.wall&&S.wall.t>0) tag('トゲ壁 あと'+Math.ceil(S.wall.t)+'秒','#ff9aa8'); if(S.cp) tag('中間ポイントあり','#5dffb0');
  /* できごと */
  for(let i=0;i<S.log.length;i++){ const l=S.log[i]; g.globalAlpha=clamp(l.t,0,1)*(i?.75:1); if(TALLPAD) txt(l.s,24,BOTY+40+i*38,30,l.c,'left'); else txt(l.s,W-24,BOTY-34-i*38,28,l.c,'right','rgba(0,0,0,.75)'); } g.globalAlpha=1;
  if(S.banner){ const b=S.banner, k=clamp(b.t/.18,0,1), al=clamp((2.2-b.t)/.3,0,1); g.globalAlpha=al; txtD(b.a,W/2,470,96*(.7+.3*k),b.c,'center','#111'); if(b.b) txt(b.b,W/2,560,36,'#fff','center','#111'); g.globalAlpha=1; }
  if(S.mode==='dead'){ const k=clamp(S.deadT/.2,0,1); txtD('×',W/2,480,220*(1.3-.3*k),'#e23a3a','center','#fff'); txt(fmt(deaths)+'回目',W/2,620,56,'#fff','center','#111'); }
  if(S.t<5 && stageI===0 && S.stDeaths===0 && deaths===0){ txt('← → で動く　ジャンプで跳ぶ　旗まで行けばWIN',W/2,BOTY-40,32,'#111','center','#fff'); } }
function txtD(s,x,y,size,color,align,stroke){ txt(s,x,y,size,color,align||'center',stroke,FONTD); }

/* ===== 画面に合わせる・テスト・ループ ===== */
/* スマホの縦画面では、操作ボタンをゲームの下の空いた場所に大きく出す。それ以外は、ゲームの下の帯に重ねる */
let TALLPAD=false;
function fit(){ const iw=window.innerWidth, ih=window.innerHeight, k=Math.min(iw/W,ih/H), w=Math.floor(W*k), pads=document.getElementById('pads'); stage.style.width=w+'px'; stage.style.height=w+'px'; stage.style.fontSize=(w/108)+'px';
  const rest=ih-w; TALLPAD=rest>w*.3; if(TALLPAD){ const hh=Math.min(rest-24,w*.44); pads.style.left=((iw-w)/2)+'px'; pads.style.width=w+'px'; pads.style.top=(w+12)+'px'; pads.style.height=hh+'px'; pads.style.fontSize=(w/108*1.5)+'px'; }
  else { pads.style.left=((iw-w)/2)+'px'; pads.style.width=w+'px'; pads.style.top=(w*(1-.128))+'px'; pads.style.height=(w*.116)+'px'; pads.style.fontSize=(w/108)+'px'; } }
window.addEventListener('resize',fit); fit();
const tp=document.getElementById('tp'), NAMES=['たぬ吉','ぽんた','みけ','そら','りく','はな','こてつ','もも','ゆず','まる'];
document.getElementById('testBtn').onclick=()=>{ tp.hidden=!tp.hidden; };
tp.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b) return; const a=b.dataset.a; tp.hidden=true; if(a==='close') return; if(Game[a]) Game[a](pick(NAMES)); });
newRun(false);
let last=performance.now(); window.__ready=false;
function loop(now){ let dt=Math.min(.05,(now-last)/1000); last=now; if(!window.__frozen){ const n=Math.max(1,Math.ceil(dt/(1/120))); for(let i=0;i<n;i++) update(dt/n); draw(); } requestAnimationFrame(loop); }
window.__dbg={ get S(){ return S; }, set S(v){ S=v; }, Game, STAGES, PH, T_, IN, KEYS, update, draw, tile, solid, jumpPress, jumpRelease, WAITQ, get wins(){ return wins; }, get deaths(){ return deaths; }, get stageI(){ return stageI; }, set stageI(v){ stageI=v; newRun(false); } };
Promise.all([document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()].concat(Object.values(IMG).map(im=>new Promise(r=>{ if(im.complete) r(); else { im.onload=r; im.onerror=r; } })))).then(()=>{ window.__ready=true; requestAnimationFrame(loop); });
</script>
