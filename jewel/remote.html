<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>宝石クルーン リモコン</title>
<style>
body{margin:0;background:#070405;color:#f3ead2;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
.pg{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;color:#e9c46a;margin:6px 0 4px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
h2{font-size:15px;color:#e9c46a;margin:20px 0 8px;border-bottom:1px solid #5c4210;padding-bottom:4px}
p{font-size:13px;line-height:1.7;color:#cbbf9f;margin:6px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:700;font-size:17px;padding:16px 8px;border-radius:12px;border:1px solid #a9812f;background:#17100c;color:#f3ead2;cursor:pointer;touch-action:manipulation}
button:active{background:#e9c46a;color:#1a1004}
button.r{border-color:#ff3b5c;color:#ff9aa8}button.b{border-color:#4aa3ff;color:#9fd0ff}button.s{font-size:14px;padding:10px}
input{font:inherit;font-size:16px;width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #a9812f;background:#17100c;color:#fff}
code{display:block;word-break:break-all;background:#17100c;border:1px solid #5c4210;border-radius:10px;padding:10px;font-size:12px;color:#fff;margin:6px 0}
#msg{position:sticky;bottom:0;background:#070405;padding:10px 0;font-size:14px;color:#9fe6b0;min-height:1.4em;text-align:center}
</style></head><body><div class="pg">
<h1>宝石クルーン リモコン</h1>
<p>配信ソフトに貼った画面は押せないので、ギフトが反応しなかった時などに、ここから手で動かせます。</p>
<h2>① 配信ソフトに貼るアドレス</h2>
<p>下のアドレスを、配信ソフトのソースに貼ってください（合言葉が入っています。前に貼ったアドレスは、これに貼りかえてください）。</p>
<code id="u"></code>
<div class="g"><button class="s" id="cp">縦長用をコピー</button><button class="s" id="cp2">横長用をコピー</button></div>
<h2>② スマホなど、ほかの端末をリモコンにする</h2>
<div class="g"><button class="s" id="cpr" style="grid-column:1/-1">このリモコンのアドレスをコピー（同じ合言葉つき）</button></div>
<h2>③ 手で動かす</h2>
<p>名前（画面に出る名前。空なら「配信者」）</p>
<input id="nm" maxlength="20" placeholder="例：たぬ吉">
<div class="g" style="margin-top:10px">
<button data-a="gem1">玉×1</button><button data-a="gem10">玉×10</button><button data-a="gem100">玉×100</button><button data-a="gem500">玉×500</button>
<button data-a="from2">2段目から1個</button><button data-a="from3">3段目から1個</button><button data-a="from4">4段目から1個</button><button data-a="from5">FINALから1個</button>
<button class="b" data-a="x2">玉数2倍タイム</button><button class="r" data-a="dbl">確変モード</button><button data-a="cap">FINALにフタ</button><button data-a="shake">皿をゆらす</button>
<button data-a="gem5">玉×5</button><button data-a="gem30">玉×30</button><button data-a="wipe" style="grid-column:1/-1">全消し（皿の上と待ちの玉を消す）</button>
</div>
<p>合言葉を知っている人はだれでも動かせます。このページのアドレスは人に見せないでください。中つぎに外部の無料サービス（ntfy.sh）を使っています。</p>
<div id="msg"></div>
</div>
<script>
'use strict';
const Q=new URLSearchParams(location.search); let room=(Q.get('room')||'').replace(/[^A-Za-z0-9]/g,'').slice(0,40);
try{ if(room) localStorage.setItem('jewel_room',room); else room=localStorage.getItem('jewel_room')||''; }catch(e){}
if(!room){ const a=new Uint8Array(15); crypto.getRandomValues(a); room=Array.from(a,x=>'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]).join(''); try{ localStorage.setItem('jewel_room',room); }catch(e){} }
const base=location.origin+location.pathname.replace(/remote\.html$/,''), uT=base+'?view=tate&notitle=1&room='+room, uY=base+'?view=yoko&notitle=1&room='+room, uR=base+'remote.html?room='+room;
document.getElementById('u').textContent=uT; const msg=document.getElementById('msg'), say=(t,bad)=>{ msg.textContent=t; msg.style.color=bad?'#ff9aa8':'#9fe6b0'; };
const copy=(t,b)=>{ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>say('コピーしました'),()=>{ document.getElementById('u').textContent=t; say('下のわくのアドレスを長押ししてコピーしてください',1); }); };
document.getElementById('cp').onclick=()=>copy(uT); document.getElementById('cp2').onclick=()=>copy(uY); document.getElementById('cpr').onclick=()=>copy(uR);
const nm=document.getElementById('nm'); try{ nm.value=localStorage.getItem('jewel_rname')||''; }catch(e){} nm.oninput=()=>{ try{ localStorage.setItem('jewel_rname',nm.value); }catch(e){} };
let last=0;
document.addEventListener('click',e=>{ const b=e.target.closest('button[data-a]'); if(!b) return; const now=Date.now(); if(now-last<400) return; last=now; if(b.dataset.a==='wipe' && !confirm('皿の上と待ちの玉をぜんぶ消します。よろしいですか？')) return;
  say('送っています…'); fetch('https://ntfy.sh/jwl'+room,{method:'POST',body:JSON.stringify({a:b.dataset.a,n:nm.value.trim().slice(0,20),t:now})}).then(r=>{ if(r.ok) say('送りました：'+b.textContent); else say('送れませんでした（'+r.status+'）。少し待ってからもう一度',1); }).catch(()=>say('送れませんでした。ネットにつながっているか見てください',1)); });
</script></body></html>
